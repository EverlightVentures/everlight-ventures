// ============================================================
// 3D PERSPECTIVE ENGINE (Trigonometry + Geometry)
// Converts 2D arena coords to pseudo-3D screen coords
// Uses vanishing point projection: objects farther away shrink
// ============================================================
const PERSPECTIVE={
  vanishX:0.5,   // vanishing point X (fraction of screen width)
  vanishY:-0.15, // vanishing point Y (above screen)
  depthScale:0.55,// how much the far end shrinks (0=flat, 1=extreme)
  tiltAngle:12,   // camera tilt in degrees (trigonometry)
};

// Perspective depth factor: calculates scale based on Y position
// Uses linear interpolation: scale = 1 - depthScale * (1 - y/ARENA_H)
// Far objects (y=0) are smaller, near objects (y=ARENA_H) are full size
function getDepthFactor(gy){
  const t=gy/ARENA_H; // 0=top(far), 1=bottom(near)
  return 1-PERSPECTIVE.depthScale*(1-t);
}

// 3D projection: arena coords -> screen coords with perspective
// Uses geometry: trapezoidal projection from vanishing point
function toScr3D(gx,gy){
  const df=getDepthFactor(gy);
  const cx=offX+ARENA_W*scale/2+shakeOffX; // center X
  const baseX=offX+gx*scale+shakeOffX;
  const baseY=offY+gy*scale+shakeOffY;
  // Lerp X toward vanishing point based on depth
  const vx=cx+W*(PERSPECTIVE.vanishX-0.5);
  const sx=vx+(baseX-vx)*df;
  const sy=baseY;
  return[sx,sy,df]; // returns [screenX, screenY, depthFactor]
}

// Inverse 3D: screen coords -> arena coords (for input)
function toGame3D(sx,sy){
  const baseY=(sy-shakeOffY-offY)/scale;
  const df=getDepthFactor(baseY);
  const cx=offX+ARENA_W*scale/2+shakeOffX;
  const vx=cx+W*(PERSPECTIVE.vanishX-0.5);
  const baseX=(sx-vx)/df+vx;
  return[(baseX-shakeOffX-offX)/scale,baseY];
}

// ============================================================
// PHYSICS ENGINE (Calculus -- integration of acceleration)
// Smooth movement with acceleration, deceleration, easing
// ============================================================
// Quadratic easing: f(t) = t^2 (acceleration)
function easeInQuad(t){return t*t;}
// Inverse quadratic: f(t) = t*(2-t) (deceleration)
function easeOutQuad(t){return t*(2-t);}
// Smooth step: f(t) = 3t^2 - 2t^3 (S-curve, calculus smooth interpolation)
function smoothStep(t){return t*t*(3-2*t);}
// Cubic bezier easing (calculus -- parametric curve evaluation)
function easeInOutCubic(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}

// Exponential decay (calculus): value * e^(-k*t)
// Used for damage falloff, speed decay, visual fading
function expDecay(value,k,t){return value*Math.exp(-k*t);}

// Velocity integration: position += velocity * dt + 0.5 * accel * dt^2
// (Calculus -- second-order integration of motion)
function integrateMotion(pos,vel,accel,dt){
  return{
    pos:pos+vel*dt+0.5*accel*dt*dt,
    vel:vel+accel*dt
  };
}

// ============================================================
// PROJECTILE PHYSICS (Trigonometry + Calculus)
// Parabolic arc: y = y0 + v0*sin(theta)*t - 0.5*g*t^2
// x = x0 + v0*cos(theta)*t
// ============================================================
let projectiles=[];

function launchProjectile(fromX,fromY,toX,toY,speed,dmg,owner,color,type,aoe){
  const dx=toX-fromX,dy=toY-fromY;
  const dist=Math.hypot(dx,dy);
  // Trigonometry: calculate launch angle
  const angle=Math.atan2(dy,dx);
  // Calculate time of flight (guard against zero distance)
  const tof=Math.max(0.05,dist/(speed*2.5));
  // Arc height: higher for longer distances (quadratic relationship)
  const arcH=Math.min(dist*0.4,4); // max arc height
  projectiles.push({
    x:fromX,y:fromY,z:0, // z = height above ground
    startX:fromX,startY:fromY,
    targetX:toX,targetY:toY,
    angle:angle,
    vx:Math.cos(angle)*speed*2.5, // trig: x-component of velocity
    vy:Math.sin(angle)*speed*2.5, // trig: y-component of velocity
    vz:arcH/tof*4, // FIXED: peak now reaches full arcH (calculus: v0 for parabolic arc)
    gravity:arcH/tof/tof*8, // FIXED: matching gravity for full arc height
    t:0,tof:tof,
    dmg:dmg,owner:owner,color:color,type:type||'bullet',
    aoe:aoe||0,alive:true,trail:[]
  });
}

function updateProjectiles(dt){
  for(const p of projectiles){
    if(!p.alive)continue;
    p.t+=dt;
    // Calculus: integrate position
    // x(t) = x0 + vx*t
    p.x=p.startX+p.vx*p.t;
    // y(t) = y0 + vy*t
    p.y=p.startY+p.vy*p.t;
    // z(t) = vz*t - 0.5*g*t^2 (parabolic arc from calculus)
    p.z=p.vz*p.t-0.5*p.gravity*p.t*p.t;
    // Trail particles (store last 5 positions)
    p.trail.push({x:p.x,y:p.y,z:p.z,t:0});
    if(p.trail.length>8)p.trail.shift();
    p.trail.forEach(tr=>tr.t+=dt);
    // Check if projectile has landed (z <= 0 after peak)
    if(p.t>=p.tof||p.z<-0.1){
      p.alive=false;
      // Apply damage at impact point
      applyProjectileDamage(p);
      addExplosionParticles(p.targetX,p.targetY,p.color,6);
      addShake(0.06);
    }
  }
  projectiles=projectiles.filter(p=>p.alive);
}

function applyProjectileDamage(p){
  const enemyOwner=1-p.owner;
  if(p.aoe>0){
    // Geometry: circle-based AoE
    // Damage falloff (calculus): dmg * e^(-2*dist/radius)
    units.forEach(u=>{
      if(u.owner!==enemyOwner||!u.alive)return;
      const d=Math.hypot(u.x-p.targetX,u.y-p.targetY);
      if(d<=p.aoe){
        const falloff=expDecay(p.dmg,2,d/p.aoe); // exponential damage falloff
        u.takeDamage(Math.floor(falloff));
        addEffect('dmg',u.x,u.y-0.4,'-'+Math.floor(falloff),'#FF0000',0.7);
      }
    });
  } else {
    // Single target: find nearest enemy to impact
    let best=null,bd=1.5;
    units.forEach(u=>{
      if(u.owner!==enemyOwner||!u.alive)return;
      const d=Math.hypot(u.x-p.targetX,u.y-p.targetY);
      if(d<bd){bd=d;best=u;}
    });
    if(best){best.takeDamage(p.dmg);addEffect('dmg',best.x,best.y-0.4,'-'+p.dmg,'#FF4444',0.5);}
  }
  // Also check tower hits
  const eTowers=p.owner===0?opponent.towers:player.towers;
  eTowers.forEach(t=>{
    if(t.destroyed)return;
    const d=Math.hypot(t.x-p.targetX,t.y-p.targetY);
    if(d<=(p.aoe||1.2)){
      const dmg2=p.aoe>0?Math.floor(expDecay(p.dmg,2,d/Math.max(p.aoe,1))):p.dmg;
      t.takeDamage(dmg2);sfxTowerHit();checkTowerDeath(t,p.owner);
    }
  });
}

// ============================================================
// COMBO & SYNERGY MATH ENGINE (Algebra)
// Eff_Power = Sum(Card_Power) * (1 + Synergy_Coeff) / Avg_Cost
// Combo multiplier: base * (1 + 0.15 * chain)^1.5
// ============================================================
let comboChain={count:0,timer:0,lastOwner:-1};
let maxCombo=0; // track peak combo for postgame

function getComboMultiplier(){
  if(comboChain.count<=0)return 1;
  // Algebra: polynomial combo scaling, CAPPED at 2.5x
  // mult = min(2.5, (1 + 0.15 * count)^1.5)
  return Math.min(2.5,Math.pow(1+0.15*comboChain.count,1.5));
}

function registerCombo(owner){
  if(owner===comboChain.lastOwner&&comboChain.timer>0){
    comboChain.count++;
    comboChain.timer=4; // 4 second window
    maxCombo=Math.max(maxCombo,comboChain.count);
    if(comboChain.count>=3){
      addEffect('announce',ARENA_W/2,ARENA_H*0.4,comboChain.count+'x COMBO!',DESIGN.colors.crownGold,1.5);
      addShake(0.1*Math.min(comboChain.count,6));
    }
  } else {
    comboChain.count=1;comboChain.timer=4;comboChain.lastOwner=owner;
    maxCombo=Math.max(maxCombo,1);
  }
}

function updateCombo(dt){
  if(comboChain.timer>0){comboChain.timer-=dt;if(comboChain.timer<=0)comboChain.count=0;}
}

// Synergy power calculation (Algebra)
// Eff_Power = Sum(Card_Power) * (1 + Synergy_Coefficient) / Avg_Cost
function calcSynergyBonus(deckIds){
  const syns=getDeckSynergies(deckIds);
  let coeff=0;
  syns.forEach(s=>{
    // Each synergy pair adds 0.08, each triple adds 0.15, 4+ adds 0.25
    if(s.count>=4)coeff+=0.25;
    else if(s.count>=3)coeff+=0.15;
    else if(s.count>=2)coeff+=0.08;
  });
  return 1+coeff;
}

// Damage formula with armor (Algebra):
// effective_dmg = raw_dmg * 100 / (100 + armor)
// With distance falloff (Calculus): * e^(-k*dist)
function calcDamage(raw,armor,dist,maxRange){
  const armorReduction=100/(100+(armor||0));
  const distFalloff=maxRange>0?expDecay(1,1.5,Math.max(0,dist-maxRange*0.5)/maxRange):1;
  return Math.floor(raw*armorReduction*distFalloff*getComboMultiplier());
}

// ============================================================
// SCREEN SHAKE (Trigonometry -- Perlin-like oscillation)
// ============================================================
let shakeTrauma=0,shakeOffX=0,shakeOffY=0;
function addShake(a){shakeTrauma=Math.min(1,shakeTrauma+a);}
function updateShake(dt){
  if(shakeTrauma>0){
    shakeTrauma=Math.max(0,shakeTrauma-dt*3.5);
    const t=shakeTrauma*shakeTrauma;
    // Trigonometry: use sin waves at different frequencies for organic shake
    const time=performance.now()*0.001;
    shakeOffX=Math.sin(time*23.7)*t*12+Math.cos(time*17.3)*t*6;
    shakeOffY=Math.sin(time*19.1)*t*12+Math.cos(time*29.8)*t*6;
  } else {shakeOffX=0;shakeOffY=0;}
}

let btnAnimState={x:0,y:0,t:0,phase:'idle'};
function triggerBtnAnim(sx,sy){btnAnimState={x:sx,y:sy,t:0,phase:'press'};}
function updateBtnAnimations(dt){
  if(btnAnimState.phase==='idle')return;
  btnAnimState.t+=dt;
  if(btnAnimState.phase==='press'&&btnAnimState.t>=DESIGN.timing.fast){
    btnAnimState.t=0;btnAnimState.phase='release';
  }
  if(btnAnimState.phase==='release'&&btnAnimState.t>=DESIGN.timing.spring){
    btnAnimState.phase='idle';
  }
}

}

// ============================================================
let celebrationState={active:false,particles:[],ring:{r:0,alpha:1},text:{y:0,alpha:1},t:0};
function triggerCelebration(cx,cy){
  const parts=[];
  for(let i=0;i<20;i++){
    const ang=Math.random()*Math.PI*2,spd=80+Math.random()*120;
    parts.push({x:cx,y:cy,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:0.6+Math.random()*0.4,t:0,
      size:3+Math.random()*4,color:Math.random()>0.3?DESIGN.colors.gold:'#FFF8DC'});
  }
  celebrationState={active:true,particles:parts,ring:{x:cx,y:cy,r:0,alpha:1},text:{x:cx,y:cy-30,alpha:1},t:0};
  sfxLevelUp();
}
function updateCelebration(dt){
  if(!celebrationState.active)return;
  celebrationState.t+=dt;
  const s=celebrationState;
  s.ring.r+=dt*200;s.ring.alpha=Math.max(0,1-s.t/0.6);
  s.text.y-=dt*40;s.text.alpha=Math.max(0,1-s.t/1.0);
  for(const p of s.particles){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;}
  if(s.t>1.2)s.active=false;
}
function renderCelebration(){
  if(!celebrationState.active)return;
  const s=celebrationState;
  // Ring
  if(s.ring.alpha>0){
    ctx.strokeStyle=DESIGN.colors.gold;ctx.lineWidth=3;ctx.globalAlpha=s.ring.alpha;
    ctx.beginPath();ctx.arc(s.ring.x,s.ring.y,s.ring.r,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
  }
  // Particles
  for(const p of s.particles){
    if(p.t>=p.life)continue;
    ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1-p.t/p.life),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  // Text
  if(s.text.alpha>0){
    ctx.globalAlpha=s.text.alpha;ctx.fillStyle=DESIGN.colors.gold;
    ctx.font='bold '+Math.floor(W*0.07)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor=DESIGN.colors.gold;ctx.shadowBlur=15;
    ctx.fillText('LEVEL UP!',s.text.x,s.text.y);
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
}

const cardLevels={};
function getCardLevel(cardId){return cardLevels[cardId]||1;}
function getUpgradeCost(lvl){return Math.floor(50*Math.pow(2,lvl-1));}
function cardLevelScale(cardId){return 1+(getCardLevel(cardId)-1)*0.10;}
function upgradeCard(cardId){
  const lvl=getCardLevel(cardId);if(lvl>=13)return false;
  const cost=getUpgradeCost(lvl);if(playerProfile.fuel<cost)return false;
  playerProfile.fuel-=cost;cardLevels[cardId]=lvl+1;sfxLevelUp();return true;
}

const CHEST_TIERS={
  wood:{name:'Wood Chest',fuel:[50,100],gears:[1,3],gems:[0,0],cards:1,color:'#8B4513',icon:'\uD83E\uDDF0'},
  silver:{name:'Silver Chest',fuel:[100,250],gears:[3,8],gems:[0,2],cards:2,color:'#C0C0C0',icon:'\uD83E\uDDF1'},
  gold:{name:'Gold Chest',fuel:[250,500],gears:[8,15],gems:[2,5],cards:3,color:DESIGN.colors.crownGold,icon:'\uD83D\uDC51'}
};
let rewardState=null;
function generateRewards(crowns){
  const tier=crowns>=3?'gold':crowns>=2?'silver':'wood';
  const ch=CHEST_TIERS[tier];
  const rn=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const fuel=rn(ch.fuel[0],ch.fuel[1]),gears=rn(ch.gears[0],ch.gears[1]),gems=rn(ch.gems[0],ch.gems[1]);
  const unlockable=ALL_CAR_IDS.filter(id=>!playerProfile.collection.includes(id)&&CARS[id]);
  const newCards=[];
  for(let i=0;i<ch.cards&&unlockable.length>0;i++){
    const idx=Math.floor(Math.random()*unlockable.length);
    newCards.push(unlockable.splice(idx,1)[0]);
  }
  return{tier,name:ch.name,color:ch.color,icon:ch.icon,fuel,gears,gems,newCards,phase:'chest',t:0};
}

const SEASON_CONFIG={maxTier:30,xpPerTier:100,winXP:30,lossXP:10,drawXP:15};
const SEASON_REWARDS=[];
(function buildSeasonRewards(){
  for(let i=1;i<=SEASON_CONFIG.maxTier;i++){
    const free=i%5===0?{type:'gems',amount:5}:i%3===0?{type:'gears',amount:3+i}:{type:'fuel',amount:50+i*10};
    const premium=i%10===0?{type:'card',id:ALL_CAR_IDS[Math.min(i+10,ALL_CAR_IDS.length-1)]}:i%5===0?{type:'gems',amount:10}:{type:'fuel',amount:100+i*15};
    SEASON_REWARDS.push({tier:i,free,premium});
  }
})();
function addSeasonXP(amount){
  playerProfile.seasonXP=(playerProfile.seasonXP||0)+amount;
  while(playerProfile.seasonXP>=SEASON_CONFIG.xpPerTier&&(playerProfile.seasonTier||0)<SEASON_CONFIG.maxTier){
    playerProfile.seasonXP-=SEASON_CONFIG.xpPerTier;
    playerProfile.seasonTier=(playerProfile.seasonTier||0)+1;
    const rwd=SEASON_REWARDS[playerProfile.seasonTier-1];
    if(rwd){
      const r=rwd.free;
      if(r.type==='fuel')playerProfile.fuel+=r.amount;
      else if(r.type==='gears')playerProfile.gears+=r.amount;
      else if(r.type==='gems')playerProfile.gems+=r.amount;
    }
    sfxLevelUp();
  }
}

const shopSoldOut={};
function seededRandom(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>{s=s*16807%2147483647;return(s-1)/2147483646;};}
function getDailyOffers(){
  const dayNum=Math.floor(Date.now()/(1000*60*60*24));
  const rng=seededRandom(dayNum*31337);
  const shuffled=[...SHOP_OFFERS_DB].sort(()=>rng()-0.5);
  const featured=shuffled[0];
  const others=shuffled.slice(1,4);
  return{featured,others,dayNum};
}
function buyShopItem(item){
  const cur=item.currency;
  if(cur==='fuel'&&playerProfile.fuel<item.price)return false;
  if(cur==='gears'&&playerProfile.gears<item.price)return false;
  if(cur==='gems'&&playerProfile.gems<item.price)return false;
  if(shopSoldOut[item.id])return false;
  if(cur==='fuel')playerProfile.fuel-=item.price;
  else if(cur==='gears')playerProfile.gears-=item.price;
  else if(cur==='gems')playerProfile.gems-=item.price;
  const r=item.reward;
  if(r.type==='fuel')playerProfile.fuel+=r.amount;
  else if(r.type==='gears')playerProfile.gears+=r.amount;
  else if(r.type==='gems')playerProfile.gems+=r.amount;
  else if(r.type==='nos')playerProfile.nosBottles+=r.amount;
  else if(r.type==='chest'){const rw=generateRewards(r.tier==='gold'?3:r.tier==='silver'?2:1);applyRewards(rw);}
  shopSoldOut[item.id]=true;sfxChestOpen();return true;
}
function applyRewards(rw){
  playerProfile.fuel+=rw.fuel;playerProfile.gears+=rw.gears;playerProfile.gems+=rw.gems;
  rw.newCards.forEach(id=>{if(!playerProfile.collection.includes(id))playerProfile.collection.push(id);});
}

let audioCtx=null;
function getAudio(){if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}return audioCtx;}
function playTone(freq,type,dur,vol,freqEnd){
  const ac=getAudio();if(!ac)return;
  try{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type=type||'sine';o.frequency.setValueAtTime(freq,ac.currentTime);if(freqEnd)o.frequency.exponentialRampToValueAtTime(Math.max(20,freqEnd),ac.currentTime+dur);g.gain.setValueAtTime(vol||0.3,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);o.start(ac.currentTime);o.stop(ac.currentTime+dur+0.05);}catch(e){}
}
function playNoise(dur,vol,fType,fFreq){
  const ac=getAudio();if(!ac)return;
  try{const buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);const src=ac.createBufferSource(),g=ac.createGain();src.buffer=buf;if(fType){const f=ac.createBiquadFilter();f.type=fType;f.frequency.value=fFreq||1000;src.connect(f);f.connect(g);}else{src.connect(g);}g.connect(ac.destination);g.gain.setValueAtTime(vol||0.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);src.start();src.stop(ac.currentTime+dur);}catch(e){}
}

class Tower {
  constructor(x,y,type,owner){
    this.x=x;this.y=y;this.type=type;this.owner=owner;
    const s=TOWER_STATS[type];
    this.maxHp=s.hp;this.hp=s.hp;this.dmg=s.dmg;this.range=s.range;this.atkSpd=s.atkSpd;this.atkCD=0;
    this.active=(type!=='king');this.destroyed=false;this.crownCounted=false;this.facing=owner===0?-1:1;
    this.hitFlash=0; // visual feedback timer
  }
  takeDamage(d){if(this.destroyed)return;this.hp=Math.max(0,this.hp-d);this.hitFlash=0.15;if(this.hp<=0){this.destroyed=true;this.hp=0;}}
}

let _uid=0;

// Unit State Machine enum
const USTATE={DEPLOY:'deploy',MOVE:'move',ACQUIRE:'acquire',WINDUP:'windup',ATTACK:'attack',RECOVER:'recover',HIT:'hit',DIE:'die'};

class Unit {
  constructor(card,owner,x,y){
    this.id=_uid++;this.card=card;this.owner=owner;this.x=x;this.y=y;
    this.maxHp=card.hp;this.hp=card.hp;this.dmg=card.dmg;
    // Physics: current velocity starts at 0, accelerates to card.speed
    // Calculus: v(t) = v_max * (1 - e^(-accel*t))
    this.maxSpeed=card.speed;this.currentSpeed=0;
    this.accel=card.accel||2.0;this.armor=card.armor||0;
    this.range=card.range;this.atkSpd=card.atkSpd;this.atkCD=0;this.abilityCD=card.abilityCD||0;
    this.target=null;this.alive=true;
    this.angle=owner===0?-Math.PI/2:Math.PI/2;
    this.targetAngle=this.angle; // smooth rotation
    this.nitroActive=false;this.nitroTimer=0;this.bobOffset=Math.random()*Math.PI*2;
    this.stealthTimer=card.ability==='STEALTH'?3:0;this.stunTimer=0;this.slowTimer=0;
    this.spawnTime=0; // starts at 0, DEPLOY state handles intro
    this.hitFlash=0;
    this.deathTimer=-1; // -1=alive, 0+=dying animation
    this.zHeight=0; // for 3D jump effects
    // --- STATE MACHINE ---
    this.state=USTATE.DEPLOY;this.stateTimer=0;
    this.deployScale=0;       // 0->1 scale-up during DEPLOY
    this.prevX=x;this.prevY=y;// previous position for trail VFX
    this.acquireTarget=null;  // locked target during ACQUIRE->WINDUP->ATTACK
    this.windupOffset=0;      // visual pullback during WINDUP
    this.hitKnockX=0;this.hitKnockY=0;// knockback displacement
    this.hitSourceAngle=0;    // angle from which damage came
    this.deathPhase=0;        // 0=freeze, 1=flash+shockwave, 2=debris
  }
  takeDamage(d,sourceX,sourceY){
    if(!this.alive)return;
    // Apply armor reduction ONLY (Algebra): effective = raw * 100/(100+armor)
    const effective=Math.floor(d*100/(100+(this.armor||0)));
    this.hp=Math.max(0,this.hp-effective);this.hitFlash=0.12;
    // Trigger HIT state interrupt (if alive after damage)
    if(this.hp>0&&this.state!==USTATE.DIE&&this.state!==USTATE.DEPLOY){
      this.state=USTATE.HIT;this.stateTimer=0;
      if(sourceX!==undefined&&sourceY!==undefined){
        this.hitSourceAngle=Math.atan2(this.y-sourceY,this.x-sourceX);
      }else{this.hitSourceAngle=this.angle+Math.PI;}
      this.hitKnockX=0;this.hitKnockY=0;
    }
    // VFX: big damage pop for heavy hits
    if(effective>=150)addBigDamagePop(this.x,this.y,effective);
    if(this.hp<=0){
      this.hp=0;this.alive=false;this.deathTimer=0;
      this.state=USTATE.DIE;this.stateTimer=0;this.deathPhase=0;
      sfxDeath();
      // Death VFX handled by state machine phases
    }
  }
  dist(ox,oy){return Math.hypot(this.x-ox,this.y-oy);}
  // Calculus: current speed based on acceleration curve
  // v(t) = v_max * (1 - e^(-accel * t))
  getSpeed(){
    const base=this.maxSpeed*(1-Math.exp(-this.accel*this.spawnTime));
    if(this.nitroActive)return base*1.5;
    if(this.slowTimer>0)return base*0.5;
    return base;
  }
}

function updateParticles(dt){
  particles.forEach(p=>{
    p.t+=dt;
    p.x+=p.vx*dt*2;p.y+=p.vy*dt*2;
    // Calculus: gravity on z-axis: z += vz*dt - 0.5*g*dt^2
    p.z+=(p.vz||0)*dt;p.vz=(p.vz||0)-9.8*dt; // gravity
    if(p.z<0){p.z=0;p.vz=Math.abs(p.vz)*0.3;} // bounce
    if(p.type==='smoke'){p.sz+=dt*0.3;}
  });
  particles=particles.filter(p=>p.t<p.dur);
  // Cap particles to prevent unbounded growth
  if(particles.length>300)particles=particles.slice(-300);
}

function renderParticles(){
  particles.forEach(p=>{
    const prog=p.t/p.dur;
    const[sx,sy,df]=toScr3D(p.x,p.y);
    const zOff=p.z*scale*df*0.8; // 3D height offset
    const sz=scale*p.sz*df; // depth-scaled size
    if(p.type==='spark'||p.type==='explosion'){
      ctx.globalAlpha=(1-prog)*0.9;ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(sx,sy-zOff,Math.max(1,sz*(1-prog*0.5)),0,Math.PI*2);ctx.fill();
      if(p.type==='explosion'){
        ctx.globalAlpha=(1-prog)*0.4;ctx.fillStyle=DESIGN.colors.crownGold;
        ctx.beginPath();ctx.arc(sx,sy-zOff,sz*0.5*(1-prog),0,Math.PI*2);ctx.fill();
      }
    } else if(p.type==='smoke'){
      ctx.globalAlpha=(1-prog)*0.3;ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(sx,sy-zOff,sz+prog*scale*0.3*df,0,Math.PI*2);ctx.fill();
    } else if(p.type==='neon'){
      ctx.globalAlpha=(1-prog)*0.5;ctx.shadowColor=p.color;ctx.shadowBlur=10*df;
      ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(sx,sy-zOff,sz*(1-prog),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    } else if(p.type==='impact_ring'){
      const ringR=sz+prog*scale*0.4*df;
      ctx.globalAlpha=(1-prog)*0.5;ctx.strokeStyle='#ffffff';ctx.lineWidth=(2-prog*1.5)*df;
      ctx.beginPath();ctx.arc(sx,sy-zOff,ringR,0,Math.PI*2);ctx.stroke();
    } else if(p.type==='debris'){
      ctx.globalAlpha=(1-prog)*0.8;ctx.fillStyle=p.color;
      ctx.save();ctx.translate(sx,sy-zOff);ctx.rotate(prog*Math.PI*4);
      const half=Math.max(1,sz*(1-prog*0.5));ctx.fillRect(-half,-half,half*2,half*2);ctx.restore();
    } else if(p.type==='deploy_ring'){
      const ringR=prog*scale*1.2*df;
      ctx.globalAlpha=(1-prog)*0.6;ctx.strokeStyle=p.color;ctx.lineWidth=(3-prog*2.5)*df;
      ctx.shadowColor=p.color;ctx.shadowBlur=6*df;
      ctx.beginPath();ctx.arc(sx,sy-zOff,ringR,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=(1-prog)*0.15;ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(sx,sy-zOff,ringR,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    } else if(p.type==='death_flash'){
      const flashR=sz*df*scale*(0.5+prog*2);
      ctx.globalAlpha=(1-prog*prog)*0.7;ctx.fillStyle='#ffffff';
      ctx.shadowColor='#ffffff';ctx.shadowBlur=15*df;
      ctx.beginPath();ctx.arc(sx,sy-zOff,flashR,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    } else if(p.type==='death_shockwave'){
      const ringR=prog*scale*2*df;
      ctx.globalAlpha=(1-prog)*0.6;ctx.strokeStyle=p.color;ctx.lineWidth=(4-prog*3)*df;
      ctx.beginPath();ctx.arc(sx,sy-zOff,ringR,0,Math.PI*2);ctx.stroke();
    } else if(p.type==='death_debris'){
      ctx.globalAlpha=(1-prog)*0.85;ctx.fillStyle=p.color;
      ctx.save();ctx.translate(sx,sy-zOff);ctx.rotate(prog*Math.PI*6);
      const half=Math.max(1,sz*(1-prog*0.3));ctx.fillRect(-half,-half,half*2,half*2);ctx.restore();
      if(prog<0.3){ctx.globalAlpha=(0.3-prog)*2;ctx.fillStyle=DESIGN.colors.crownGold;
        ctx.beginPath();ctx.arc(sx,sy-zOff,Math.max(1,sz*0.6),0,Math.PI*2);ctx.fill();}
    }
    ctx.globalAlpha=1;
  });
}

// Render projectiles in 3D
function renderProjectiles(){
  for(const p of projectiles){
    if(!p.alive)continue;
    const[sx,sy,df]=toScr3D(p.x,p.y);
    const zOff=p.z*scale*df; // height above ground
    const sz=scale*0.15*df;
    // Shadow on ground
    ctx.globalAlpha=0.3;ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(sx,sy,sz*1.5,sz*0.5,0,0,Math.PI*2);ctx.fill();
    // Projectile body
    ctx.globalAlpha=1;
    ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8*df;
    ctx.beginPath();ctx.arc(sx,sy-zOff,Math.max(2,sz),0,Math.PI*2);ctx.fill();
    // Trail (trigonometry: fading trail segments)
    ctx.shadowBlur=0;
    for(let i=0;i<p.trail.length;i++){
      const tr=p.trail[i];
      const[tx,ty,tdf]=toScr3D(tr.x,tr.y);
      const tzOff=tr.z*scale*tdf;
      const alpha=(1-i/p.trail.length)*0.4;
      ctx.globalAlpha=alpha;ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(tx,ty-tzOff,Math.max(1,sz*(1-i/p.trail.length)),0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
}

function getLevelScale(lvl){return 1+Math.min((lvl-1)*0.025,2.5);} // scales through lvl 100, caps at 3.5x

function initBattle(){
  screen='battle';phase='countdown';cdTimer=COUNTDOWN_TIME;
  phaseTimer=0;totalTime=0;units=[];effects=[];particles=[];projectiles=[];floatingEmojis=[];
  selectedCard=-1;battleResult='';deployPreview=null;_uid=0;
  doubleElixirAnnounced=false;overtimeAnnounced=false;
  overtimePulseT=0;shakeTrauma=0;shakeOffX=0;shakeOffY=0;maxCombo=0;
  hqDeadScreen={active:false,winner:-1,t:0};prevElixir=START_ELIXIR;
  emojiOpen=false;emojiCD=0;endPlayerHP=0;endOpponentHP=0;lastPlayedCard=null;
  comboChain={count:0,timer:0,lastOwner:-1};
  initRain();

  const sc=getLevelScale(currentLevel);
  player.towers=[new Tower(4,25.5,'princess',0),new Tower(14,25.5,'princess',0),new Tower(9,28,'king',0)];
  player.elixir=START_ELIXIR;player.crowns=0;

  opponent.towers=[new Tower(4,4.5,'princess',1),new Tower(14,4.5,'princess',1),new Tower(9,2,'king',1)];
  opponent.towers.forEach(t=>{t.maxHp=Math.floor(t.maxHp*sc);t.hp=t.maxHp;t.dmg=Math.floor(t.dmg*sc);});
  opponent.elixir=START_ELIXIR;opponent.crowns=0;

  setupDeck(player,playerProfile.deck);
  const aiDeck=getAIDeck(currentLevel);
  setupDeck(opponent,aiDeck);

function getAIDeck(lvl){
  if(lvl<=10) return['rust_bucket','corner_boyz','dead_mile','prospect','blackout','oil_slick','drive_by','scrapyard'];
  if(lvl<=20) return['dead_mile','scrapyard','grim_ride','axle_grind','napalm','blackout','drill_van','corner_boyz'];
  if(lvl<=40) return['grim_ride','phantom','no_face','dirty_south','napalm','turbo_boost','blackout','car_bomb'];
  if(lvl<=60) return['axle_grind','blue_line','preacher','sideshow','napalm','turbo_boost','dead_mile','blackout'];
  return DEFAULT_DECK;
}

function setupDeck(p,deckIds){
  const d=[...deckIds];for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}
  p.hand=d.slice(0,4);p.queue=d.slice(4);
}
function cycleCard(p,idx){const played=p.hand[idx];const next=p.queue.shift();p.queue.push(played);p.hand[idx]=next;}

// ============================================================
// CARD PLAY + SPELLS
// ============================================================
function playCard(p,idx,gx,gy){
  const cardId=p.hand[idx];const card=CARS[cardId];
  if(!card||p.elixir<card.cost)return false;
  p.elixir-=card.cost;

  if(card.type==='building'){
    // Buildings spawn as units at position (not as spells)
    const bUnit=new Unit(card,p===player?0:1,gx,gy);
    bUnit.maxSpeed=0;bUnit.currentSpeed=0;bUnit.accel=0; // buildings don't move
    units.push(bUnit);
    addEffect('deploy',gx,gy,'',card.carColor||'#fff',0.5);
    if(p===player){sfxDeploy();sfxCardPlay();registerCombo(0);}
    else{registerCombo(1);}
  } else if(card.type==='spell'){
    applySpell(card,p===player?0:1,gx,gy);
    if(p===player){sfxSpell();registerCombo(0);}
    else{registerCombo(1);}
  } else {
    const cnt=card.count||1;
    for(let i=0;i<cnt;i++){
      const ox=cnt>1?(i-(cnt-1)/2)*0.8:0;
      units.push(new Unit(card,p===player?0:1,gx+ox,gy));
    }
    addEffect('deploy',gx,gy,'',card.carColor||'#fff',0.5);
    if(p===player){sfxDeploy();sfxCardPlay();registerCombo(0);}
    else{registerCombo(1);}
  }
  if(p===player)lastPlayedCard=cardId;
  cycleCard(p,idx);
  return true;
}

function applySpell(card,ownerId,gx,gy){
  const r=card.radius||2,d=card.dmg||0,enemyOwner=1-ownerId;
  if(card.id==='turbo_boost'){
    units.forEach(u=>{
      if(u.owner!==ownerId||!u.alive)return;
      if(Math.hypot(u.x-gx,u.y-gy)<=r){u.nitroActive=true;u.nitroTimer=3;addEffect('ability',u.x,u.y,'TURBO!','#00CED1',0.8);}
    });
    addEffect('spell',gx,gy,'','#00CED1',0.7);return;
  }
  if(card.id==='smoke_screen'){
    units.forEach(u=>{
      if(u.owner!==enemyOwner||!u.alive)return;
      if(Math.hypot(u.x-gx,u.y-gy)<=r){u.stunTimer=1.5;addEffect('ability',u.x,u.y,'STUN!','#666',0.8);}
    });
    addEffect('spell',gx,gy,'','#888',0.7);return;
  }
  if(card.id==='oil_slick'||card.id==='spike_strip'){
    units.forEach(u=>{
      if(u.owner!==enemyOwner||!u.alive)return;
      if(Math.hypot(u.x-gx,u.y-gy)<=r){u.takeDamage(d);u.slowTimer=3;addEffect('dmg',u.x,u.y-0.4,'-'+d,'#FF0000',0.7);}
    });
    addEffect('spell',gx,gy,'',card.carColor||'#555',0.6);return;
  }
  if(card.id==='calypso_wish'){
    const roll=Math.random();
    if(roll<0.33){
      units.forEach(u=>{if(u.owner===ownerId&&u.alive&&Math.hypot(u.x-gx,u.y-gy)<=r){u.hp=Math.min(u.maxHp,u.hp+200);addEffect('ability',u.x,u.y,'+200','#44FF44',0.8);}});
      addEffect('spell',gx,gy,'HEAL!','#44FF44',1.0);
    } else if(roll<0.66){
      units.forEach(u=>{if(u.owner===enemyOwner&&u.alive&&Math.hypot(u.x-gx,u.y-gy)<=r){u.takeDamage(250);addEffect('dmg',u.x,u.y-0.4,'-250','#FF0000',0.7);}});
      const eTowers=ownerId===0?opponent.towers:player.towers;
      eTowers.forEach(t=>{if(!t.destroyed&&Math.hypot(t.x-gx,t.y-gy)<=r+1.2){t.takeDamage(250);sfxTowerHit();checkTowerDeath(t,ownerId);}});
      addEffect('spell',gx,gy,'CHAOS!','#FF4444',1.0);addExplosionParticles(gx,gy,'#CC44FF',10);
    } else {
      units.forEach(u=>{if(u.owner===ownerId&&u.alive&&Math.hypot(u.x-gx,u.y-gy)<=r){u.nitroActive=true;u.nitroTimer=4;addEffect('ability',u.x,u.y,'BOOST!','#CC44FF',0.8);}});
      addEffect('spell',gx,gy,'SPEED!','#CC44FF',1.0);
    }
    return;
  }
  // Standard damage spell
  units.forEach(u=>{
    if(u.owner!==enemyOwner||!u.alive)return;
    if(Math.hypot(u.x-gx,u.y-gy)<=r){u.takeDamage(d);addEffect('dmg',u.x,u.y-0.4,'-'+d,'#FF0000',0.7);}
  });
  const eTowers=ownerId===0?opponent.towers:player.towers;
  eTowers.forEach(t=>{
    if(t.destroyed)return;
    if(Math.hypot(t.x-gx,t.y-gy)<=r+1.2){t.takeDamage(d);addEffect('dmg',t.x,t.y-0.4,'-'+d,'#FF0000',0.7);sfxTowerHit();checkTowerDeath(t,ownerId);}
  });
  addEffect('spell',gx,gy,'',card.carColor||'#fff',0.6);
  addExplosionParticles(gx,gy,card.carColor,8);
}

// ============================================================
// BATTLE UPDATE (Physics integration)
// ============================================================
function checkHQDead(){
  const pKing=player.towers.find(t=>t.type==='king');
  const oKing=opponent.towers.find(t=>t.type==='king');
  if(pKing&&pKing.destroyed&&!pKing.crownCounted){
    pKing.crownCounted=true;sfxHQDead();addExplosionParticles(pKing.x,pKing.y,'#FF4444',20);
    hqDeadScreen={active:true,winner:1,t:0};endBattle();return true;
  }
  if(oKing&&oKing.destroyed&&!oKing.crownCounted){
    oKing.crownCounted=true;sfxHQDead();addExplosionParticles(oKing.x,oKing.y,'#4488FF',20);
    hqDeadScreen={active:true,winner:0,t:0};endBattle();return true;
  }
  return false;
}

function checkTowerDeath(t,attackerOwner){
  if(!t.destroyed||t.crownCounted)return;
  t.crownCounted=true;
  const atk=attackerOwner===0?player:opponent;
  if(t.type==='king'){
    atk.crowns=3; // King = automatic 3 crowns
  } else {
    atk.crowns++;
  }
  addExplosionParticles(t.x,t.y,attackerOwner===0?'#4488FF':'#FF4444',15);
  const def=attackerOwner===0?opponent:player;
  const king=def.towers.find(tt=>tt.type==='king');
  if(king&&!king.active)king.active=true;
  if(atk.crowns>=3)endBattle();
}

function updateBattle(dt){
  if(phase==='countdown'){cdTimer-=dt;if(cdTimer<=0){phase='regular';phaseTimer=REGULAR_TIME;}return;}
  if(phase==='ended')return;

  phaseTimer-=dt;totalTime+=dt;
  updateShake(dt);updateCombo(dt);updateRain(dt);
  if(screenFlash.active){screenFlash.t+=dt;if(screenFlash.t>=screenFlash.dur)screenFlash.active=false;}
  if(hqDeadScreen.active)hqDeadScreen.t+=dt;

  if(emojiCD>0)emojiCD-=dt;
  floatingEmojis.forEach(e=>{e.t+=dt;e.y-=dt*40;});
  floatingEmojis=floatingEmojis.filter(e=>e.t<2.5);

  // Phase transitions
  if(phase==='regular'&&phaseTimer<=10&&!overtimeAnnounced){
    overtimeAnnounced=true;addEffect('announce',ARENA_W/2,ARENA_H/2,'OVERTIME COMING!','#FF8800',2.0);
  }
  if(phaseTimer<=0){
    if(phase==='regular'){phase='overtime';phaseTimer=OVERTIME_TIME;triggerFlash('#FF8800',0.6,0.5);addEffect('announce',ARENA_W/2,ARENA_H/2,'OVERTIME! 1.5x ELIXIR','#FF8800',2.5);sfxPhaseChange();addShake(0.3);}
    else if(phase==='overtime'){phase='double';phaseTimer=DOUBLE_TIME;doubleElixirAnnounced=true;triggerFlash('#FF0000',0.7,0.5);addEffect('announce',ARENA_W/2,ARENA_H/2,'DOUBLE TIME! 3x ELIXIR','#FF0000',2.5);sfxPhaseChange();addShake(0.4);}
    else if(phase==='double'){endBattle();return;}
  }
  if(phase==='overtime'||phase==='double')overtimePulseT+=dt;

  const rate=phase==='double'?ELIXIR_RATE_3X:phase==='overtime'?ELIXIR_RATE_15X:ELIXIR_RATE;
  const wasMax=player.elixir>=ELIXIR_MAX;
  player.elixir=Math.min(ELIXIR_MAX,player.elixir+rate*dt);
  opponent.elixir=Math.min(ELIXIR_MAX,opponent.elixir+rate*dt);
  if(!wasMax&&player.elixir>=ELIXIR_MAX)sfxElixirFull();

  // Tower hit flash decay
  [...player.towers,...opponent.towers].forEach(t=>{if(t.hitFlash>0)t.hitFlash-=dt;});

  // Tower smoke
  const pKing=player.towers.find(t=>t.type==='king');
  const oKing=opponent.towers.find(t=>t.type==='king');
  if(pKing&&!pKing.destroyed&&pKing.hp/pKing.maxHp<0.3&&Math.random()<0.15)addSmokeParticle(pKing.x,pKing.y-0.8);
  if(oKing&&!oKing.destroyed&&oKing.hp/oKing.maxHp<0.3&&Math.random()<0.15)addSmokeParticle(oKing.x,oKing.y-0.8);

  updateUnits(dt);updateTowerAttacks(dt);updateProjectiles(dt);updateAI(dt);updateParticles(dt);
  checkHQDead();
  effects.forEach(e=>{e.t+=dt;if(e.t>=e.dur)e.alive=false;});
  effects=effects.filter(e=>e.alive);
  // Process death abilities before removing
  units.forEach(u=>{
    if(!u.alive&&u.deathTimer>=0&&u.deathTimer<0.1+dt&&u.deathTimer>=0.1){
      // BACKFIRE: explode on death for 200 area dmg
      if(u.card.ability==='BACKFIRE'){
        const enemyOwner=1-u.owner;
        units.forEach(o=>{if(o.owner===enemyOwner&&o.alive&&Math.hypot(o.x-u.x,o.y-u.y)<=2.5){o.takeDamage(200);addEffect('dmg',o.x,o.y-0.3,'-200','#FF4400',0.7);}});
        const bTowers=u.owner===0?opponent.towers:player.towers;
        bTowers.forEach(t2=>{if(!t2.destroyed&&Math.hypot(t2.x-u.x,t2.y-u.y)<=2.5){t2.takeDamage(200);sfxTowerHit();checkTowerDeath(t2,u.owner);}});
        addExplosionParticles(u.x,u.y,'#FF4400',15);addShake(0.25);
        addEffect('ability',u.x,u.y,'BACKFIRE!','#FF4500',1.0);
      }
      // COFFIN: deploy coffin bomb on death
      if(u.card.ability==='COFFIN'){
        const enemyOwner=1-u.owner;
        units.forEach(o=>{if(o.owner===enemyOwner&&o.alive&&Math.hypot(o.x-u.x,o.y-u.y)<=2.0){o.takeDamage(300);o.stunTimer=1.5;addEffect('dmg',o.x,o.y-0.3,'-300','#1C1C1C',0.7);}});
        addExplosionParticles(u.x,u.y,'#1C1C1C',12);
        addEffect('ability',u.x,u.y,'COFFIN BOMB!','#8B008B',1.2);
      }
      // GHOST_RIDE: keeps moving 3s after death (simplified as damage zone)
      if(u.card.ability==='GHOST_RIDE'){
        const gy2=u.owner===0?u.y-3:u.y+3;
        const enemyOwner=1-u.owner;
        units.forEach(o=>{if(o.owner===enemyOwner&&o.alive&&Math.hypot(o.x-u.x,o.y-gy2)<=2.0){o.takeDamage(100);addEffect('dmg',o.x,o.y-0.3,'-100','#20B2AA',0.6);}});
        addEffect('ability',u.x,u.y,'GHOST RIDE!','#20B2AA',1.0);
        addNeonTrail(u.x,u.y,'#20B2AA');addNeonTrail(u.x,gy2,'#20B2AA');
      }
    }
  });
  // Remove dead units after death animation
  units=units.filter(u=>u.alive||u.deathTimer<0.5);
}

function updateUnits(dt){
  for(const u of units){
    // --- DEAD UNIT: just tick death timer ---
    if(!u.alive){
      if(u.deathTimer>=0)u.deathTimer+=dt;
      if(u.state===USTATE.DIE)_updateDeathState(u,dt);
      continue;
    }
    // --- TICK COMMON TIMERS ---
    u.spawnTime+=dt;
    if(u.abilityCD>0)u.abilityCD-=dt;
    if(u.stealthTimer>0)u.stealthTimer-=dt;
    if(u.hitFlash>0)u.hitFlash-=dt;
    if(u.slowTimer>0)u.slowTimer-=dt;
    if(u.nitroActive){u.nitroTimer-=dt;if(u.nitroTimer<=0)u.nitroActive=false;}
    // --- STUN overrides all states except DEPLOY/DIE ---
    if(u.stunTimer>0){u.stunTimer-=dt;continue;}
    // Save previous position for trail VFX
    u.prevX=u.x;u.prevY=u.y;
    u.bobOffset+=dt*3;
    // Smooth angle rotation (Trigonometry: angular interpolation)
    const angleDiff=((u.targetAngle-u.angle+Math.PI*3)%(Math.PI*2))-Math.PI;
    u.angle+=angleDiff*Math.min(1,dt*8);
    u.stateTimer+=dt;
    // --- STATE MACHINE ---
    switch(u.state){
      case USTATE.DEPLOY:_updateDeployState(u,dt);break;
      case USTATE.MOVE:_updateMoveState(u,dt);break;
      case USTATE.ACQUIRE:_updateAcquireState(u,dt);break;
      case USTATE.WINDUP:_updateWindupState(u,dt);break;
      case USTATE.ATTACK:_updateAttackState(u,dt);break;
      case USTATE.RECOVER:_updateRecoverState(u,dt);break;
      case USTATE.HIT:_updateHitState(u,dt);break;
    }
  }
}
function _enterState(u,s){u.state=s;u.stateTimer=0;}
function _isTargetValid(t){if(!t)return false;if(t instanceof Tower)return!t.destroyed;return t.alive;}
function _updateDeployState(u,dt){
  const DUR=0.3;u.deployScale=Math.min(1,u.stateTimer/DUR);
  if(u.stateTimer<dt*1.5)addDeployRingVFX(u.x,u.y,u.card.carColor||'#fff');
  if(u.stateTimer>=DUR){u.deployScale=1;_enterState(u,USTATE.MOVE);}
}
function _updateMoveState(u,dt){
  // Chop Shop spawner
  if(u.card.id==='chop_shop'&&u.card.type==='building'){
    if(u.abilityCD<=0){u.abilityCD=12;const sc=CARS['rust_bucket'];
      if(sc)units.push(new Unit(sc,u.owner,u.x+(Math.random()-0.5),u.y+(u.owner===0?-1:1)));
      addEffect('ability',u.x,u.y,'SPAWN!','#AA6633',0.8);}
    return;
  }
  if(u.card.type==='building'){
    if(u.atkCD>0){u.atkCD-=dt;return;}
    findTarget(u);if(u.target){u.acquireTarget=u.target;_enterState(u,USTATE.ACQUIRE);}return;
  }
  if(u.atkCD>0)u.atkCD-=dt;
  findTarget(u);
  if(u.target){
    const hitRange=u.range+(u.target instanceof Tower?1.0:0.3);
    const d=u.dist(u.target.x,u.target.y);
    if(d<=hitRange){if(u.atkCD<=0){u.acquireTarget=u.target;_enterState(u,USTATE.ACQUIRE);}}
    else moveToward(u,u.target.x,u.target.y,dt);
  }else{
    const ek=(u.owner===0?opponent:player).towers.find(t=>t.type==='king');
    if(ek)moveToward(u,ek.x,ek.y,dt);
  }
}
function _updateAcquireState(u,dt){
  const DUR=0.1;
  if(!_isTargetValid(u.acquireTarget)){u.acquireTarget=null;_enterState(u,USTATE.MOVE);return;}
  const dx=u.acquireTarget.x-u.x,dy=u.acquireTarget.y-u.y;u.targetAngle=Math.atan2(dy,dx);
  if(u.stateTimer>=DUR)_enterState(u,USTATE.WINDUP);
}
function _updateWindupState(u,dt){
  const DUR=0.15;
  if(!_isTargetValid(u.acquireTarget)){u.acquireTarget=null;u.windupOffset=0;_enterState(u,USTATE.MOVE);return;}
  const prog=u.stateTimer/DUR;u.windupOffset=-Math.sin(prog*Math.PI)*0.15;
  if(u.stateTimer>=DUR)_enterState(u,USTATE.ATTACK);
}
function _updateAttackState(u,dt){
  u.windupOffset=0;
  if(!_isTargetValid(u.acquireTarget)){u.acquireTarget=null;_enterState(u,USTATE.MOVE);return;}
  u.target=u.acquireTarget;unitAttack(u);
  // Melee impact puff VFX
  if(u.range<=2&&u.target)addImpactPuff(u.target.x,u.target.y,u.card.carColor||'#fff');
  _enterState(u,USTATE.RECOVER);
}
function _updateRecoverState(u,dt){
  if(u.atkCD>0)u.atkCD-=dt;
  if(u.atkCD<=0){u.acquireTarget=null;_enterState(u,USTATE.MOVE);}
}
function _updateHitState(u,dt){
  const DUR=0.08,KNOCK=0.12;
  const prog=u.stateTimer/DUR,kp=1-prog;
  u.hitKnockX=Math.cos(u.hitSourceAngle)*KNOCK*kp;
  u.hitKnockY=Math.sin(u.hitSourceAngle)*KNOCK*kp;
  u.x+=u.hitKnockX*dt*10;u.y+=u.hitKnockY*dt*10;
  if(u.stateTimer>=DUR){u.hitKnockX=0;u.hitKnockY=0;_enterState(u,USTATE.MOVE);}
}
function _updateDeathState(u,dt){
  const t=u.deathTimer;
  if(t<0.1){u.deathPhase=0;}
  else if(t<0.3){if(u.deathPhase<1){u.deathPhase=1;addDeathShockwave(u.x,u.y,u.card.carColor||'#FF4400');}}
  else if(t<0.5){if(u.deathPhase<2){u.deathPhase=2;addDeathDebris(u.x,u.y,u.card.carColor||'#FF4400');}}
}

function findTarget(u){
  u.target=null;let best=Infinity;const bldOnly=u.card.targets==='buildings';
  if(!bldOnly){
    for(const o of units){
      if(o.owner===u.owner||!o.alive)continue;if(o.stealthTimer>0)continue;
      const d=u.dist(o.x,o.y);if(d<best){best=d;u.target=o;}
    }
  }
  const eTowers=u.owner===0?opponent.towers:player.towers;
  const princAlive=eTowers.filter(t=>t.type==='princess'&&!t.destroyed).length;
  if(!u.target||bldOnly){
    for(const t of eTowers){
      if(t.destroyed)continue;if(t.type==='king'&&princAlive===2)continue;
      const d=u.dist(t.x,t.y);if(d<best){best=d;u.target=t;}
    }
  }
}

function moveToward(u,tx,ty,dt){
  const onPlayerSide=u.y>RIVER_Y+RIVER_H/2;
  const targetOtherSide=u.owner===0?(ty<RIVER_Y):(ty>RIVER_Y);
  const needBridge=(u.owner===0&&onPlayerSide&&targetOtherSide)||(u.owner===1&&!onPlayerSide&&targetOtherSide);
  let mx=tx,my=ty;
  if(needBridge){
    const nearL=Math.abs(u.x-BRIDGE_LX),nearR=Math.abs(u.x-BRIDGE_RX);
    const atBridge=(nearL<BRIDGE_W/2+0.5)||(nearR<BRIDGE_W/2+0.5);
    if(!atBridge){mx=nearL<nearR?BRIDGE_LX:BRIDGE_RX;my=RIVER_Y+(u.owner===0?-0.3:0.3);}
  }
  const dx=mx-u.x,dy=my-u.y,d=Math.hypot(dx,dy);
  if(d>0.05){
    // Calculus: use acceleration curve for speed
    // v(t) = v_max * (1 - e^(-accel * t))
    const spd=u.getSpeed()*dt*2.5;
    const m=Math.min(spd,d);
    u.x+=(dx/d)*m;u.y+=(dy/d)*m;
    // Trigonometry: calculate facing angle
    u.targetAngle=Math.atan2(dy,dx);
  }
}

function unitAttack(u){
  if(!u.target)return;
  let d=u.dmg;
  // Apply combo multiplier (both player and AI can build combos)
  const comboMult=getComboMultiplier();
  registerCombo(u.owner);
  // Enhanced VFX: combo pop when multiplier > 1.5x
  if(comboMult>1.5&&u.target)addComboText(u.target.x,u.target.y-0.5,comboMult);

  // Ranged units fire projectiles (Trigonometry: launch angle)
  if(u.range>2&&u.target){
    const tx=u.target.x,ty=u.target.y;
    sfxProjectile();
    if(u.card.isArea){
      launchProjectile(u.x,u.y,tx,ty,u.range*0.8,Math.floor(d*comboMult),u.owner,u.card.carColor||'#FF4400','aoe',u.card.areaRadius||1.5);
    } else {
      launchProjectile(u.x,u.y,tx,ty,u.range*0.8,Math.floor(d*comboMult),u.owner,u.card.carColor||'#FF4400','bullet',0);
    }
    u.atkCD=1/u.atkSpd;
    // Trigger abilities
    doAbilities(u,d);
    return;
  }

  // Melee abilities
  if(u.card.ability==='RAM'&&u.abilityCD<=0){d*=2;u.abilityCD=u.card.abilityCD||8;addEffect('ability',u.x,u.y,'RAM!','#FF4500',0.9);}
  if(u.card.ability==='SHOCK'&&u.abilityCD<=0){u.abilityCD=5;if(u.target&&!(u.target instanceof Tower)){u.target.stunTimer=1;addEffect('ability',u.target.x,u.target.y,'STUN!','#FFFF00',0.8);}}
  if(u.card.ability==='JACKPOT'&&u.abilityCD<=0){const mult=1+Math.floor(Math.random()*3);d*=mult;u.abilityCD=u.card.abilityCD||6;addEffect('ability',u.x,u.y,mult+'x JACKPOT!',DESIGN.colors.crownGold,1.0);}
  if(u.card.ability==='DAZZLE'&&u.abilityCD<=0){u.abilityCD=u.card.abilityCD||8;units.forEach(o=>{if(o.owner!==u.owner&&o.alive&&u.dist(o.x,o.y)<=3){o.stunTimer=1.5;addEffect('ability',o.x,o.y,'DAZZLE!','#FF6EC7',0.8);}});}

  d=Math.floor(d*comboMult);
  if(u.card.isArea){
    const ar=u.card.areaRadius||1.5;
    // Geometry: circle intersection for AoE damage
    // Damage falls off with distance (Calculus: exponential decay)
    for(const o of units){
      if(o.owner===u.owner||!o.alive)continue;
      const dist=Math.hypot(o.x-u.target.x,o.y-u.target.y);
      if(dist<=ar){
        const falloffDmg=Math.floor(d*expDecay(1,1.5,dist/ar));
        o.takeDamage(falloffDmg);
      }
    }
    // AoE also damages towers in radius (Bug #3 fix)
    const aeTowers=u.owner===0?opponent.towers:player.towers;
    aeTowers.forEach(t2=>{
      if(t2.destroyed)return;
      const td=Math.hypot(t2.x-u.target.x,t2.y-u.target.y);
      if(td<=ar+1.0){const tdmg=Math.floor(d*expDecay(1,1.5,td/ar));t2.takeDamage(tdmg);sfxTowerHit();checkTowerDeath(t2,u.owner);}
    });
    addEffect('dmg',u.target.x,u.target.y-0.3,'-'+d,'#FF4444',0.5);
    addSparkParticles(u.target.x,u.target.y,u.card.carColor);
  } else {
    u.target.takeDamage(d,u.x,u.y);addEffect('dmg',u.target.x,u.target.y-0.3,'-'+d,'#FF4444',0.5);
  }
  if(u.target instanceof Tower){sfxTowerHit();checkTowerDeath(u.target,u.owner);}
  u.atkCD=1/u.atkSpd;
  doAbilities(u,d);
}

function doAbilities(u,d){
  if(u.card.ability==='TASER'&&u.abilityCD<=0){
    u.abilityCD=u.card.abilityCD||7;let chain=0;
    units.forEach(o=>{if(o.owner!==u.owner&&o.alive&&u.dist(o.x,o.y)<=5.5&&chain<3){o.takeDamage(Math.floor(d*0.6));chain++;addEffect('ability',o.x,o.y,'ZAP!','#1E90FF',0.6);}});
  }
  if(u.card.ability==='CHAIN'&&u.abilityCD<=0){
    u.abilityCD=u.card.abilityCD||8;
    // Chain whip: area flail damage around self
    units.forEach(o=>{if(o.owner!==u.owner&&o.alive&&u.dist(o.x,o.y)<=2.5){o.takeDamage(Math.floor(d*0.8));addEffect('dmg',o.x,o.y-0.3,'-'+Math.floor(d*0.8),'#CC6600',0.6);}});
    addEffect('ability',u.x,u.y,'CHAIN WHIP!','#CC6600',1.0);addShake(0.12);
    addSparkParticles(u.x,u.y,'#CC6600');
  }
  if(u.card.ability==='BARRAGE'&&u.abilityCD<=0){
    u.abilityCD=u.card.abilityCD||10;
    // Fire 3 projectiles in a spread (Trigonometry: angle offsets)
    if(u.target){
      const baseAngle=Math.atan2(u.target.y-u.y,u.target.x-u.x);
      for(let i=-1;i<=1;i++){
        const spreadAngle=baseAngle+i*0.15; // 0.15 radians spread
        const dist2=u.dist(u.target.x,u.target.y);
        const tx2=u.x+Math.cos(spreadAngle)*dist2;
        const ty2=u.y+Math.sin(spreadAngle)*dist2;
        setTimeout(()=>{if(u.alive)launchProjectile(u.x,u.y,tx2,ty2,5,Math.floor(d*0.4),u.owner,'#DC143C','aoe',1.2);},i===0?0:i===-1?150:300);
      }
      addEffect('ability',u.x,u.y,'BARRAGE!','#DC143C',0.9);
    }
  }
  if(u.card.ability==='NITRO'&&!u.nitroActive&&u.abilityCD<=0){
    u.nitroActive=true;u.nitroTimer=2.5;u.abilityCD=u.card.abilityCD||12;
    addEffect('ability',u.x,u.y,'NITRO!','#00BFFF',0.9);
  }
  if(u.card.ability==='BASS_DROP'){
    units.forEach(o=>{if(o.owner!==u.owner&&o.alive&&u.dist(o.x,o.y)<=4.5)o.slowTimer=Math.max(o.slowTimer,2);});
  }
  if(u.card.ability==='FLAMETHROWER'&&u.abilityCD<=0){
    u.abilityCD=1.5; // fires every 1.5s
    units.forEach(o=>{if(o.owner!==u.owner&&o.alive&&u.dist(o.x,o.y)<=3.5){o.takeDamage(Math.floor(d*0.35));addEffect('dmg',o.x,o.y-0.3,'-'+Math.floor(d*0.35),'#FF4500',0.4);}});
    addSparkParticles(u.x+(u.owner===0?-0.5:0.5),u.y,'#FF4500');
    addEffect('ability',u.x,u.y,'FIRE!','#FF4500',0.6);
  }
  if(u.card.ability==='BOSS_BUFF'&&u.abilityCD<=0){
    u.abilityCD=8;
    units.forEach(o=>{if(o.owner===u.owner&&o.alive&&o.id!==u.id&&u.dist(o.x,o.y)<=4){
      o.dmg=Math.floor(o.dmg*1.3);addEffect('ability',o.x,o.y,'BUFFED!',DESIGN.colors.crownGold,0.8);
    }});
    addEffect('ability',u.x,u.y,'BOSS BUFF!',DESIGN.colors.crownGold,1.0);
  }
  if(u.card.ability==='SPRAY'&&u.abilityCD<=0){
    u.abilityCD=5;
    // Spray: multiple small projectiles
    if(u.target){
      for(let i=-2;i<=2;i++){
        const angle2=Math.atan2(u.target.y-u.y,u.target.x-u.x)+i*0.1;
        const tx3=u.x+Math.cos(angle2)*6;const ty3=u.y+Math.sin(angle2)*6;
        launchProjectile(u.x,u.y,tx3,ty3,5,Math.floor(d*0.25),u.owner,'#7B2FBE','bullet',0);
      }
      addEffect('ability',u.x,u.y,'SPRAY!','#7B2FBE',0.8);
    }
  }
  if(u.card.ability==='CRUSH'&&u.abilityCD<=0){
    u.abilityCD=u.card.abilityCD||6;
    units.forEach(o=>{if(o.owner!==u.owner&&o.alive&&u.dist(o.x,o.y)<=2.0){o.takeDamage(Math.floor(d*1.5));o.stunTimer=0.5;addEffect('dmg',o.x,o.y-0.3,'-'+Math.floor(d*1.5),'#B8860B',0.7);}});
    addEffect('ability',u.x,u.y,'CRUSH!','#B8860B',0.9);addShake(0.15);
  }
}

function updateTowerAttacks(dt){
  for(const t of [...player.towers,...opponent.towers]){
    if(t.destroyed||!t.active)continue;
    t.atkCD-=dt;if(t.atkCD>0)continue;
    let tgt=null,bd=t.range;
    for(const u of units){
      if(u.owner===t.owner||!u.alive)continue;if(u.stealthTimer>0)continue;
      const d=Math.hypot(u.x-t.x,u.y-t.y);if(d<bd){bd=d;tgt=u;}
    }
    if(tgt){
      // Towers fire projectiles for 3D visual
      launchProjectile(t.x,t.y-0.5,tgt.x,tgt.y,6,t.dmg,t.owner,t.owner===0?'#4488FF':'#FF4444','bullet',0);
      sfxProjectile();
      t.atkCD=1/t.atkSpd;
    }
  }
}

// AI
// ============================================================
function updateAI(dt){
  opponent.aiCD+=dt;
  const aiDelay=Math.max(0.6,3.5-currentLevel*0.04);
  if(opponent.aiCD<aiDelay)return;
  opponent.aiCD=0;
  const playable=[];
  opponent.hand.forEach((cid,i)=>{const c=CARS[cid];if(c&&opponent.elixir>=c.cost)playable.push({i,cid,c});});
  if(!playable.length)return;
  if(currentLevel<=10&&opponent.elixir<7)return;
  if(currentLevel<=20&&opponent.elixir<5)return;
  const threats=units.filter(u=>u.owner===0&&u.y<RIVER_Y);
  let choice,gx,gy;
  if(threats.length>0){
    const spell=playable.find(p=>p.c.type==='spell');
    const troop=playable.find(p=>p.c.type==='troop');
    if(threats.length>=3&&spell){
      choice=spell;const avg=threats.reduce((a,u)=>({x:a.x+u.x,y:a.y+u.y}),{x:0,y:0});gx=avg.x/threats.length;gy=avg.y/threats.length;
    } else {choice=troop||playable[0];const t2=threats[0];gx=clamp(t2.x+(Math.random()-0.5)*2,1,17);gy=clamp(t2.y+1.5,2,12);}
  } else {
    const troop=playable.find(p=>p.c.type==='troop');if(!troop)return;choice=troop;
    const lane=Math.random()<0.5?'L':'R';gx=lane==='L'?3+Math.random()*3:12+Math.random()*3;gy=4+Math.random()*5;
  }
  if(choice)playCard(opponent,choice.i,gx,gy);
}

function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function calcTotalHP(p,isPlayer){
  let hp=0;p.towers.forEach(t=>{if(!t.destroyed)hp+=t.hp;});
  units.forEach(u=>{if(u.alive&&u.owner===(isPlayer?0:1))hp+=u.hp;});
  return hp;
}

function endBattle(){
  phase='ended';emojiOpen=false;
  endPlayerHP=calcTotalHP(player,true);endOpponentHP=calcTotalHP(opponent,false);
  if(player.crowns===opponent.crowns){
    if(endPlayerHP>endOpponentHP)battleResult='win';
    else if(endOpponentHP>endPlayerHP)battleResult='lose';
    else battleResult='draw';
  } else if(player.crowns>opponent.crowns)battleResult='win';
  else battleResult='lose';
  if(battleResult==='win'){
    playerProfile.nosBottles+=25+player.crowns*5;
    if(!playerProfile.completedLevels.includes(currentLevel))playerProfile.completedLevels.push(currentLevel);
    playerProfile.fuel+=100;
    rewardState=generateRewards(player.crowns);
    addSeasonXP(SEASON_CONFIG.winXP);
    sfxVictory();
  } else if(battleResult==='lose'){
    playerProfile.nosBottles=Math.max(0,playerProfile.nosBottles-15);
    addSeasonXP(SEASON_CONFIG.lossXP);
    rewardState=null;sfxDefeat();
  } else {
    playerProfile.nosBottles+=5;
    addSeasonXP(SEASON_CONFIG.drawXP);
    rewardState=null;
  }
  screen='postgame';
}

function renderScreenByName(s){
  if(s==='menu'){renderMenu();return;}
  if(s==='mode_select'){renderModeSelect();return;}
  if(s==='deck_pick'||s==='deckBuilder'){renderDeckBuilder();return;}
  if(s==='collection'){renderCollection();return;}
  if(s==='store'){renderStore();return;}
  if(s==='levels'){renderLevels();return;}
  if(s==='season'){renderSeason();return;}
  if(s==='rewards'){renderRewardScreen();return;}
  if(s==='cardDetail'){renderCardDetail();return;}
  if(s==='postgame'){renderPostGame();return;}
}
function render(ts){
  animT=(ts||0)/1000;ctx.clearRect(0,0,W,H);
  // Screen transition overlay
  if(screenTransition.active){
    const p=Math.min(1,screenTransition.t/screenTransition.dur);
    const ease=DESIGN.easing.outCubic(p);
    const slideX=W*0.15;
    // Outgoing screen (slide left + fade)
    ctx.save();ctx.globalAlpha=1-ease;ctx.translate(-slideX*ease,0);
    renderScreenByName(screenTransition.from);
    ctx.restore();
    // Incoming screen (slide in from right + fade)
    ctx.save();ctx.globalAlpha=ease;ctx.translate(slideX*(1-ease),0);
    renderScreenByName(screenTransition.to);
    ctx.restore();
    renderCelebration();
    return;
  }
  if(screen==='menu'){renderMenu();renderCelebration();return;}
  if(screen==='mode_select'){renderModeSelect();renderCelebration();return;}
  if(screen==='deck_pick'||screen==='deckBuilder'){renderDeckBuilder();renderCelebration();return;}
  if(screen==='collection'){renderCollection();renderCelebration();return;}
  if(screen==='store'){renderStore();renderCelebration();return;}
  if(screen==='levels'){renderLevels();renderCelebration();return;}
  if(screen==='season'){renderSeason();renderCelebration();return;}
  if(screen==='rewards'){renderRewardScreen();renderCelebration();return;}
  if(screen==='cardDetail'){renderCardDetail();renderCelebration();return;}
  renderArena3D();renderArenaFog();renderGodRays();
  renderDeployZone();renderTowers3D();renderUnits3D();
  renderWeather();renderProjectiles();renderParticles();
  renderEffects();renderTopBar();renderHUD();renderCards();renderEmojiPanel();renderFloatingEmojis();
  // Drag ghost during battle
  if(dragState.active)renderDragGhost();
  // Combo display
  if(comboChain.count>=2&&comboChain.timer>0){
    ctx.fillStyle=DESIGN.colors.crownGold;ctx.font='bold '+Math.floor(W*0.04)+'px Arial';
    ctx.textAlign='right';ctx.textBaseline='top';
    ctx.globalAlpha=Math.min(1,comboChain.timer);
    ctx.fillText(comboChain.count+'x COMBO',W-10,offY+10);
    ctx.globalAlpha=1;
  }
  if(phase==='countdown')renderCountdown();
  renderVignette();renderColorGrade();
  renderScreenFlash();
  if(phase==='overtime'||phase==='double')renderOvertimePulse();
  if(hqDeadScreen.active)renderHQDeadScreen();
  if(screen==='postgame')renderPostGame();
  renderCelebration();
}

function renderScreenFlash(){
  if(!screenFlash.active)return;const p=screenFlash.t/screenFlash.dur;
  ctx.globalAlpha=screenFlash.alpha*(1-p);ctx.fillStyle=screenFlash.color;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
}
function renderOvertimePulse(){
  const pulse=Math.sin(overtimePulseT*Math.PI)*0.5;if(pulse<0)return;
  ctx.globalAlpha=0.12*pulse;ctx.fillStyle=phase==='double'?'#FF0000':'#FF8800';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
}
function renderHQDeadScreen(){
  const t=hqDeadScreen.t;if(t>3)return;
  const alpha=Math.min(1,t*3);ctx.globalAlpha=alpha*0.92;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  const playerWon=hqDeadScreen.winner===0;
  const msg=playerWon?'ENEMY HQ WRECKED':'YOUR CREW IS DOWN';
  const col=playerWon?DESIGN.colors.crownGold:'#FF3333';
  ctx.save();ctx.shadowColor=col;ctx.shadowBlur=40;ctx.fillStyle=col;
  ctx.font='bold '+Math.floor(W*0.09)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(msg,W/2,H*0.35);ctx.shadowBlur=0;
  ctx.fillStyle='#fff';ctx.font='bold '+Math.floor(W*0.055)+'px Arial';
  ctx.fillText(playerWon?'VICTORY!':'GAME OVER',W/2,H*0.5);ctx.restore();
}

// ============================================================
// 3D ARENA RENDER (Perspective projection + depth)
// Uses trapezoid geometry for the arena floor
// ============================================================
function renderArena3D(){
  const arena=getArena(currentLevel);

  // Sky gradient with parallax layers
  const skyG=ctx.createLinearGradient(0,0,0,hudY);
  skyG.addColorStop(0,arena.sky1);skyG.addColorStop(1,arena.sky2);
  ctx.fillStyle=skyG;ctx.fillRect(0,0,W,hudY);

  // 3D Perspective arena floor (Geometry: trapezoid)
  // Top edge is narrower (far), bottom edge is wider (near)
  const[tlx,tly]=toScr3D(0,0);          // top-left (far)
  const[trx,_]=toScr3D(ARENA_W,0);       // top-right (far)
  const[blx,bly]=toScr3D(0,ARENA_H);    // bottom-left (near)
  const[brx,bry]=toScr3D(ARENA_W,ARENA_H); // bottom-right (near)

  // Draw trapezoid arena floor
  ctx.fillStyle=arena.road;
  ctx.beginPath();ctx.moveTo(tlx,tly);ctx.lineTo(trx,tly);ctx.lineTo(brx,bry);ctx.lineTo(blx,bly);ctx.closePath();ctx.fill();

  // 3D Sidewalks (narrower at top due to perspective)
  const swFrac=BRIDGE_LX/ARENA_W;
  const[swlx1]=toScr3D(BRIDGE_LX-1.2,0);
  const[swlx2]=toScr3D(BRIDGE_LX-1.2,ARENA_H);
  const[swrx1]=toScr3D(ARENA_W-BRIDGE_LX+1.2,0);
  const[swrx2]=toScr3D(ARENA_W-BRIDGE_LX+1.2,ARENA_H);
  ctx.fillStyle=arena.walk;
  ctx.beginPath();ctx.moveTo(tlx,tly);ctx.lineTo(swlx1,tly);ctx.lineTo(swlx2,bly);ctx.lineTo(blx,bly);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(swrx1,tly);ctx.lineTo(trx,tly);ctx.lineTo(brx,bry);ctx.lineTo(swrx2,bry);ctx.closePath();ctx.fill();

  // Neon sidewalk borders with perspective
  ctx.strokeStyle=arena.n1+'66';ctx.lineWidth=2;
  ctx.shadowColor=arena.n1;ctx.shadowBlur=6;
  ctx.beginPath();ctx.moveTo(swlx1,tly);ctx.lineTo(swlx2,bly);ctx.stroke();
  ctx.beginPath();ctx.moveTo(swrx1,tly);ctx.lineTo(swrx2,bry);ctx.stroke();
  ctx.shadowBlur=0;

  // Perspective grid lines (converge toward vanishing point)
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;
  for(let r=2;r<ARENA_H;r+=3){
    const[lx,ly]=toScr3D(0,r);const[rx]=toScr3D(ARENA_W,r);
    ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(rx,ly);ctx.stroke();
  }

  // Center lane dashes (perspective-corrected)
  ctx.strokeStyle='rgba(255,200,0,0.45)';ctx.lineWidth=Math.max(2,scale*0.08);
  for(let y=0;y<ARENA_H;y+=1.5){
    const[cx1,cy1]=toScr3D(ARENA_W/2,y);
    const[cx2,cy2]=toScr3D(ARENA_W/2,y+0.7);
    ctx.beginPath();ctx.moveTo(cx1,cy1);ctx.lineTo(cx2,cy2);ctx.stroke();
  }

  // River / crosswalk with perspective
  const[,rv0]=toScr3D(0,RIVER_Y-RIVER_H/2);const[,rv1]=toScr3D(0,RIVER_Y+RIVER_H/2);
  const[rlx0]=toScr3D(0,RIVER_Y-RIVER_H/2);const[rrx0]=toScr3D(ARENA_W,RIVER_Y-RIVER_H/2);
  const[rlx1]=toScr3D(0,RIVER_Y+RIVER_H/2);const[rrx1]=toScr3D(ARENA_W,RIVER_Y+RIVER_H/2);
  ctx.fillStyle=arena.road==='#141820'?'#0a1020':'#252526';
  ctx.beginPath();ctx.moveTo(rlx0,rv0);ctx.lineTo(rrx0,rv0);ctx.lineTo(rrx1,rv1);ctx.lineTo(rlx1,rv1);ctx.closePath();ctx.fill();
  // Crosswalk stripes
  ctx.fillStyle='rgba(255,255,255,0.18)';
  for(let x=2;x<ARENA_W-1;x+=0.7){
    const[sx1,sy1]=toScr3D(x,RIVER_Y-RIVER_H/2);const[sx2,sy2]=toScr3D(x+0.25,RIVER_Y+RIVER_H/2);
    const df1=getDepthFactor(RIVER_Y);
    ctx.fillRect(sx1,sy1,Math.max(2,(sx2-sx1)),sy2-sy1);
  }

  // Traffic lights (3D positioned)
  drawTrafficLight3D(BRIDGE_LX-1,RIVER_Y-RIVER_H/2-1.5,arena);
  drawTrafficLight3D(BRIDGE_RX+1,RIVER_Y-RIVER_H/2-1.5,arena);

  // Lane labels
  const[blxp,blyp]=toScr3D(BRIDGE_LX,RIVER_Y-RIVER_H/2-0.3);
  const[brxp]=toScr3D(BRIDGE_RX,RIVER_Y-RIVER_H/2-0.3);
  const df=getDepthFactor(RIVER_Y);
  ctx.fillStyle=arena.n1+'77';ctx.font=Math.floor(scale*0.32*df)+'px Arial';ctx.textAlign='center';
  ctx.fillText('LEFT LANE',blxp,blyp);ctx.fillText('RIGHT LANE',brxp,blyp);

  // City graffiti watermark (depth-scaled)
  ctx.save();ctx.globalAlpha=0.04;ctx.fillStyle=arena.acc;
  ctx.font='bold '+(scale*3*getDepthFactor(ARENA_H*0.2))+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  const[gwx,gwy]=toScr3D(ARENA_W/2,ARENA_H*0.2);
  ctx.fillText(arena.tag,gwx,gwy);ctx.restore();

  // 3D building silhouettes on sides (Trigonometry: perspective scaling)
  renderBuildingSilhouettes3D(arena);

  // Neon border glow
  ctx.strokeStyle=arena.n1+'55';ctx.lineWidth=3;
  ctx.shadowColor=arena.n1;ctx.shadowBlur=8;
  ctx.beginPath();ctx.moveTo(tlx,tly);ctx.lineTo(trx,tly);ctx.lineTo(brx,bry);ctx.lineTo(blx,bly);ctx.closePath();ctx.stroke();
  ctx.shadowBlur=0;

  // City-specific effects
  if(arena.style==='cyber'||arena.style==='neon'){
    ctx.globalAlpha=0.03;ctx.fillStyle='#00FFFF';
    for(let y=tly;y<bly;y+=4){
      const prog=(y-tly)/(bly-tly);
      const lx2=tlx+(blx-tlx)*prog;const rx2=trx+(brx-trx)*prog;
      ctx.fillRect(lx2,y,rx2-lx2,1);
    }
    ctx.globalAlpha=1;
  }
  if(arena.style==='casino'&&Math.random()<0.08){
    const rx2=Math.random()*ARENA_W,ry2=Math.random()*ARENA_H;
    const[spx,spy,spdf]=toScr3D(rx2,ry2);
    ctx.fillStyle=DESIGN.colors.crownGold+'66';ctx.beginPath();ctx.arc(spx,spy,2*spdf,0,Math.PI*2);ctx.fill();
  }
  // Wet asphalt reflections -- mirrored neon lines + puddles
  ctx.save();ctx.globalAlpha=0.06;
  ctx.strokeStyle=arena.n1;ctx.lineWidth=1;
  for(let r=4;r<ARENA_H;r+=5){
    const[lx,ly]=toScr3D(0,r);const[rx]=toScr3D(ARENA_W,r);
    ctx.beginPath();ctx.moveTo(lx,ly+1);ctx.lineTo(rx,ly+1);ctx.stroke();
  }
  ctx.globalAlpha=0.04;
  for(let p=0;p<5;p++){
    const px2=2+p*(ARENA_W-4)/4,py2=3+p*4.2;
    const[ppx,ppy,ppd]=toScr3D(px2,py2);
    ctx.fillStyle=arena.n1;ctx.beginPath();ctx.ellipse(ppx,ppy+2,12*ppd,4*ppd,0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

let rainDrops=[];
function initRain(){rainDrops=[];for(let i=0;i<80;i++)rainDrops.push({x:Math.random()*W,y:Math.random()*H,speed:300+Math.random()*200,len:8+Math.random()*12});}
function updateRain(dt){for(let i=0;i<rainDrops.length;i++){const d=rainDrops[i];d.y+=d.speed*dt;d.x-=d.speed*dt*0.15;if(d.y>H){d.y=-d.len;d.x=Math.random()*W;}if(d.x<-20)d.x=W+10;}}

function renderArenaFog(){
  const arena=getArena(currentLevel);if(!arena.fog)return;
  const[,ry0]=toScr3D(0,RIVER_Y-2);const[,ry1]=toScr3D(0,RIVER_Y+3);
  const fogCY=(ry0+ry1)/2,fogR=Math.max(W*0.5,(ry1-ry0)*2);
  ctx.save();ctx.globalAlpha=arena.fog.density||0.08;

  fg.addColorStop(0,arena.fog.color||'#ffffff');fg.addColorStop(0.6,(arena.fog.color||'#ffffff')+'44');fg.addColorStop(1,'transparent');
  ctx.fillStyle=fg;ctx.fillRect(0,ry0-fogR*0.3,W,fogR*1.2);

}

function renderGodRays(){
  const arena=getArena(currentLevel);
  const rayCol=arena.style==='cyber'||arena.style==='neon'?DESIGN.colors.neonCyan:DESIGN.colors.crownGold;
  ctx.save();ctx.globalAlpha=0.04;
  for(let r=0;r<3;r++){

    ctx.fillStyle=rg;
    ctx.beginPath();ctx.moveTo(rx,0);ctx.lineTo(rx+rw*0.3,0);ctx.lineTo(rx+rw,hudY*0.8);ctx.lineTo(rx+rw*0.4,hudY*0.8);ctx.closePath();ctx.fill();
  }

}

function renderWeather(){
  const arena=getArena(currentLevel);if(arena.weather!=='rain')return;

const GRAFFITI_DB={

  elevated:{tags:['THE POUND','HOWL SZN','PACK UP'],styles:['wildstyle','drip','stencil'],colors:['#0088FF','#00BBFF','#4488FF'],icon:'star',dripChance:0.4},
  rooftop:{tags:['ROOFTOP','ALL PAWS','TOP DOG'],styles:['bubble','wildstyle','stencil'],colors:['#CC44FF','#AA00FF','#8800CC'],icon:'bridge',dripChance:0.5},
  trap:{tags:['THE PIT','BITE HARD','BIG DOGS'],styles:['drip','block','stencil'],colors:['#FF0033','#CC0022','#FF2244'],icon:'diamond',dripChance:0.8},
  harbor:{tags:['HARBOR','SALTY DOG','HOWL'],styles:['bubble','stencil','wildstyle'],colors:['#00DDCC','#00BBAA','#20B2AA'],icon:'anchor',dripChance:0.4},
  neon:{tags:['NEON','GOOD BOY','WOOF'],styles:['bubble','neonOutline','drip'],colors:['#FF44AA','#FF0088','#FF66CC'],icon:'palm',dripChance:0.3},
  casino:{tags:['BONE ZONE','ALL IN','JACKPOT'],styles:['block','neonOutline','bubble'],colors:[DESIGN.colors.crownGold,'#FFAA00','#FF8800'],icon:'spade',dripChance:0.3},
