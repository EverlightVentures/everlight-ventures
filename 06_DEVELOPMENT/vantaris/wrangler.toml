# Vantaris -- Cloudflare Pages deployment config
#
# This file tells Wrangler how to deploy the Next.js app to Cloudflare Pages.
# The actual project is managed through the Cloudflare dashboard (auto-deploy
# on git push), but this file allows local `npm run pages:deploy` commands
# and declares environment bindings.

name = "vantaris"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Environment variables available at build + runtime.
# Secrets (API keys) are set in the Cloudflare dashboard, NOT here.
[vars]
