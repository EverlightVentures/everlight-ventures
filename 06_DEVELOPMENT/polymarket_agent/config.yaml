# Polymarket Prediction Agent - Configuration
# Everlight Ventures | Cipher Wolfe's Alpha Markets Fire Team
#
# 5-Agent Pipeline: Scanner -> Researcher -> Predictor -> Risk -> Postmortem

# Polymarket API
polymarket:
  api_url: "https://clob.polymarket.com"
  gamma_url: "https://gamma-api.polymarket.com"
  chain_id: 137  # Polygon mainnet
  min_liquidity: 5000    # $5k minimum pool
  min_volume_24h: 1000   # $1k daily volume floor
  max_markets_scan: 300  # Markets per scan cycle

# Data Sources (priority order)
sources:
  twitter:
    enabled: true
    api_key: "${TWITTER_BEARER_TOKEN}"
    priority: 1  # Fastest signal
    accounts_watch:
      - "@tier10k"
      - "@WatcherGuru"
      - "@unusual_whales"
      - "@DeItaone"
      - "@disclosetv"
      - "@zaborowsky"
  telegram:
    enabled: true
    priority: 2
    channels:
      - "polymarket_alerts"
      - "crypto_breaking"
  rss:
    enabled: true
    priority: 3  # Backup/confirmation
    feeds:
      - "https://feeds.reuters.com/reuters/topNews"
      - "https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml"
      - "https://feeds.bbci.co.uk/news/rss.xml"

# Prediction Engine
prediction:
  model: "xgboost"
  confidence_threshold: 0.65  # Only bet when >65% confident
  llm_model: "claude-sonnet-4-6"  # For narrative analysis
  features:
    - market_price_vs_predicted
    - sentiment_score
    - source_credibility
    - time_to_resolution
    - volume_trend
    - spread_width

# Risk Management (Rex Thornton's rules)
risk:
  max_bet_pct: 5.0           # Max 5% of bankroll per bet
  kelly_fraction: 0.25       # Quarter-Kelly for safety
  max_daily_bets: 10
  max_daily_loss_pct: 15.0   # Stop trading at -15% daily
  min_edge: 0.05             # Need 5% edge over market
  max_open_positions: 10     # alias of max_daily_bets for executor check 6
  min_confidence: 0.40       # brain-bridge halves raw conf; Phase I tunes this up
  cooldown_after_loss: 300   # 5 min cooldown after loss

# Bankroll
bankroll:
  initial: 250.0  # Operator-funded bankroll
  currency: "USDC"
  target_daily_return: 0.02  # 2% daily target

# Scheduling
schedule:
  scan_interval: 300       # Scan markets every 5 min
  research_interval: 60    # Research on new signals every 1 min
  postmortem_interval: 3600  # Review settled bets every hour

# Slack Reporting
slack:
  bot_token: "${SLACK_BOT_TOKEN}"
  channels:
    trades: "C0AN8SG030W"      # #xlm-trading (reuse for all trading)
    alerts: "C0ANPRCA4AD"      # #hive-alerts
    markets: "C0AP56SFQG0"     # #ft-markets

# Hive Mind Agent Mapping
agents:
  scanner: "cipher_wolfe"       # Christopher Wolfe - market scanner
  researcher: "bull_archer"     # Bernard Archer - macro research
  predictor: "cipher_wolfe"     # Cipher does final prediction
  risk_manager: "everlight_trading_risk"  # Rex Thornton
  postmortem: "56_data_verifier"  # Thomas Rourke - fact checker

# Proxy routing (Phase 0 outcome)
proxy:
  url: "https://clob-proxy.everlightventures.io"  # CF Worker fallback (not deployed; direct works)
  enabled: false

# Kill switches
kill_switches:
  daily_loss_pct: 15.0          # Halt for day at -15% bankroll
  bankroll_floor_pct_warn: 80.0  # Reduce max_bet at 80% of start
  bankroll_floor_pct_halt: 60.0  # Halt + operator-confirm at 60%
  drift_usd: 0.01                # Reconciliation drift -- halt

# Live trading flag (two-factor opt-in)
live_trading:
  enabled: false                 # MUST be true AND env LIVE_TRADING=true to actually trade

# Wallet
wallet:
  key_path: "/mnt/sdcard/AA_MY_DRIVE/03_AUTOMATION_CORE/03_Credentials/polymarket_wallet.key"
  address_path: "/mnt/sdcard/AA_MY_DRIVE/03_AUTOMATION_CORE/03_Credentials/polymarket_wallet.addr"

# Telegram signals (free Bot API)
telegram:
  enabled: false                 # Flip to true after @BotFather registration
  bot_token_env: "TELEGRAM_BOT_TOKEN"
  channels:
    - "whalealert_official"
    - "PolyMarketAlerts"

# RSSHub (self-hosted on e5-mother)
rsshub:
  enabled: true
  base_url: "http://e5-mother:1200"
  accounts:
    - "tier10k"
    - "WatcherGuru"
    - "unusual_whales"
    - "DeItaone"

# RSS news (renamed from rss to avoid collision with sources.rss nested key)
rss_news:
  enabled: true
  feeds:
    - "https://feeds.reuters.com/reuters/topNews"
    - "https://feeds.bbci.co.uk/news/rss.xml"
    - "https://www.coindesk.com/arc/outboundfeeds/rss/"

# Orderbook sentinel
orderbook_sentinel:
  spike_multiplier: 3.0
  baseline_window_min: 5

# Perplexity Sonar (real-time news velocity -- the free Twitter-API replacement)
sonar:
  enabled: true                  # needs a valid PERPLEXITY_API_KEY (regen if 401)
  cache_ttl_sec: 600

# Shared intelligence layer (the "O cent" layer): OSINT + Codex/Gemini cross-check
intelligence:
  osint: true                    # osint_api entity enrichment on named markets
  cross_check: true              # Codex + Gemini red-team high-stakes bets pre-place

# Treasury: where profit gets paid OUT to (YOUR personal wallet). Withdrawals
# are LOCKED to this address -- the bot can never send your money anywhere else.
treasury:
  address: "0xREPLACE_WITH_YOUR_PERSONAL_POLYGON_WALLET"   # set this to get paid
  working_capital: 250        # bot keeps this; sweep sends everything above it
  auto_sweep: false           # true + cron = passive daily profit-taking

# Compound-growth ladder (operator 2026-05-29): scale max bet with bankroll,
# compound 100% until $30k, then passively pay $100/day + compound the rest.
# Final bet size = MIN(quarter-Kelly, max_bet_pct, the tier ceiling below).
growth_ladder:
  tiers:
    - {min_bankroll: 0,     max_bet_usd: 1000}   # < $10k: ceiling $1,000
    - {min_bankroll: 10000, max_bet_usd: 2000}   # $10k-20k: $2,000
    - {min_bankroll: 20000, max_bet_usd: 4000}   # $20k-30k: $4,000
    - {min_bankroll: 30000, max_bet_usd: 5000}   # >= $30k: $5,000
  compound_until_usd: 30000     # below this: 100% compounds, no withdrawal
  payout_per_day_usd: 100       # at/above $30k: pay this daily, compound the rest

# Smart-money copy-trade (most-cited real edge from research transcripts).
# Follow VETTED profitable wallets (not raw top-N -- most top wallets are bots).
# Add proxy-wallet addresses to `wallets` to activate. Free, on-chain, one signal
# among many (feeds research + 360 synthesis; never auto-fires a trade alone).
smart_money:
  enabled: true
  wallets:
    - "0x42c99f38d2b951b0dc8e8bd5371fa80c9dd19623"   # TRCM (starter -- vet over time)
    - "0xeebde7a0e019a63e6b476eb425505b7b3e6eba30"   # Bonereaper
    - "0x6485f47d0344c03eb4340f985159f6eb2dcba265"   # flatbarrel
    - "0x0a26054fe174697bf6be759c4b600fdb830d1851"   # BrevanHoward
    - "0xa1d57d329227c75b12b09f927fb3d6d6ef8f1343"   # 1kto1m
  min_size_usd: 100    # ignore dust positions

# Convexity lane -- catch the big asymmetric/moonshot trades (operator directive).
# A cheap outcome (<= max_price, pays >= 1/price) with a positive model edge gets
# a small lottery-ticket stake on RELAXED gates, bounded by budget_pct so misses
# can't drain the bankroll. The XLM-9c-move type asymmetric win lives here.
convexity:
  max_price: 0.20          # <= 0.20 -> >= 5x payout multiple
  min_edge: 0.03           # relaxed edge bar for moonshots
  min_confidence: 0.45     # relaxed confidence bar
  budget_pct: 15.0         # max % of bankroll on convex bets at once
  stake_pct: 1.0           # stake per convex bet (% of bankroll)

# Compressed calibration (operator: don't wait 10 days).
# Phase 1: 24-48h PAPER on short-horizon markets (fast resolutions -> quick Brier).
# Phase 2: week-1 small REAL 'test the waters' trades = live calibration.
calibration:
  prefer_short_horizon: false   # full candidate set; calibration speed comes from fast-resolving bets within it
  max_hours_to_resolution: 72   # target markets resolving within 3 days
  paper_hours: 48               # fast paper phase length
  test_live_max_bet_usd: 2.0    # week-1 tiny real stakes
  test_live_days: 7

# Crypto 5-min candle lane (operator: target the active markets where the action
# + smart money are). Momentum-scalp, near-50/50, highest fees -> BOUNDED $2 stakes.
# Run every ~1 min (windows are 5 min, enter late). Settles by price feed.
crypto_candle:
  enabled: true
  assets: ["BTC", "ETH", "SOL"]
  stake_usd: 2.0          # bounded test-the-waters stake per candle
  min_edge: 0.05          # momentum prob must beat market by >=5%
  enter_after_min: 3.0    # only act in the last ~2 min of the 5-min window
