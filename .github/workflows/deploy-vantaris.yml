name: Deploy Vantaris to Cloudflare Pages

# Triggers on every push to main that touches Vantaris source or this workflow.
# Also manually runnable from the Actions tab.
# Replaces the Cloudflare Pages GitHub App that disconnected during Lovable
# removal. This runs inside GitHub Actions -- no external app dependency.
on:
  push:
    branches: [main, everlightventures.io, bj-finish]
    paths:
      - '06_DEVELOPMENT/vantaris/**'
      - '.github/workflows/deploy-vantaris.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-vantaris-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: 06_DEVELOPMENT/vantaris

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build static site
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://jdqqmsmwmbsnlnstyavl.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpkcXFtc213bWJzbmxuc3R5YXZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4MTk5ODMsImV4cCI6MjA4ODM5NTk4M30.9BDviI2WR46sphcS3uzKapcKbslYpMO4PdSEPFrv3Ww
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Uses the existing everlightventures project -- same URL, same domain
          command: pages deploy out --project-name=everlightventures --branch=main
          workingDirectory: 06_DEVELOPMENT/vantaris
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Print deploy URLs
        if: always()
        run: |
          echo "::notice::Deployed to https://everlightventures.pages.dev"
          echo "::notice::Custom domain: https://everlightventures.io"
