};

function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i)|0;return Math.abs(h);}

function renderGraffiti(x,y,w,h,tagIdx,graf,side){
  if(w<15||h<20)return; // too small
  const tag=graf.tags[tagIdx%graf.tags.length];
  const style=graf.styles[tagIdx%graf.styles.length];
  const color=graf.colors[tagIdx%graf.colors.length];
  const seed=hashStr(tag+side+tagIdx);
  const fontSize=Math.max(7,Math.min(w*0.35,h*0.22));
  ctx.save();
  ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip(); // clip to wall
  ctx.globalAlpha=0.55;
  const tx=x+w*0.15+(seed%3)*w*0.08;
  const ty=y+h*0.3+(seed%5)*h*0.06;
  if(style==='bubble'){
    ctx.font='bold '+fontSize+'px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
    // Fat outline
    ctx.lineWidth=Math.max(2,fontSize*0.15);ctx.strokeStyle='#000';ctx.lineJoin='round';
    ctx.strokeText(tag,tx,ty);
    ctx.fillStyle=color;ctx.fillText(tag,tx,ty);
    // Highlight
    ctx.globalAlpha=0.3;ctx.fillStyle='#fff';
    ctx.fillText(tag,tx-1,ty-1);
  } else if(style==='drip'){
    ctx.font='italic bold '+fontSize+'px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillStyle=color;ctx.fillText(tag,tx,ty);
    // Paint drips
    if(seed%100<graf.dripChance*100){
      const dripCount=2+(seed%3);
      for(let d=0;d<dripCount;d++){
        const dx=tx+(seed*(d+1))%Math.max(1,Math.floor(w*0.5));
        const dLen=8+(seed*(d+2))%Math.max(1,Math.floor(h*0.3));
        ctx.fillStyle=color;ctx.globalAlpha=0.4;
        ctx.fillRect(dx,ty+fontSize*0.4,Math.max(1,fontSize*0.08),dLen);
        ctx.beginPath();ctx.arc(dx+fontSize*0.04,ty+fontSize*0.4+dLen,fontSize*0.06,0,Math.PI*2);ctx.fill();
      }
    }
  } else if(style==='stencil'){
    ctx.font='900 '+fontSize+'px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
    // Spray haze behind
    ctx.globalAlpha=0.15;ctx.fillStyle=color;
    ctx.beginPath();ctx.arc(tx+w*0.15,ty,fontSize*1.2,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=0.55;ctx.fillStyle=color;ctx.fillText(tag.toUpperCase(),tx,ty);
  } else if(style==='block'){
    ctx.font='900 '+fontSize+'px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
    // 3D shadow stack
    for(let s=3;s>0;s--){
      ctx.globalAlpha=0.2;ctx.fillStyle='#000';
      ctx.fillText(tag,tx+s,ty+s);
    }
    ctx.globalAlpha=0.6;ctx.fillStyle=color;ctx.fillText(tag,tx,ty);
    // Top highlight
    ctx.globalAlpha=0.25;ctx.fillStyle='#fff';ctx.fillRect(tx,ty-fontSize*0.5,w*0.4,2);
  } else if(style==='wildstyle'){
    ctx.save();ctx.translate(tx+w*0.1,ty);ctx.rotate(-0.12+(seed%5)*0.04);
    ctx.font='italic bold '+fontSize+'px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.globalAlpha=0.5;
    ctx.strokeText(tag,0,0);
    ctx.fillStyle=color;ctx.globalAlpha=0.6;ctx.fillText(tag,0,0);
    // Arrow accents
    ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.globalAlpha=0.4;
    ctx.beginPath();ctx.moveTo(-5,-fontSize*0.3);ctx.lineTo(-10,-fontSize*0.6);ctx.lineTo(-3,-fontSize*0.5);ctx.stroke();
    ctx.restore();
  } else if(style==='neonOutline'){
    ctx.font='bold '+fontSize+'px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.globalAlpha=0.6;
    ctx.shadowColor=color;ctx.shadowBlur=8;
    ctx.strokeText(tag,tx,ty);
    ctx.shadowBlur=4;ctx.strokeText(tag,tx,ty);
    ctx.shadowBlur=0;
  } else if(style==='glitch'){
    ctx.font='bold '+fontSize+'px monospace';ctx.textAlign='left';ctx.textBaseline='middle';
    // RGB split
    ctx.globalAlpha=0.35;ctx.fillStyle='#00FFFF';ctx.fillText(tag,tx-2,ty);
    ctx.fillStyle='#FF00FF';ctx.fillText(tag,tx+2,ty+1);
    ctx.globalAlpha=0.55;ctx.fillStyle=color;ctx.fillText(tag,tx,ty);
    // Scanline
    ctx.globalAlpha=0.1;ctx.fillStyle='#000';
    for(let sl=0;sl<h;sl+=3)ctx.fillRect(x,y+sl,w,1);
  }
  // City icon (on select buildings)
  if(tagIdx%3===0&&graf.icon){
    renderGraffitiIcon(graf.icon,x+w*0.6,y+h*0.65,Math.min(w*0.25,h*0.2),color);
  }
  ctx.restore();
  ctx.globalAlpha=1;
}

function renderGraffitiIcon(icon,x,y,sz,color){
  ctx.globalAlpha=0.4;ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineWidth=1.5;
  if(icon==='crown'){
    ctx.beginPath();ctx.moveTo(x-sz/2,y+sz*0.3);ctx.lineTo(x-sz/2,y-sz*0.2);ctx.lineTo(x-sz*0.25,y+sz*0.05);ctx.lineTo(x,y-sz*0.4);ctx.lineTo(x+sz*0.25,y+sz*0.05);ctx.lineTo(x+sz/2,y-sz*0.2);ctx.lineTo(x+sz/2,y+sz*0.3);ctx.closePath();ctx.fill();
  } else if(icon==='gear'){
    ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4;const r1=sz*0.35,r2=sz*0.5;ctx.lineTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);ctx.lineTo(x+Math.cos(a+Math.PI/8)*r2,y+Math.sin(a+Math.PI/8)*r2);}ctx.closePath();ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(x,y,sz*0.15,0,Math.PI*2);ctx.fill();
  } else if(icon==='star'){
    ctx.beginPath();for(let i=0;i<12;i++){const a=i*Math.PI/6-Math.PI/2;const r=i%2===0?sz*0.45:sz*0.2;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();ctx.fill();
  } else if(icon==='diamond'){
    ctx.beginPath();ctx.moveTo(x,y-sz*0.45);ctx.lineTo(x+sz*0.3,y);ctx.lineTo(x,y+sz*0.45);ctx.lineTo(x-sz*0.3,y);ctx.closePath();ctx.fill();
    ctx.globalAlpha=0.2;ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(x-sz*0.15,y-sz*0.15);ctx.lineTo(x+sz*0.15,y+sz*0.15);ctx.stroke();
  } else if(icon==='spade'){
    ctx.beginPath();ctx.moveTo(x,y-sz*0.45);ctx.bezierCurveTo(x-sz*0.5,y-sz*0.1,x-sz*0.5,y+sz*0.3,x,y+sz*0.15);ctx.bezierCurveTo(x+sz*0.5,y+sz*0.3,x+sz*0.5,y-sz*0.1,x,y-sz*0.45);ctx.fill();
    ctx.fillRect(x-sz*0.06,y+sz*0.1,sz*0.12,sz*0.3);
  } else if(icon==='circuit'){
    ctx.beginPath();ctx.arc(x,y,sz*0.12,0,Math.PI*2);ctx.fill();
    for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*sz*0.12,y+Math.sin(a)*sz*0.12);const mx=x+Math.cos(a)*sz*0.35;const my=y+Math.sin(a)*sz*0.35;if(i%2===0){ctx.lineTo(mx,y+Math.sin(a)*sz*0.12);ctx.lineTo(mx,my);}else{ctx.lineTo(x+Math.cos(a)*sz*0.12,my);ctx.lineTo(mx,my);}ctx.stroke();}
  } else if(icon==='royalCrown'){
    ctx.beginPath();ctx.moveTo(x-sz*0.45,y+sz*0.25);ctx.lineTo(x-sz*0.45,y-sz*0.1);ctx.lineTo(x-sz*0.25,y+sz*0.1);ctx.lineTo(x-sz*0.1,y-sz*0.3);ctx.lineTo(x,y+sz*0.05);ctx.lineTo(x+sz*0.1,y-sz*0.3);ctx.lineTo(x+sz*0.25,y+sz*0.1);ctx.lineTo(x+sz*0.45,y-sz*0.1);ctx.lineTo(x+sz*0.45,y+sz*0.25);ctx.closePath();ctx.fill();
    ctx.fillStyle='#FF0000';[x-sz*0.1,x,x+sz*0.1].forEach(jx=>{ctx.beginPath();ctx.arc(jx,y-sz*0.25,sz*0.06,0,Math.PI*2);ctx.fill();});
  } else {
    // fallback: simple tag mark
    ctx.beginPath();ctx.arc(x,y,sz*0.3,0,Math.PI*2);ctx.stroke();
  }
}

// 3D building silhouettes along arena edges (with graffiti)
function renderBuildingSilhouettes3D(arena){
  const graf=GRAFFITI_DB[arena.style]||GRAFFITI_DB.hood;
  const bCount=8;
  for(let i=0;i<bCount;i++){
    const gy=i*(ARENA_H/bCount);
    const df=getDepthFactor(gy);
    const bh=CITY_BUILDINGS[i%CITY_BUILDINGS.length]*H*0.4*df;
    // Left side buildings
    const[lx,ly]=toScr3D(-0.5,gy);
    const bw=scale*1.5*df;
    ctx.fillStyle=arena.sky2;ctx.fillRect(lx-bw,ly-bh,bw,bh);
    // Windows (flickering with trig)
    for(let row=0;row<3;row++){
      for(let col=0;col<2;col++){
        const flicker=Math.sin(animT*2+i+row)>0.3?1:0.4;
        ctx.fillStyle='rgba(255,240,120,'+(0.15+flicker*0.15)+')';
        ctx.fillRect(lx-bw+col*(bw/2.5)+4,ly-bh+row*(bh/3.5)+8,bw*0.2,bh*0.08);
      }
    }
    // Graffiti on left wall (staggered: indices 0,1,3,5,7)
    if(i%2===0||i===1||i===5){
      renderGraffiti(lx-bw+2,ly-bh*0.6,bw-4,bh*0.45,i,graf,'L');
    }
    // Neon accent
    if(i%2===0){
      ctx.fillStyle=arena.n1+'44';ctx.fillRect(lx-bw+2,ly-bh*0.5,bw-4,2*df);
    }
    // Right side buildings
    const[rx]=toScr3D(ARENA_W+0.5,gy);
    ctx.fillStyle=arena.sky2;ctx.fillRect(rx,ly-bh*0.8,bw,bh*0.8);
    for(let row=0;row<3;row++){
      for(let col=0;col<2;col++){
        const flicker2=Math.sin(animT*2.3+i*3+row)>0.2?1:0.4;
        ctx.fillStyle='rgba(255,240,120,'+(0.15+flicker2*0.15)+')';
        ctx.fillRect(rx+col*(bw/2.5)+4,ly-bh*0.8+row*(bh*0.8/3.5)+8,bw*0.2,bh*0.06);
      }
    }
    // Graffiti on right wall (staggered: indices 1,2,4,6)
    if(i%2===1||i===2||i===6){
      renderGraffiti(rx+2,ly-bh*0.5,bw-4,bh*0.35,(i+3)%graf.tags.length,graf,'R');
    }
  }
}

function drawTrafficLight3D(gx,gy,arena){
  const[sx,sy,df]=toScr3D(gx,gy);
  const w=scale*0.18*df,h=scale*0.55*df;
  // 3D pole
  ctx.fillStyle='#333';ctx.fillRect(sx-w*0.15,sy,w*0.3,h*0.6);
  // Light box with 3D shading
  ctx.fillStyle='#1a1a1a';ctx.fillRect(sx-w/2,sy-h*0.1,w,h);
  ctx.fillStyle='#111';ctx.fillRect(sx-w/2,sy-h*0.1,w*0.15,h); // left shadow face
  const phase2=Math.floor(animT)%3;
  ctx.fillStyle=phase2===0?(arena?arena.n1:'#FF2200'):'#222';ctx.beginPath();ctx.arc(sx,sy+h*0.15,w*0.28,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=phase2===1?'#FFAA00':'#222';ctx.beginPath();ctx.arc(sx,sy+h*0.42,w*0.28,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=phase2===2?'#22DD22':'#222';ctx.beginPath();ctx.arc(sx,sy+h*0.69,w*0.28,0,Math.PI*2);ctx.fill();
  // Glow
  if(phase2===0&&arena){ctx.shadowColor=arena.n1;ctx.shadowBlur=6*df;ctx.beginPath();ctx.arc(sx,sy+h*0.15,w*0.2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
}

// ============================================================
// 3D TOWER RENDER (Pseudo-3D with top face + shadows)
// ============================================================
function renderTowers3D(){
  // Sort by Y for depth ordering
  const allTowers=[...opponent.towers,...player.towers].sort((a,b)=>a.y-b.y);
  for(const t of allTowers){
    const[sx,sy,df]=toScr3D(t.x,t.y);const stats=TOWER_STATS[t.type];
    const cW=stats.w*scale*df,cH=stats.h*scale*df;
    const towerH=cH*0.6; // 3D height

    if(t.destroyed){
      // Rubble with smoke
      ctx.globalAlpha=0.5;ctx.fillStyle='#111';
      ctx.beginPath();ctx.ellipse(sx,sy,cW*0.6,cH*0.3,0,0,Math.PI*2);ctx.fill();
      const fp=(animT*3)%1;ctx.globalAlpha=0.6;
      ctx.fillStyle='rgba(255,'+(Math.floor(80+fp*120))+',0,0.7)';
      ctx.beginPath();ctx.arc(sx,sy-towerH*0.3,cW*(0.2+fp*0.05)*df,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;continue;
    }

    const isCrit=t.hp/t.maxHp<0.3;
    const bodyCol=t.owner===0?(isCrit?'#441111':'#2255BB'):(isCrit?'#441111':'#BB2222');
    const roofCol=t.owner===0?(isCrit?'#882222':'#3377EE'):(isCrit?'#882222':'#EE4444');
    const topCol=t.owner===0?(isCrit?'#993333':'#4499FF'):(isCrit?'#993333':'#FF6666');

    // Hit flash
    const flashMix=t.hitFlash>0?0.5:0;

    // Ground shadow (Geometry: ellipse)
    ctx.globalAlpha=0.35;ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(sx+cW*0.1,sy+cH*0.15,cW*0.6,cH*0.25,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;

    // Active glow
    if(t.type==='king'&&t.active){ctx.shadowColor=t.owner===0?'#4488FF':'#FF4444';ctx.shadowBlur=14*df;}
    if(isCrit){ctx.shadowColor='#FF0000';ctx.shadowBlur=12*df;}

    // 3D body: front face
    ctx.fillStyle=flashMix>0?lerpColor(bodyCol,'#fff',flashMix):bodyCol;
    rr(sx-cW/2,sy-towerH,cW,towerH,cH*0.12*df);ctx.fill();

    // 3D body: top face (lighter shade - creates 3D illusion)
    ctx.fillStyle=flashMix>0?lerpColor(topCol,'#fff',flashMix):topCol;
    ctx.beginPath();
    ctx.moveTo(sx-cW/2,sy-towerH);
    ctx.lineTo(sx-cW/2+cW*0.15,sy-towerH-cH*0.2);
    ctx.lineTo(sx+cW/2+cW*0.15,sy-towerH-cH*0.2);
    ctx.lineTo(sx+cW/2,sy-towerH);
    ctx.closePath();ctx.fill();

    // 3D body: right face (darker shade)
    ctx.fillStyle=darkenColor(bodyCol,0.6);
    ctx.beginPath();
    ctx.moveTo(sx+cW/2,sy-towerH);
    ctx.lineTo(sx+cW/2+cW*0.15,sy-towerH-cH*0.2);
    ctx.lineTo(sx+cW/2+cW*0.15,sy-cH*0.2);
    ctx.lineTo(sx+cW/2,sy);
    ctx.closePath();ctx.fill();

    // Roof detail
    ctx.fillStyle=roofCol;
    rr(sx-cW*0.35,sy-towerH+towerH*0.15,cW*0.7,towerH*0.3,cH*0.08*df);ctx.fill();
    // Crown Gold accent stripe (player towers)
    if(t.owner===0){ctx.save();ctx.globalAlpha=0.35;ctx.fillStyle=DESIGN.colors.crownGold;ctx.fillRect(sx-cW*0.35,sy-towerH+towerH*0.48,cW*0.7,towerH*0.04);ctx.restore();}

    // Windows (perspective-scaled)
    ctx.fillStyle='rgba(120,210,255,0.5)';
    ctx.fillRect(sx-cW*0.25,sy-towerH+towerH*0.1,cW*0.5,towerH*0.2);

    // Wheels at base
    ctx.fillStyle='#111';const ww=cW*0.18,wh=cH*0.15;
    ctx.beginPath();ctx.ellipse(sx-cW*0.35,sy,ww/2,wh/2,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(sx+cW*0.35,sy,ww/2,wh/2,0,0,Math.PI*2);ctx.fill();

    ctx.shadowBlur=0;

    // HQ label
    if(t.type==='king'){
      ctx.fillStyle=DESIGN.colors.crownGold;ctx.font='bold '+(cH*0.22)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('DEN',sx,sy-towerH*0.5);
    }

    // HP bar (3D positioned above tower)
    const bw2=cW*1.2,bh2=4*df,bx2=sx-bw2/2,by2=sy-towerH-cH*0.35;
    ctx.fillStyle='#1a1a1a';ctx.fillRect(bx2,by2,bw2,bh2);
    const pct=t.hp/t.maxHp;ctx.fillStyle=pct>0.5?'#44EE44':pct>0.25?'#FFAA00':'#FF3333';
    ctx.fillRect(bx2,by2,bw2*pct,bh2);ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.strokeRect(bx2,by2,bw2,bh2);
    ctx.fillStyle='#fff';ctx.font=Math.floor(bh2*2.5)+'px Arial';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText(Math.ceil(t.hp),sx,by2);
  }
}

// ============================================================
// 3D UNIT RENDER (Pseudo-3D cars with depth + shadows)
// ============================================================
function renderUnits3D(){
  // Depth sort: render far units first (lower Y = farther)
  const sorted=[...units].filter(u=>u.alive||u.deathTimer<0.5).sort((a,b)=>a.y-b.y);
  for(const u of sorted){
    if(u.stealthTimer>0&&u.owner===1)continue;

    const[sx,sy,df]=toScr3D(u.x,u.y);const card=u.card;
    // Depth-scaled body dimensions
    const bW=(card.bodyW||0.9)*scale*df;
    const bH=(card.bodyH||0.55)*scale*df;
    const bodyH3D=bH*0.5; // 3D height of car body
    // Trigonometry: bobbing using sin wave
    const bob=Math.sin(u.bobOffset)*scale*0.04*df;
    // Jump height for abilities
    const zOff=u.zHeight*scale*df;
    // STATE MACHINE: deploy scale-up
    const dScale=(u.state===USTATE.DEPLOY)?u.deployScale:1;
    // STATE MACHINE: windup pullback offset
    const windupOff=(u.windupOffset||0)*scale*df;

    // Status auras (drawn UNDER unit body)
    if(u.alive)renderStatusAuras(u,sx,sy,bW,bH,df);

    // Death animation: upgraded 3-phase sequence
    if(!u.alive&&u.deathTimer>=0){
      renderDeathVFX(u,sx,sy,bW,bH,bodyH3D,df);
      continue;
    }

    // Stealth: semi-transparent
    if(u.stealthTimer>0)ctx.globalAlpha=0.3;

    // Ground shadow (Geometry: ellipse scaled by depth)
    ctx.globalAlpha=u.stealthTimer>0?0.1:0.35;
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(sx+bW*0.08,sy+bH*0.1,bW*0.5*dScale,bH*0.2*dScale,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=u.stealthTimer>0?0.3:1;

    ctx.save();
    ctx.translate(sx+Math.cos(u.angle)*windupOff,sy+bob-zOff+Math.sin(u.angle)*windupOff);
    // Deploy scale-up animation
    if(dScale<1)ctx.scale(dScale,dScale);

    // Rotate car body (Trigonometry: angle-based rotation)
    const drawAngle=u.angle+Math.PI/2;
    ctx.rotate(drawAngle);

    // Hit flash effect + HIT state white overlay
    const flashAmt=u.hitFlash>0?0.4:0;
    const hitMult=(u.state===USTATE.HIT)?0.6:0;
    let baseColor=flashAmt>0?lerpColor(card.carColor||'#888','#fff',flashAmt):(card.carColor||'#888');
    if(hitMult>0)baseColor=lerpColor(baseColor,'#ffffff',hitMult);

    // 3D Car body: main face
    ctx.fillStyle=baseColor;
    rr(-bW/2,-bH/2,bW,bH,bH*0.25);ctx.fill();

    // 3D top face (lighter -- creates volume illusion)
    const topShade=lightenColor(baseColor,0.3);
    ctx.fillStyle=topShade;
    ctx.beginPath();
    ctx.moveTo(-bW/2,-bH/2);
    ctx.lineTo(-bW/2+bW*0.1,-bH/2-bodyH3D);
    ctx.lineTo(bW/2-bW*0.1,-bH/2-bodyH3D);
    ctx.lineTo(bW/2,-bH/2);
    ctx.closePath();ctx.fill();

    // Side face (darker)
    ctx.fillStyle=darkenColor(baseColor,0.5);
    ctx.beginPath();
    ctx.moveTo(bW/2,-bH/2);
    ctx.lineTo(bW/2-bW*0.1,-bH/2-bodyH3D);
    ctx.lineTo(bW/2-bW*0.1,bH/2-bodyH3D*0.3);
    ctx.lineTo(bW/2,bH/2);
    ctx.closePath();ctx.fill();

    // Windshield (reflective)
    ctx.fillStyle='rgba(150,220,255,0.45)';
    ctx.fillRect(-bW*0.25,-bH/2-bodyH3D*0.8,bW*0.5,bodyH3D*0.6);

    // Rim light (Ivory Cream edge highlight, left side)
    ctx.save();ctx.globalAlpha=0.25;ctx.strokeStyle=DESIGN.colors.ivoryCream;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-bW/2,-bH/2);ctx.lineTo(-bW/2+bW*0.1,-bH/2-bodyH3D);ctx.lineTo(-bW/2+bW*0.12,-bH/2-bodyH3D*0.3);ctx.stroke();ctx.restore();

    // Owner border glow
    ctx.strokeStyle=u.owner===0?'#4488FF':'#FF4444';
    ctx.lineWidth=u.nitroActive?2.5*df:1.5*df;
    if(u.nitroActive){ctx.shadowColor='#00BFFF';ctx.shadowBlur=8*df;}
    if(u.stunTimer>0){ctx.strokeStyle='#FFFF00';ctx.lineWidth=3*df;}
    if(u.slowTimer>0){ctx.strokeStyle='#666';ctx.lineWidth=2*df;}
    rr(-bW/2,-bH/2,bW,bH,bH*0.25);ctx.stroke();
    ctx.shadowBlur=0;

    // Wheels (3D ellipses)
    ctx.fillStyle='#111';
    const wheelW=bW*0.18,wheelH=bH*0.15;
    ctx.beginPath();ctx.ellipse(-bW*0.38,-bH*0.35,wheelW,wheelH,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(bW*0.38,-bH*0.35,wheelW,wheelH,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(-bW*0.38,bH*0.35,wheelW,wheelH,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(bW*0.38,bH*0.35,wheelW,wheelH,0,0,Math.PI*2);ctx.fill();

    // Speed trail (Trigonometry: sin-wave exhaust)
    if(u.getSpeed()>0.5&&u.alive){
      ctx.globalAlpha=0.3;ctx.fillStyle=u.nitroActive?'#00BFFF':'#888';
      for(let ti=1;ti<=3;ti++){
        const trailAlpha=0.3-ti*0.08;
        ctx.globalAlpha=Math.max(0,trailAlpha);
        const ty2=bH/2+ti*bH*0.3;
        const tw=bW*0.15*(1-ti*0.2);
        const wobble=Math.sin(animT*15+ti*2)*tw*0.3;
        ctx.beginPath();ctx.arc(wobble,ty2,tw,0,Math.PI*2);ctx.fill();
      }
    }

    ctx.restore();
    ctx.globalAlpha=1;

    // HP bar above unit (3D positioned)
    if(u.alive){
      const barW=bW*0.9,barH=3*df,barX=sx-barW/2,barY=sy+bob-zOff-bH/2-bodyH3D-6*df;
      ctx.fillStyle='#1a1a1a';ctx.fillRect(barX,barY,barW,barH);
      const hpPct=u.hp/u.maxHp;ctx.fillStyle=u.owner===0?'#4488FF':'#FF4444';
      ctx.fillRect(barX,barY,barW*hpPct,barH);
    }
    // Stun indicator
    if(u.stunTimer>0&&u.alive){ctx.fillStyle='#FFFF00';ctx.font=(scale*0.3*df)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('\u{1F4AB}',sx,sy-bH-bodyH3D);}
  }
}

// ============================================================
// STATUS AURAS (VFX System 2B) - drawn under unit body
// ============================================================
function renderStatusAuras(u,sx,sy,bW,bH,df){
  const t=animT;
  // STUN: yellow lightning bolts orbiting
  if(u.stunTimer>0){
    ctx.save();
    for(let i=0;i<3;i++){
      const oa=t*6+(i*Math.PI*2/3),orbR=bW*0.55;
      const bx=sx+Math.cos(oa)*orbR,by=sy+Math.sin(oa)*orbR*0.5;
      ctx.strokeStyle='#FFFF00';ctx.lineWidth=1.5*df;ctx.globalAlpha=0.8;
      ctx.shadowColor='#FFFF00';ctx.shadowBlur=6*df;
      const bSz=bW*0.12;
      ctx.beginPath();ctx.moveTo(bx,by-bSz);ctx.lineTo(bx+bSz*0.3,by-bSz*0.2);
      ctx.lineTo(bx-bSz*0.2,by+bSz*0.1);ctx.lineTo(bx+bSz*0.1,by+bSz);ctx.stroke();
    }
    ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.restore();
  }
  // SLOW: blue ice crystals below
  if(u.slowTimer>0){
    ctx.save();ctx.globalAlpha=0.6;
    for(let i=0;i<4;i++){
      const ca=(i*Math.PI*2/4)+t*0.5,cR=bW*0.45;
      const cx2=sx+Math.cos(ca)*cR,cy2=sy+bH*0.15+Math.sin(ca)*cR*0.3,cSz=bW*0.06;
      ctx.fillStyle='#88CCFF';ctx.shadowColor='#4488FF';ctx.shadowBlur=4*df;
      ctx.beginPath();ctx.moveTo(cx2,cy2-cSz*1.5);ctx.lineTo(cx2+cSz,cy2);
      ctx.lineTo(cx2,cy2+cSz*0.8);ctx.lineTo(cx2-cSz,cy2);ctx.closePath();ctx.fill();
    }
    ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.restore();
  }
  // NITRO: cyan speed lines trailing behind
  if(u.nitroActive){
    ctx.save();ctx.globalAlpha=0.4;
    const ta=u.angle+Math.PI;
    for(let i=0;i<3;i++){
      const off=(i-1)*bW*0.2;
      const tx=sx+Math.cos(ta)*bW*(0.4+i*0.15)+Math.cos(ta+Math.PI/2)*off;
      const ty=sy+Math.sin(ta)*bW*(0.4+i*0.15)+Math.sin(ta+Math.PI/2)*off;
      const len=bW*(0.25+Math.random()*0.15);
      ctx.strokeStyle='#00DDFF';ctx.lineWidth=(2-i*0.4)*df;
      ctx.shadowColor='#00BFFF';ctx.shadowBlur=4*df;
      ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx+Math.cos(ta)*len,ty+Math.sin(ta)*len);ctx.stroke();
    }
    ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.restore();
  }
  // STEALTH: ghostly shimmer (player units only)
  if(u.stealthTimer>0&&u.owner===0){
    ctx.save();const sh=Math.sin(t*8)*0.15+0.15;
    ctx.globalAlpha=sh;ctx.strokeStyle='#AADDFF';ctx.lineWidth=1*df;
    ctx.setLineDash([3*df,5*df]);ctx.beginPath();
    ctx.ellipse(sx,sy,bW*0.55,bH*0.35,0,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;ctx.restore();
  }
  // LOW HP (<25%): red pulsing danger glow
  if(u.hp/u.maxHp<0.25&&u.hp>0){
    ctx.save();const pulse=(Math.sin(t*10)+1)/2;
    ctx.globalAlpha=0.15+pulse*0.2;ctx.fillStyle='#FF0000';
    ctx.shadowColor='#FF0000';ctx.shadowBlur=12*df;
    ctx.beginPath();ctx.ellipse(sx,sy,bW*0.6,bH*0.4,0,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.restore();
  }
}

// ============================================================
// DEATH VFX (VFX System 2D) - 3-phase death render
// ============================================================
function renderDeathVFX(u,sx,sy,bW,bH,bodyH3D,df){
  const t=u.deathTimer;
  if(t<0.1){
    // Phase 0: time freeze -- white overlay intensifying
    const fp=t/0.1;
    ctx.fillStyle='rgba(255,255,255,'+(fp*0.4)+')';
    ctx.beginPath();ctx.ellipse(sx,sy,bW*0.5,bH*0.35,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1-fp*0.1;ctx.fillStyle=u.card.carColor||'#888';
    ctx.save();ctx.translate(sx,sy);ctx.scale(1-fp*0.05,1-fp*0.05);
    rr(-bW/2,-bH/2,bW,bH,bH*0.25);ctx.fill();ctx.restore();
  }else if(t<0.3){
    // Phase 1: white flash + expanding shockwave ring
    const p1=(t-0.1)/0.2;
    ctx.globalAlpha=(1-p1)*0.6;ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(sx,sy,bW*(0.4+p1*0.8),0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=(1-p1)*0.8;ctx.strokeStyle=u.card.carColor||'#FF4400';
    ctx.lineWidth=(3-p1*2)*df;ctx.beginPath();ctx.arc(sx,sy,bW*p1*2.5,0,Math.PI*2);ctx.stroke();
  }else{
    // Phase 2: fading ghost ring
    const p2=(t-0.3)/0.2;
    ctx.globalAlpha=Math.max(0,0.2-p2*0.2);ctx.strokeStyle=u.card.carColor||'#FF4400';
    ctx.lineWidth=1*df;ctx.setLineDash([2*df,4*df]);
    ctx.beginPath();ctx.arc(sx,sy,bW*(1+p2),0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  }
  ctx.globalAlpha=1;
}

// ============================================================
// Color utility functions for 3D shading
// ============================================================
function parseColor(c){
  if(c[0]==='#'){
    let hex=c.slice(1);if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    return[parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];
  }
  return[128,128,128];
}
function lightenColor(c,amt){
  const[r,g,b]=parseColor(c);
  return'rgb('+Math.min(255,r+Math.floor((255-r)*amt))+','+Math.min(255,g+Math.floor((255-g)*amt))+','+Math.min(255,b+Math.floor((255-b)*amt))+')';
}
function darkenColor(c,amt){
  const[r,g,b]=parseColor(c);
  return'rgb('+Math.floor(r*amt)+','+Math.floor(g*amt)+','+Math.floor(b*amt)+')';
}
function lerpColor(c1,c2,t){
  const[r1,g1,b1]=parseColor(c1),[r2,g2,b2]=parseColor(c2);
  return'rgb('+Math.floor(r1+(r2-r1)*t)+','+Math.floor(g1+(g2-g1)*t)+','+Math.floor(b1+(b2-b1)*t)+')';
}

// ============================================================
// EFFECTS (3D positioned)
// ============================================================
function renderEffects(){
  for(const e of effects){
    const[sx,sy,df]=toScr3D(e.x,e.y);const p=e.t/e.dur;
    if(e.type==='dmg'||e.type==='ability'){
      ctx.globalAlpha=1-p;ctx.fillStyle=e.color;
      if(e.type==='ability'){ctx.shadowColor=e.color;ctx.shadowBlur=8*df;}
      ctx.font='bold '+(scale*(e.type==='ability'?0.65:0.52)*df)+'px Arial';
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e.text,sx,sy-p*scale*1.8*df);
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    } else if(e.type==='announce'){
      const sc2=1+Math.sin(p*Math.PI)*0.15;
      ctx.save();ctx.translate(W/2,H*0.45);ctx.scale(sc2,sc2);
      ctx.globalAlpha=(p<0.5?p*2:2-p*2)*0.95;
      ctx.shadowColor=e.color;ctx.shadowBlur=20;ctx.fillStyle=e.color;
      ctx.font='bold '+(W*0.06)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(e.text,0,0);ctx.restore();ctx.globalAlpha=1;
    } else if(e.type==='spell'){
      ctx.globalAlpha=0.38*(1-p);ctx.fillStyle=e.color;
      ctx.beginPath();ctx.arc(sx,sy,scale*2.5*df*(0.3+p*0.7),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    } else if(e.type==='deploy'){
      ctx.globalAlpha=0.7*(1-p);ctx.fillStyle=e.color;
      ctx.beginPath();ctx.arc(sx,sy,scale*df*(0.3+p*1.8),0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=0.5*(1-p);ctx.strokeStyle='#fff';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(sx,sy,scale*df*(0.5+p*2),0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
    } else if(e.type==='tshot'){
      ctx.globalAlpha=0.55*(1-p);ctx.fillStyle=e.color;
      ctx.beginPath();ctx.arc(sx,sy,scale*0.28*df*(1-p),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    } else if(e.type==='bigdmg'){
      // Bouncing enlarged red damage number
      const bounce=Math.abs(Math.sin(p*Math.PI*3))*(1-p)*0.5;
      const fScale=1.0+(1-p)*0.5;
      ctx.globalAlpha=1-p*p;ctx.fillStyle=e.color;
      ctx.shadowColor='#FF0000';ctx.shadowBlur=8*df;
      ctx.font='bold '+(scale*0.75*df*fScale)+'px Arial';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(e.text,sx,sy-p*scale*2*df-bounce*scale*df);
      ctx.strokeStyle='#fff';ctx.lineWidth=1.5*df;
      ctx.strokeText(e.text,sx,sy-p*scale*2*df-bounce*scale*df);
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    } else if(e.type==='combopop'){
      // Gold combo text with scale pulse
      const pulse=1+Math.sin(p*Math.PI*2)*0.15;
      ctx.globalAlpha=(1-p)*0.9;ctx.save();
      ctx.translate(sx,sy-p*scale*2.5*df);ctx.scale(pulse,pulse);
      ctx.fillStyle=DESIGN.colors.crownGold;ctx.shadowColor='#FF8800';ctx.shadowBlur=10*df;
      ctx.font='bold '+(scale*0.6*df)+'px Arial';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(e.text,0,0);ctx.strokeStyle='#AA6600';ctx.lineWidth=1*df;
      ctx.strokeText(e.text,0,0);ctx.restore();
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    }
  }
}

// --- Art Bible v2 Card Helpers ---
function drawFrostedGlass(x,y,w,h,radius,opacity){
  ctx.save();ctx.globalAlpha=opacity||0.15;
  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'rgba(255,255,255,0.12)');g.addColorStop(0.5,'rgba(200,210,230,0.06)');g.addColorStop(1,'rgba(255,255,255,0.03)');
  ctx.fillStyle=g;rr(x,y,w,h,radius);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;rr(x,y,w,h,radius);ctx.stroke();
  ctx.restore();
}
function drawRarityBorder(x,y,w,h,radius,rar,t){
  const style=rar.borderStyle||'steel';
  ctx.save();
  if(style==='steel'){
    const g=ctx.createLinearGradient(x,y,x+w,y);
    g.addColorStop(0,'#666');g.addColorStop(0.3,'#999');g.addColorStop(0.5,'#777');g.addColorStop(0.7,'#AAA');g.addColorStop(1,'#666');
    ctx.strokeStyle=g;ctx.lineWidth=rar.borderW;rr(x,y,w,h,radius);ctx.stroke();
  } else if(style==='chrome'){
    const pulse=0.5+0.5*Math.sin(t*3);
    ctx.shadowColor=DESIGN.colors.neonCyan;ctx.shadowBlur=4+pulse*6;
    const g=ctx.createLinearGradient(x,y,x+w,y+h);
    g.addColorStop(0,'#4488CC');g.addColorStop(0.5,DESIGN.colors.neonCyan);g.addColorStop(1,'#4488CC');
    ctx.strokeStyle=g;ctx.lineWidth=rar.borderW;rr(x,y,w,h,radius);ctx.stroke();
    ctx.shadowBlur=0;
  } else if(style==='flame'){
    const flicker=0.7+0.3*Math.sin(t*8);
    ctx.shadowColor=DESIGN.colors.bloodOrange;ctx.shadowBlur=6*flicker;
    const g=ctx.createLinearGradient(x,y,x,y+h);
    g.addColorStop(0,DESIGN.colors.crownGold);g.addColorStop(0.5,DESIGN.colors.brickWarm);g.addColorStop(1,DESIGN.colors.bloodOrange);
    ctx.strokeStyle=g;ctx.lineWidth=rar.borderW;rr(x,y,w,h,radius);ctx.stroke();
    ctx.shadowBlur=0;
  } else if(style==='holographic'){
    const hue=Math.floor((t*60)%360);
    const pulse=0.6+0.4*Math.sin(t*2);
    ctx.shadowColor='hsl('+hue+',100%,60%)';ctx.shadowBlur=8*pulse;
    ctx.strokeStyle='hsl('+hue+',80%,55%)';ctx.lineWidth=rar.borderW;rr(x,y,w,h,radius);ctx.stroke();
    ctx.strokeStyle='hsl('+((hue+120)%360)+',70%,50%)';ctx.lineWidth=rar.borderW*0.5;rr(x+1,y+1,w-2,h-2,Math.max(2,radius-1));ctx.stroke();
    ctx.shadowBlur=0;
  }
  ctx.restore();
}

function renderCards(){
  for(let i=0;i<4;i++){
    const s=cardSlots[i];if(!s)continue;
    const cid=player.hand[i],c=CARS[cid];if(!c)continue;
    const afford=player.elixir>=c.cost,sel=selectedCard===i,hover=cardHoverIdx===i;
    const scl=sel||hover?1.08:1;
    const dx=s.x+(1-scl)*s.w/2,dy=s.y+(1-scl)*s.h/2,dw=s.w*scl,dh=s.h*scl;
    const rar=getCardRarity(cid);
    ctx.globalAlpha=afford?1:0.38;
    // Card base -- Midnight Deep gradient with car tint
    const cc=c.carColor||'#333';
    const cg=ctx.createLinearGradient(dx,dy,dx,dy+dh);
    cg.addColorStop(0,DESIGN.colors.midnightDeep);cg.addColorStop(0.6,cc+'44');cg.addColorStop(1,DESIGN.colors.midnightDeep);
    ctx.fillStyle=cg;rr(dx,dy,dw,dh,8);ctx.fill();
    // Selection glow
    if(sel){ctx.save();ctx.shadowColor=DESIGN.colors.crownGold;ctx.shadowBlur=14;ctx.strokeStyle=DESIGN.colors.crownGold;ctx.lineWidth=3;rr(dx-2,dy-2,dw+4,dh+4,10);ctx.stroke();ctx.shadowBlur=0;ctx.restore();}
    // Animated rarity border
    drawRarityBorder(dx,dy,dw,dh,8,rar,animT);
    // Emoji icon (fills top 55%)
    ctx.font=(dh*0.3)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';
    ctx.fillText(c.icon||'?',dx+dw/2,dy+dh*0.3);
    // Type badge top-left
    const badgeW=dw*0.4,badgeH=dh*0.12;
    ctx.fillStyle=rar.color+'44';rr(dx+2,dy+2,badgeW,badgeH,4);ctx.fill();
    ctx.fillStyle=rar.color;ctx.font='bold '+(badgeH*0.6)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(c.type==='troop'?'CREW':c.type==='spell'?'SPELL':'STRUCT',dx+2+badgeW/2,dy+2+badgeH/2);
    // Level badge top-right
    const lvl=getCardLevel(cid);
    const lBW=dw*0.28,lBH=badgeH;
    ctx.fillStyle='rgba(0,0,0,0.5)';rr(dx+dw-lBW-2,dy+2,lBW,lBH,4);ctx.fill();
    ctx.fillStyle=rar.color;ctx.font='bold '+(lBH*0.6)+'px Arial';ctx.textAlign='center';
    ctx.fillText('L'+lvl,dx+dw-lBW/2-2,dy+2+lBH/2);
    // Frosted glass name plate (bottom 40%)
    const npY=dy+dh*0.55,npH=dh*0.45;
    drawFrostedGlass(dx,npY,dw,npH,6,0.25);
    ctx.fillStyle=DESIGN.colors.ivoryCream;ctx.font='bold '+(dh*0.09)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(c.name,dx+dw/2,npY+npH*0.18);
    // Mini stat bars inside nameplate
    const stY=npY+npH*0.32,stH=npH*0.08,stW=dw*0.75,stX=dx+dw*0.125;
    if(c.hp){ctx.fillStyle=DESIGN.colors.asphaltGrey;ctx.fillRect(stX,stY,stW,stH);ctx.fillStyle='#22BB22';ctx.fillRect(stX,stY,stW*Math.min(c.hp/4000,1),stH);}
    if(c.dmg&&c.hp){ctx.fillStyle=DESIGN.colors.asphaltGrey;ctx.fillRect(stX,stY+stH+1,stW,stH);ctx.fillStyle='#BB2222';ctx.fillRect(stX,stY+stH+1,stW*Math.min(c.dmg/400,1),stH);}
    if(c.armor&&c.armor>0){ctx.fillStyle=DESIGN.colors.asphaltGrey;ctx.fillRect(stX,stY+(stH+1)*2,stW,stH);ctx.fillStyle='#4488FF';ctx.fillRect(stX,stY+(stH+1)*2,stW*Math.min(c.armor/35,1),stH);}
    // Cost diamond
    const dSz=dw*0.22,diamX=dx+dSz*0.6,diamY=dy+dh-dSz*0.6;
    ctx.fillStyle='#5511AA';ctx.save();ctx.translate(diamX,diamY);ctx.rotate(Math.PI/4);ctx.fillRect(-dSz/2,-dSz/2,dSz,dSz);ctx.restore();
    ctx.strokeStyle=rar.color;ctx.lineWidth=1.5;ctx.save();ctx.translate(diamX,diamY);ctx.rotate(Math.PI/4);ctx.strokeRect(-dSz/2,-dSz/2,dSz,dSz);ctx.restore();
    ctx.fillStyle='#fff';ctx.font='bold '+(dSz*0.7)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c.cost,diamX,diamY);
    ctx.globalAlpha=1;
  }
  // Next card preview
  if(player.queue.length>0&&cardSlots[3]){
    const nc=CARS[player.queue[0]];if(!nc)return;
    const ls=cardSlots[3],nx=ls.x+ls.w+6,nw=Math.floor(W*0.09),nh=Math.floor(ls.h*0.55),ny=ls.y+(ls.h-nh)/2;
    ctx.fillStyle=nc.carColor||'#333';ctx.globalAlpha=0.5;rr(nx,ny,nw,nh,5);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle='#999';ctx.font=(nw*0.27)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('Next',nx+nw/2,ny-6);ctx.font=(nh*0.33)+'px Arial';ctx.fillStyle='#fff';ctx.fillText(nc.icon||'?',nx+nw/2,ny+nh/2);
  }
}

function renderDeployZone(){
  if(selectedCard<0||phase==='countdown'||phase==='ended')return;
  const card=CARS[player.hand[selectedCard]];if(!card)return;
  const isSpell=card.type==='spell'||card.type==='building';
  // Use 3D projection for deploy zone
  const[ax0,ay0]=toScr3D(0,0);const[ax1,ay1]=toScr3D(ARENA_W,ARENA_H);
  ctx.globalAlpha=0.11;
  if(isSpell){ctx.fillStyle=card.carColor||'#fff';ctx.fillRect(0,ay0,W,ay1-ay0);}
  else{const[,dy0]=toScr3D(0,RIVER_Y+RIVER_H/2+0.5);ctx.fillStyle='#44FF44';ctx.fillRect(0,dy0,W,ay1-dy0);}
  ctx.globalAlpha=1;
  if(deployPreview){
    const[px,py,pdf]=toScr3D(deployPreview.x,deployPreview.y);
    ctx.strokeStyle=card.carColor||'#fff';ctx.lineWidth=2;ctx.setLineDash([4,4]);
    ctx.beginPath();
    if(isSpell)ctx.arc(px,py,(card.radius||2)*scale*pdf,0,Math.PI*2);
    else ctx.arc(px,py,scale*0.8*pdf,0,Math.PI*2);
    ctx.stroke();ctx.setLineDash([]);
  }
}

function drawCitySilhouette(arena){
  const n=CITY_BUILDINGS.length,bw=W/n,baseY=H*0.54;
  CITY_BUILDINGS.forEach((frac,i)=>{
    const bh=H*frac,bx=i*bw,by=baseY-bh;
    ctx.fillStyle=arena?arena.sky2:'#060614';ctx.fillRect(bx,by,bw-2,bh);
    for(let row=0;row<4;row++)for(let col=0;col<3;col++){
      if(((i*13+row*7+col*5)%10)<=3)continue;
      const flicker=Math.sin(animT*2+i+row)>0.3?1:0.5;
      ctx.fillStyle='rgba(255,240,120,'+(0.2+flicker*0.15)+')';
      ctx.fillRect(bx+col*(bw/3.5)+4,by+row*18+8,7,5);
    }
    if(i%3===0&&arena){ctx.fillStyle=arena.n1+'88';ctx.fillRect(bx+2,by+bh*0.3,bw-4,3);ctx.shadowColor=arena.n1;ctx.shadowBlur=8;ctx.fillRect(bx+2,by+bh*0.3,bw-4,3);ctx.shadowBlur=0;}
  });
}
function drawNeonRoad(arena){
  const roadY=H*0.54;

  ctx.strokeStyle='rgba(255,200,0,0.25)';ctx.lineWidth=1.5;ctx.setLineDash([W*0.04,W*0.035]);
  ctx.beginPath();ctx.moveTo(0,roadY+(H-roadY)*0.45);ctx.lineTo(W,roadY+(H-roadY)*0.45);ctx.stroke();ctx.setLineDash([]);
  if(arena){ctx.strokeStyle=arena.n1+'44';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,roadY);ctx.lineTo(W,roadY);ctx.stroke();ctx.shadowColor=arena.n1;ctx.shadowBlur=6;ctx.beginPath();ctx.moveTo(0,roadY);ctx.lineTo(W,roadY);ctx.stroke();ctx.shadowBlur=0;}
}

  menuBtns.deckBuilderSave={x:W*0.48,y:H*0.91,w:W*0.47,h:H*0.055};

// ============================================================
// REWARD SCREEN -- Chest opening animation
// ============================================================
function renderRewardScreen(){
  if(!rewardState){screen='postgame';return;}
  darkBg();
  rewardState.t+=0.016;
  const t=rewardState.t;
  if(rewardState.phase==='chest'){
    // Chest bounce-in animation
    const arena=getArena(currentLevel);
    const sc=Math.min(1,t*2);const bounce=sc<1?sc*sc*(3-2*sc):1;
    ctx.save();ctx.translate(W/2,H*0.35);ctx.scale(bounce,bounce);
    // Chest glow
    ctx.shadowColor=rewardState.color;ctx.shadowBlur=30+Math.sin(t*6)*10;
    ctx.fillStyle=rewardState.color;ctx.font=(W*0.2)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(rewardState.icon,0,0);ctx.shadowBlur=0;ctx.restore();
    // Label
    ctx.fillStyle=rewardState.color;ctx.font='bold '+(W*0.06)+'px Arial';ctx.textAlign='center';
    ctx.fillText(rewardState.name,W/2,H*0.52);
    ctx.fillStyle='#888';ctx.font=(W*0.03)+'px Arial';
    ctx.fillText('Tap to open!',W/2,H*0.58);
    // Tap to open
    menuBtns.rewardTap={x:0,y:0,w:W,h:H};
    if(t>0.8){
      // Shimmer particles
      if(Math.random()<0.3){
        const px=W*0.3+Math.random()*W*0.4,py=H*0.2+Math.random()*H*0.25;
        ctx.fillStyle=rewardState.color;ctx.globalAlpha=0.5;
        ctx.beginPath();ctx.arc(px,py,2+Math.random()*3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
      }
    }
  } else if(rewardState.phase==='reveal'){
    // Reveal rewards one by one
    const revealT=rewardState.t-rewardState.revealStart;
    ctx.fillStyle=rewardState.color;ctx.font='bold '+(W*0.055)+'px Arial';ctx.textAlign='center';
    ctx.fillText(rewardState.name+' OPENED!',W/2,H*0.08);
    // Reward items
    const items=[];
    if(rewardState.fuel>0)items.push({label:'+'+rewardState.fuel+' FUEL',col:DESIGN.colors.crownGold,ic:'\u26FD'});
    if(rewardState.gears>0)items.push({label:'+'+rewardState.gears+' GEARS',col:'#AAA',ic:'\u2699'});
    if(rewardState.gems>0)items.push({label:'+'+rewardState.gems+' GEMS',col:'#AA44FF',ic:'\uD83D\uDC8E'});
    rewardState.newCards.forEach(cid=>{
      const car=CARS[cid];if(car){
        const rar=getCardRarity(cid);
        items.push({label:'NEW: '+car.name,col:rar.color,ic:car.icon});
      }
    });
    const itemH=H*0.08,startY=H*0.15;
    items.forEach((item,i)=>{
      const delay=i*0.3;
      if(revealT<delay)return;
      const itemT=Math.min(1,(revealT-delay)*3);
      const slideX=W*0.5+(1-itemT)*W*0.3;
      ctx.globalAlpha=itemT;
      ctx.fillStyle='rgba(15,15,30,0.9)';rr(W*0.12,startY+i*itemH*1.3,W*0.76,itemH,8);ctx.fill();
      ctx.strokeStyle=item.col;ctx.lineWidth=1.5;rr(W*0.12,startY+i*itemH*1.3,W*0.76,itemH,8);ctx.stroke();
      ctx.font=(itemH*0.45)+'px Arial';ctx.textAlign='left';ctx.fillStyle='#fff';
      ctx.fillText(item.ic,W*0.16,startY+i*itemH*1.3+itemH/2);
      ctx.fillStyle=item.col;ctx.font='bold '+(itemH*0.35)+'px Arial';
      ctx.fillText(item.label,W*0.28,startY+i*itemH*1.3+itemH/2);
      ctx.globalAlpha=1;
      if(revealT-delay<0.1&&revealT-delay>0)sfxRewardReveal();
    });
    // Continue button (after all revealed)
    if(revealT>items.length*0.3+0.5){
      const btnY=H*0.82,bw=W*0.5,bh=H*0.07;
      menuBtns.rewardContinue={x:W/2-bw/2,y:btnY,w:bw,h:bh};
      glowBtn(W/2-bw/2,btnY,bw,bh,'#1a2a00','#44FF44','CONTINUE',W*0.04,10,2);
    }
  }
}

let seasonScrollX=0;
function renderSeason(){
  darkBg();
  const arena=getArena(currentLevel);
  labelTxt('BATTLE PASS - SEASON 1',W/2,H*0.045,DESIGN.colors.crownGold,'bold '+(W*0.055)+'px Arial');
  // XP bar
  const xpBarW=W*0.8,xpBarH=H*0.035,xpBarX=W*0.1,xpBarY=H*0.09;
  ctx.fillStyle='#1a1a2e';rr(xpBarX,xpBarY,xpBarW,xpBarH,4);ctx.fill();
  const xpPct=Math.min(1,(playerProfile.seasonXP||0)/SEASON_CONFIG.xpPerTier);
  ctx.fillStyle=DESIGN.colors.crownGold;rr(xpBarX,xpBarY,xpBarW*xpPct,xpBarH,4);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold '+(xpBarH*0.7)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('Tier '+(playerProfile.seasonTier||0)+'/'+SEASON_CONFIG.maxTier+' | '+Math.floor(playerProfile.seasonXP||0)+'/'+SEASON_CONFIG.xpPerTier+' XP',W/2,xpBarY+xpBarH/2);
  // Horizontal scrolling reward track
  const tileW=W*0.18,tileH=H*0.28,tileGap=W*0.02;
  const trackY=H*0.16,trackH=tileH+H*0.06;
  ctx.fillStyle='rgba(10,10,25,0.8)';ctx.fillRect(0,trackY-H*0.01,W,trackH+H*0.02);
  ctx.save();ctx.beginPath();ctx.rect(0,trackY-H*0.01,W,trackH+H*0.02);ctx.clip();
  const currentTier=playerProfile.seasonTier||0;
  // Auto-scroll to current tier
  const targetScroll=Math.max(0,currentTier*(tileW+tileGap)-W*0.3);
  seasonScrollX+=(targetScroll-seasonScrollX)*0.1;
  for(let i=0;i<SEASON_CONFIG.maxTier;i++){
    const tx=W*0.05+i*(tileW+tileGap)-seasonScrollX;
    if(tx>W+tileW||tx<-tileW)continue;
    const rwd=SEASON_REWARDS[i];if(!rwd)continue;
    const claimed=i<currentTier;const current=i===currentTier;
    // Free track tile
    ctx.fillStyle=claimed?'#1a3a1a':'#0e0e1e';rr(tx,trackY,tileW,tileH*0.45,6);ctx.fill();
    ctx.strokeStyle=current?DESIGN.colors.crownGold:claimed?'#44FF44':'#444';ctx.lineWidth=current?2:1;
    rr(tx,trackY,tileW,tileH*0.45,6);ctx.stroke();
    ctx.fillStyle=claimed?'#44FF44':'#888';ctx.font='bold '+(tileW*0.15)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('T'+(i+1),tx+tileW/2,trackY+tileH*0.08);
    ctx.fillStyle=claimed?'#fff':'#aaa';ctx.font=(tileW*0.12)+'px Arial';
    const freeR=rwd.free;ctx.fillText(freeR.type==='fuel'?'\u26FD'+freeR.amount:freeR.type==='gears'?'\u2699'+freeR.amount:'\uD83D\uDC8E'+freeR.amount,tx+tileW/2,trackY+tileH*0.22);
    ctx.fillStyle='#888';ctx.font=(tileW*0.1)+'px Arial';ctx.fillText('FREE',tx+tileW/2,trackY+tileH*0.36);
    // Premium track tile
    const premY=trackY+tileH*0.5;
    ctx.fillStyle=claimed&&playerProfile.hasBattlePass?'#2a1a3a':'#0a0a14';rr(tx,premY,tileW,tileH*0.45,6);ctx.fill();
    ctx.strokeStyle=playerProfile.hasBattlePass?(current?DESIGN.colors.crownGold:'#AA44FF'):'#333';ctx.lineWidth=current?2:1;
    rr(tx,premY,tileW,tileH*0.45,6);ctx.stroke();
    const premR=rwd.premium;
    ctx.fillStyle=playerProfile.hasBattlePass?'#CC88FF':'#555';ctx.font=(tileW*0.12)+'px Arial';
    ctx.fillText(premR.type==='card'?(CARS[premR.id]?CARS[premR.id].icon:'?'):premR.type==='fuel'?'\u26FD'+premR.amount:'\uD83D\uDC8E'+premR.amount,tx+tileW/2,premY+tileH*0.2);
    ctx.fillStyle='#AA44FF';ctx.font=(tileW*0.1)+'px Arial';ctx.fillText('PREMIUM',tx+tileW/2,premY+tileH*0.36);
    if(claimed){ctx.fillStyle='rgba(0,255,100,0.15)';rr(tx,trackY,tileW,tileH,6);ctx.fill();}
  }
  ctx.restore();
  // Battle pass purchase button
  if(!playerProfile.hasBattlePass){
    const bpY=H*0.5,bpW=W*0.7,bpH=H*0.07;
    menuBtns.buyPass={x:W/2-bpW/2,y:bpY,w:bpW,h:bpH};
    glowBtn(W/2-bpW/2,bpY,bpW,bpH,'#1a0a2e','#AA44FF','BUY BATTLE PASS - 50 GEMS',W*0.035,10,2);
  }
  // Swipe hint
  ctx.fillStyle='#555';ctx.font=(W*0.025)+'px Arial';ctx.textAlign='center';
  ctx.fillText('< Swipe to scroll >',W/2,H*0.6);
  // Stats
  ctx.fillStyle='rgba(10,10,25,0.9)';rr(W*0.08,H*0.65,W*0.84,H*0.12,8);ctx.fill();
  ctx.fillStyle=DESIGN.colors.crownGold;ctx.font='bold '+(W*0.03)+'px Arial';ctx.textAlign='left';
  ctx.fillText('Season Progress',W*0.12,H*0.69);
  ctx.fillStyle='#aaa';ctx.font=(W*0.025)+'px Arial';
  ctx.fillText('Win = +'+SEASON_CONFIG.winXP+' XP | Loss = +'+SEASON_CONFIG.lossXP+' XP | Draw = +'+SEASON_CONFIG.drawXP+' XP',W*0.12,H*0.735);
  // Back button
  menuBtns.seasonBack={x:W*0.05,y:H*0.82,w:W*0.35,h:H*0.06};
  glowBtn(menuBtns.seasonBack.x,menuBtns.seasonBack.y,menuBtns.seasonBack.w,menuBtns.seasonBack.h,'#1a1a1a','#555','BACK',W*0.034,8,1);
}

  drawFrostedGlass(cX,cY,cW,cH,DESIGN.radius.lg,0.2);
  // Rarity border
  drawRarityBorder(cX,cY,cW,cH,DESIGN.radius.lg,rar,animT);
  // Icon
  ctx.font=(cW*0.3)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(c.icon,W/2,cY+cH*0.14);
  // Name plate -- frosted glass strip
  const npY=cY+cH*0.25,npH=cH*0.12;
  drawFrostedGlass(cX+4,npY,cW-8,npH,8,0.3);
  ctx.fillStyle=DESIGN.colors.ivoryCream;ctx.font='bold '+(W*0.055)+'px Arial';
  ctx.fillText(c.name,W/2,npY+npH*0.35);
  ctx.fillStyle=rar.color;ctx.font=(W*0.028)+'px Arial';
  ctx.fillText(rar.name+' | Level '+lvl+'/13',W/2,npY+npH*0.75);
  // Type + cost
  ctx.fillStyle=DESIGN.colors.asphaltGrey;ctx.font=(W*0.026)+'px Arial';
  ctx.fillText(c.type.toUpperCase()+' | Cost: '+c.cost+' Fuel',W/2,cY+cH*0.41);
  // Stats bars
  const statY=cY+cH*0.46,statH=H*0.023,statGap=H*0.033,statLX=cX+cW*0.08,statRX=cX+cW*0.92;
  const sc2=cardLevelScale(selectedDetailCard);
  const stats=[];
  if(c.hp)stats.push({label:'HP',val:Math.floor(c.hp*sc2),max:2000,col:'#44FF44'});
  if(c.dmg)stats.push({label:'DMG',val:Math.floor(c.dmg*sc2),max:500,col:'#FF4444'});

  if(c.atkSpd)stats.push({label:'ATK SPD',val:c.atkSpd,max:2,col:'#FF66FF'});
  for(let i=0;i<stats.length;i++){
    const s=stats[i],sy=statY+i*statGap,barW=statRX-statLX-W*0.18;
    ctx.fillStyle=DESIGN.colors.asphaltGrey;ctx.font='bold '+(W*0.024)+'px Arial';ctx.textAlign='left';ctx.textBaseline='middle';

    ctx.fillStyle=s.col;rr(bx,sy,barW*Math.min(1,s.val/s.max),statH,3);ctx.fill();
    ctx.fillStyle=DESIGN.colors.ivoryCream;ctx.font=(W*0.022)+'px Arial';ctx.textAlign='right';
    ctx.fillText(s.val.toFixed?s.val.toFixed(1):s.val,statRX,sy+statH/2);
  }
  // Ability
  const aY=statY+stats.length*statGap+H*0.01;
  if(c.ability){
    ctx.fillStyle=DESIGN.colors.crownGold;ctx.font='bold '+(W*0.028)+'px Arial';ctx.textAlign='center';
    ctx.fillText('Ability: '+c.ability,W/2,aY);
  }
  // Description
  ctx.fillStyle=DESIGN.colors.ivoryCream;ctx.font=(W*0.025)+'px Arial';ctx.textAlign='center';
  ctx.fillText(c.desc||'',W/2,aY+H*0.035);
  // Synergies
  if(c.syn&&c.syn.length>0){
    const synY=aY+H*0.065;
    ctx.fillStyle=DESIGN.colors.neonCyan;ctx.font=(W*0.022)+'px Arial';
    const synTxt=c.syn.map(s=>SYN_INFO[s]?SYN_INFO[s].n:s).join(' / ');
    ctx.fillText('Synergies: '+synTxt,W/2,synY);
  }
  // Upgrade button
  if(lvl<13){
    const cost=getUpgradeCost(lvl),afford=playerProfile.fuel>=cost;
    const ubW=W*0.5,ubH=H*0.06,ubX=(W-ubW)/2,ubY=H*0.82;
    menuBtns.cardDetailUpgrade={x:ubX,y:ubY,w:ubW,h:ubH};
    glowBtn(ubX,ubY,ubW,ubH,afford?'#0a1a0a':'#1a1a1a',afford?'#44FF44':'#555',
      'UPGRADE Lv.'+(lvl+1)+' - '+cost+' FUEL',W*0.032,DESIGN.radius.md,2);
  } else {
    menuBtns.cardDetailUpgrade=null;
    ctx.fillStyle=DESIGN.colors.crownGold;ctx.font='bold '+(W*0.035)+'px Arial';ctx.textAlign='center';
    ctx.fillText('MAX LEVEL',W/2,H*0.85);
  }
  // Back button
  menuBtns.cardDetailBack={x:W*0.05,y:H*0.92,w:W*0.35,h:H*0.055};
  glowBtn(menuBtns.cardDetailBack.x,menuBtns.cardDetailBack.y,menuBtns.cardDetailBack.w,menuBtns.cardDetailBack.h,'#1a1a1a','#555','BACK',W*0.034,8,1);
}

// ============================================================
// DRAG-DROP GHOST RENDERER
// ============================================================
function renderDragGhost(){
  if(!dragState.active||dragState.cardIdx<0)return;
  const cid=player.hand[dragState.cardIdx];if(!cid)return;
  const c=CARS[cid];if(!c)return;
  const ghostW=W*0.15,ghostH=W*0.2;
  ctx.globalAlpha=0.7;
  ctx.fillStyle=c.carColor||'#444';rr(dragState.x-ghostW/2,dragState.y-ghostH/2,ghostW,ghostH,8);ctx.fill();
  ctx.strokeStyle=DESIGN.colors.crownGold;ctx.lineWidth=2;rr(dragState.x-ghostW/2,dragState.y-ghostH/2,ghostW,ghostH,8);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font=(ghostW*0.5)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(c.icon,dragState.x,dragState.y-ghostH*0.1);
  ctx.font='bold '+(ghostW*0.2)+'px Arial';
  ctx.fillText(c.name,dragState.x,dragState.y+ghostH*0.25);
  ctx.globalAlpha=1;
  // Valid deploy zone highlight
  if(dragState.y<hudY){
    const[gx,gy]=toGame3D(dragState.x,dragState.y);
    const valid=c.type==='spell'||c.type==='building'?
      (gx>0.5&&gx<ARENA_W-0.5&&gy>0.5&&gy<ARENA_H-0.5):
      (gx>0.5&&gx<ARENA_W-0.5&&gy>RIVER_Y+RIVER_H/2+0.3&&gy<ARENA_H-0.5);
    if(valid){
      ctx.fillStyle='rgba(68,255,68,0.15)';ctx.beginPath();ctx.arc(dragState.x,dragState.y,W*0.06,0,Math.PI*2);ctx.fill();
    }
  }
}

// ============================================================
// HELPERS
// ============================================================
function rr(x,y,w,h,r){
  r=Math.min(Math.abs(r||0),Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function glowBtn(x,y,w,h,bg,glow,label,fs,radius,sw,textCol){
  let sc=1;
  if(btnAnimState.phase!=='idle'){
    const bx=btnAnimState.x,by=btnAnimState.y;
    if(bx>=x&&bx<=x+w&&by>=y&&by<=y+h){
      if(btnAnimState.phase==='press'){
        const p=Math.min(1,btnAnimState.t/DESIGN.timing.fast);
        sc=1-0.08*DESIGN.easing.outCubic(p);
      } else {
        const p=Math.min(1,btnAnimState.t/DESIGN.timing.spring);
        sc=0.92+0.08*DESIGN.easing.outCubic(p)+(p<0.3?0.05*Math.sin(p/0.3*Math.PI):0);
      }
    }
  }
  if(sc!==1){ctx.save();ctx.translate(x+w/2,y+h/2);ctx.scale(sc,sc);ctx.translate(-(x+w/2),-(y+h/2));}
  ctx.shadowColor=glow;ctx.shadowBlur=10;ctx.fillStyle=bg;rr(x,y,w,h,radius);ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle=glow;ctx.lineWidth=sw;rr(x,y,w,h,radius);ctx.stroke();
  ctx.save();ctx.globalAlpha=0.08;ctx.strokeStyle=DESIGN.colors.crownGold;ctx.lineWidth=1;rr(x+2,y+2,w-4,h-4,Math.max(2,radius-2));ctx.stroke();ctx.restore();
  ctx.fillStyle=textCol||'#fff';ctx.font='bold '+fs+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(label,x+w/2,y+h/2+1);
  if(sc!==1)ctx.restore();
}
function labelTxt(t,x,y,col,font){ctx.fillStyle=col;ctx.font=font;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y);}
function darkBg(){
  const arena=getArena(currentLevel);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,arena.sky1);g.addColorStop(1,arena.sky2);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=DESIGN.colors.neonCyan+'05';ctx.lineWidth=1;
  for(let x=0;x<W;x+=W/18){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=H/28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}
function inRect(x,y,r){return r&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}

// ============================================================
// INPUT (uses 3D inverse projection for arena clicks)
// ============================================================
let touchActive=false;

function handleTap(sx,sy){
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  try{const ac=getAudio();if(ac&&ac.state==='suspended')ac.resume();}catch(e){}
  triggerBtnAnim(sx,sy);

  // Card detail popup -- long press handled separately
  if(screen==='cardDetail'){
    if(inRect(sx,sy,menuBtns.cardDetailBack)){selectedDetailCard=null;transitionTo(cardDetailSource||'menu');return;}
    if(selectedDetailCard&&menuBtns.cardDetailUpgrade&&inRect(sx,sy,menuBtns.cardDetailUpgrade)){
      const cx=menuBtns.cardDetailUpgrade.x+menuBtns.cardDetailUpgrade.w/2;
      const cy=menuBtns.cardDetailUpgrade.y;
      if(upgradeCard(selectedDetailCard)){triggerCelebration(cx,cy);}return;
    }
    return;
  }

  if(screen==='menu'){
    if(inRect(sx,sy,menuBtns.battle)){transitionTo('mode_select');return;}
    if(inRect(sx,sy,menuBtns.deck)){deckPickSelected=[...playerProfile.deck];transitionTo('deckBuilder');return;}
    if(inRect(sx,sy,menuBtns.collection)){transitionTo('collection');return;}
    if(inRect(sx,sy,menuBtns.carpass)){transitionTo('season');return;}
    if(inRect(sx,sy,menuBtns.store)){transitionTo('store');return;}
    if(inRect(sx,sy,menuBtns.levels)){transitionTo('levels');return;}
    if(inRect(sx,sy,menuBtns.deckBuilder)){deckPickSelected=[...playerProfile.deck];transitionTo('deckBuilder');return;}
    return;
  }
  if(screen==='mode_select'){
    if(menuBtns.modes){
      if(inRect(sx,sy,menuBtns.modes['1v1'])){selectedMode='1v1';initBattle();return;}
      if(inRect(sx,sy,menuBtns.modes['ranked'])){selectedMode='ranked';initBattle();return;}
    }
    if(inRect(sx,sy,menuBtns.back)){transitionTo('menu');return;}
    return;
  }
  if(screen==='levels'){
    for(const[lvl,rect]of Object.entries(levelBtns)){if(inRect(sx,sy,rect)){currentLevel=parseInt(lvl);return;}}
    if(inRect(sx,sy,menuBtns.levelBack)){transitionTo('menu');return;}
    if(inRect(sx,sy,menuBtns.levelPlay)){initBattle();return;}
    return;
  }
  if(screen==='deckBuilder'||screen==='deck_pick'){
    if(menuBtns.presets){for(const[k,rect]of Object.entries(menuBtns.presets)){if(inRect(sx,sy,rect)){const preset=DECK_PRESETS[k];if(preset){deckPickSelected=[...preset.ids];return;}}}}
    if(deckBuilderBtns&&deckBuilderBtns.tabs){for(const[tab,rect]of Object.entries(deckBuilderBtns.tabs)){if(inRect(sx,sy,rect)){deckBuilderFilter=tab;return;}}}
    if(deckBuilderBtns&&deckBuilderBtns.cards){
      for(const[cid,rect]of Object.entries(deckBuilderBtns.cards)){
        if(inRect(sx,sy,rect)){
          const idx=deckPickSelected.indexOf(cid);
          if(idx>=0)deckPickSelected.splice(idx,1);
          else if(deckPickSelected.length<8)deckPickSelected.push(cid);
          return;
        }
      }
    }
    if(inRect(sx,sy,menuBtns.deckBuilderSave)&&deckPickSelected.length===8){playerProfile.deck=[...deckPickSelected];transitionTo('menu');return;}
    if(inRect(sx,sy,menuBtns.deckBuilderBack)){transitionTo('menu');return;}
    return;
  }
  if(screen==='collection'){
    // Long-press on card opens detail
    if(deckBuilderBtns&&deckBuilderBtns.cards){
      for(const[cid,rect]of Object.entries(deckBuilderBtns.cards)){
        if(inRect(sx,sy,rect)){selectedDetailCard=cid;cardDetailSource='collection';transitionTo('cardDetail');return;}
      }
    }
    if(inRect(sx,sy,menuBtns.collBack)){transitionTo('menu');}return;
  }
  if(screen==='store'){
    if(inRect(sx,sy,menuBtns.storeBack)){transitionTo('menu');return;}
    // Shop buy buttons
    const offers=getDailyOffers();
    const allOffers=[offers.featured,...offers.others];
    for(const item of allOffers){
      if(shopBtns[item.id]&&inRect(sx,sy,shopBtns[item.id])){buyShopItem(item);sfxButtonPress();return;}
    }
    // Upgrade buttons
    if(shopBtns.upgrades){
      for(const[cid,rect]of Object.entries(shopBtns.upgrades)){
        if(inRect(sx,sy,rect)){if(upgradeCard(cid))triggerCelebration(rect.x+rect.w/2,rect.y);return;}
      }
    }
    return;
  }
  if(screen==='season'){
    if(inRect(sx,sy,menuBtns.seasonBack)){transitionTo('menu');return;}
    if(menuBtns.buyPass&&inRect(sx,sy,menuBtns.buyPass)&&!playerProfile.hasBattlePass&&playerProfile.gems>=50){
      playerProfile.gems-=50;playerProfile.hasBattlePass=true;sfxChestOpen();return;
    }
    return;
  }
  if(screen==='rewards'){
    if(rewardState&&rewardState.phase==='chest'&&rewardState.t>0.5){
      rewardState.phase='reveal';rewardState.revealStart=rewardState.t;
      applyRewards(rewardState);sfxChestOpen();return;
    }
    if(rewardState&&rewardState.phase==='reveal'&&menuBtns.rewardContinue&&inRect(sx,sy,menuBtns.rewardContinue)){
      rewardState=null;transitionTo('postgame');return;
    }
    return;
  }
  if(screen==='postgame'){
    // Show reward screen on first tap if rewards exist
    if(rewardState&&rewardState.phase==='chest'){transitionTo('rewards');return;}
    if(inRect(sx,sy,pgBtn)){initBattle();return;}
    if(inRect(sx,sy,pgMenuBtn)){transitionTo('menu');return;}
    return;
  }
  if(screen!=='battle'||phase==='countdown'||phase==='ended')return;

  if(inRect(sx,sy,menuBtns.emojiBtn)){emojiOpen=!emojiOpen;return;}
  if(emojiOpen&&menuBtns.emojis){
    for(const[idx,rect]of Object.entries(menuBtns.emojis)){if(inRect(sx,sy,rect)){sendEmoji(parseInt(idx));return;}}
    emojiOpen=false;return;
  }

  for(let i=0;i<4;i++){
    if(inRect(sx,sy,cardSlots[i])){
      const card=CARS[player.hand[i]];if(!card)return;
      if(selectedCard===i)selectedCard=-1;
      else if(player.elixir>=card.cost)selectedCard=i;
      deployPreview=null;return;
    }
  }
  // Deploy using 3D inverse projection
  if(selectedCard>=0&&sy<hudY){
    const[gx,gy]=toGame3D(sx,sy);
    const card=CARS[player.hand[selectedCard]];
    if(!card||player.elixir<card.cost){selectedCard=-1;return;}
    if(card.type==='spell'||card.type==='building'){
      if(gx>0.5&&gx<ARENA_W-0.5&&gy>0.5&&gy<ARENA_H-0.5){playCard(player,selectedCard,gx,gy);selectedCard=-1;deployPreview=null;}
    } else {
      if(gx>0.5&&gx<ARENA_W-0.5&&gy>RIVER_Y+RIVER_H/2+0.3&&gy<ARENA_H-0.5){playCard(player,selectedCard,gx,gy);selectedCard=-1;deployPreview=null;}
    }
    return;
  }
  if(sy<hudY){selectedCard=-1;deployPreview=null;}
}

function handleMove(sx,sy){
  if(selectedCard>=0&&sy<hudY){const[gx,gy]=toGame3D(sx,sy);deployPreview={x:gx,y:gy};}
  cardHoverIdx=-1;
  for(let i=0;i<4;i++){if(cardSlots[i]&&inRect(sx,sy,cardSlots[i])){cardHoverIdx=i;break;}}
}

canvas.addEventListener('touchstart',e=>{
  e.preventDefault();touchActive=true;
  const sx=e.touches[0].clientX,sy=e.touches[0].clientY;
  // Drag-drop: if tapping a card during battle, start hold timer
  if(screen==='battle'&&phase!=='countdown'&&phase!=='ended'){
    for(let i=0;i<4;i++){
      if(cardSlots[i]&&inRect(sx,sy,cardSlots[i])){
        const card=CARS[player.hand[i]];
        if(card&&player.elixir>=card.cost){
          dragState={active:false,cardIdx:i,x:sx,y:sy,holdTimer:0,startX:sx,startY:sy};
        }
        break;
      }
    }
  }
  handleTap(sx,sy);
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();if(!touchActive)return;
  const sx=e.touches[0].clientX,sy=e.touches[0].clientY;
  // Drag detection: if we have a pending drag and moved enough
  if(dragState.cardIdx>=0&&!dragState.active){
    const dx=sx-dragState.startX,dy=sy-dragState.startY;
    if(Math.abs(dx)+Math.abs(dy)>15){dragState.active=true;selectedCard=dragState.cardIdx;}
  }
  if(dragState.active){dragState.x=sx;dragState.y=sy;}
  handleMove(sx,sy);
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();touchActive=false;
  // Drag-drop deploy
  if(dragState.active&&dragState.cardIdx>=0&&dragState.y<hudY){
    const[gx,gy]=toGame3D(dragState.x,dragState.y);
    const card=CARS[player.hand[dragState.cardIdx]];
    if(card&&player.elixir>=card.cost){
      const valid=card.type==='spell'||card.type==='building'?
        (gx>0.5&&gx<ARENA_W-0.5&&gy>0.5&&gy<ARENA_H-0.5):
        (gx>0.5&&gx<ARENA_W-0.5&&gy>RIVER_Y+RIVER_H/2+0.3&&gy<ARENA_H-0.5);
      if(valid){playCard(player,dragState.cardIdx,gx,gy);selectedCard=-1;}
    }
  }
  dragState={active:false,cardIdx:-1,x:0,y:0,holdTimer:0,startX:0,startY:0};
  deployPreview=null;
},{passive:false});
canvas.addEventListener('click',e=>{if(!touchActive)handleTap(e.clientX,e.clientY);});
canvas.addEventListener('mousemove',e=>{handleMove(e.clientX,e.clientY);});

// ============================================================
// GAME LOOP
// ============================================================
let lastT=0;
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,0.05);lastT=ts;
  if(screen==='battle')updateBattle(dt);
  updateBtnAnimations(dt);
  updateTransition(dt);
  updateCelebration(dt);
  render(ts);
  requestAnimationFrame(loop);
}
window.addEventListener('resize',resize);
resize();
requestAnimationFrame(loop);
</script>
