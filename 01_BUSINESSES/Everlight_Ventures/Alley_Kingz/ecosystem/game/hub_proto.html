<!doctype html><html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Alley Kingz -- The Lot (walkable world proto)</title>
<!-- AK-HUB-PHASE0-v3 2026-06-18: big multi-direction scrolling world. 3 districts (bg tint shifts as you cross),
     a building per game mode wired to its REAL screen (Arena -> ?go=match real battle), dwell-to-enter + fade.
     Standalone throwaway proto, no deps. -->
<style>
  html,body{margin:0;height:100%;background:#06060a;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#E8E8E8;-webkit-tap-highlight-color:transparent;}
  #c{display:block;width:100vw;height:100vh;}
  #hud{position:fixed;left:0;right:0;top:0;padding:8px 12px;font-size:11px;letter-spacing:.05em;color:#c9a84c;text-align:center;pointer-events:none;text-shadow:0 1px 3px #000;}
  #dist{position:fixed;left:0;right:0;top:26px;text-align:center;font-weight:800;font-size:15px;letter-spacing:.14em;color:#e8c55a;pointer-events:none;text-shadow:0 1px 4px #000;opacity:.92;}
  #banner{position:fixed;left:50%;top:38%;transform:translateX(-50%);padding:12px 22px;border-radius:12px;background:rgba(12,12,18,.93);border:1px solid #c9a84c;color:#e8c55a;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;max-width:82vw;}
  #fight{position:fixed;right:12px;bottom:14px;padding:12px 18px;border-radius:14px;background:linear-gradient(180deg,#e8c55a,#c9a84c);color:#1a1206;font-weight:800;font-size:13px;border:none;box-shadow:0 4px 14px rgba(201,168,76,.4);letter-spacing:.05em;z-index:5;}
  #stick{position:fixed;left:16px;bottom:16px;width:116px;height:116px;border-radius:50%;background:rgba(201,168,76,.10);border:1px solid rgba(201,168,76,.35);touch-action:none;z-index:5;}
  #nub{position:absolute;left:33px;top:33px;width:50px;height:50px;border-radius:50%;background:rgba(201,168,76,.55);}
  #radar{position:fixed;right:10px;top:46px;width:100px;height:128px;border-radius:8px;background:rgba(8,8,14,.78);border:1px solid rgba(201,168,76,.5);z-index:5;}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:20;}
  .tag{position:fixed;bottom:5px;left:0;right:0;text-align:center;font-size:9px;color:#555;}
  /* AK-HUD: persistent home-screen HUD (player chip + resources) */
  #phud{position:fixed;left:10px;top:30px;z-index:6;display:flex;gap:6px;align-items:center;font-family:Inter,sans-serif;pointer-events:none;}
  #phud .chip{background:rgba(8,8,14,.82);border:1px solid rgba(201,168,76,.55);border-radius:18px;padding:5px 11px;font-size:11px;font-weight:800;color:#e8c55a;letter-spacing:.03em;}
  #phud .res{background:rgba(8,8,14,.82);border:1px solid rgba(201,168,76,.35);border-radius:14px;padding:4px 9px;font-size:11px;font-weight:700;color:#E8E8E8;}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">THE LOT &mdash; walk to a building to enter its mode &middot; tap / joystick / WASD / arrows / hjkl</div>
<div id="phud"><span class="chip" id="ph-name">&#128100; STRAY</span><span class="res" id="ph-gold">&#129689; -</span><span class="res" id="ph-gem">&#128142; -</span></div>
<div id="dist"></div>
<canvas id="radar" width="100" height="128"></canvas>
<div id="banner"></div>
<button id="fight">FIGHT NOW</button>
<div id="stick"><div id="nub"></div></div>
<div id="fade"></div>
<div class="tag">walkable world proto &bull; 3 districts &bull; not the final build</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const rad=document.getElementById('radar'),rctx=rad.getContext('2d');
const fade=document.getElementById('fade'),distEl=document.getElementById('dist');
let W,H,DPR=Math.min(2,window.devicePixelRatio||1);
function resize(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
const WORLD_W=2600, WORLD_H=2600;
const dog=new Image();dog.src='assets/cards/0001_bcardd.webp';dog.onerror=()=>{dog.src='assets/cards/0001_bcardd.png';};
// AK-FACADES 2026-06-19: building facade art (Leonardo) + INDEPENDENT building LEVELS (the Clash/Dark-War intricacy made visible -- each building its own level)
const FAC={TROPHY:'trophy',FIXER:'fixer',GARAGE:'garage',DROP:'drop',KENNEL:'kennel',CLAN:'clan',PASS:'pass',WARD:'wardrobe',ARCH:'archive',STREET:'street',ARCADE:'arcade'};
const LV={ARENA:8,TROPHY:4,FIXER:3,GARAGE:6,DROP:5,KENNEL:4,CLAN:5,PASS:2,WARD:3,ARCH:2,STREET:3,ARCADE:1};
const facImg={}; for(const _k in FAC){ var _im=new Image(); _im.src='assets/hub/'+FAC[_k]+'.png'; facImg[_k]=_im; }
// AK-GROUND: the generated themed district GROUND art (Alley Kingz cyberpunk street) -- the map IS a painted image, not a grid
const groundImg={uptown:new Image(),midtown:new Image(),docks:new Image()};
groundImg.uptown.src='assets/hub/uptown_ground.png'; groundImg.midtown.src='assets/hub/midtown_ground.png'; groundImg.docks.src='assets/hub/docks_ground.png';
function groundFor(y){ return y<900?groundImg.uptown : y<1750?groundImg.midtown : groundImg.docks; }
const me={x:1300,y:1300,tx:null,ty:null,r:23,spd:300};
let cam={x:0,y:0};
// districts (by y) -> bg tint shifts in real time as you cross. [name, yTop, color]
const DIST=[{n:'UPTOWN',y:0,c:[10,14,24]},{n:'MIDTOWN',y:900,c:[14,12,18]},{n:'THE DOCKS',y:1750,c:[9,16,12]}];
function distAt(y){let d=DIST[0];for(const z of DIST)if(y>=z.y)d=z;return d;}
function bgColor(y){ // smooth lerp between district colors by world-y
  let t=Math.max(0,Math.min(1,y/WORLD_H));
  let a=t<.42?DIST[0].c:t<.70?DIST[1].c:DIST[2].c;
  let b=t<.42?DIST[1].c:DIST[2].c; let f=t<.42?(t/.42):t<.70?((t-.42)/.28):1;
  const m=(i)=>Math.round(a[i]+(b[i]-a[i])*f); return 'rgb('+m(0)+','+m(1)+','+m(2)+')';
}
// a building per game mode, spread in ALL directions across the 3 districts. url=real screen, or 'soon'.
const buildings=[
  // UPTOWN
  {id:'ARENA', label:'THE ARENA', col:'#e8c55a', x:1300,y:470, w:210,h:124, url:'index.html?go=match', act:'real BATTLE'},
  {id:'TROPHY',label:'TROPHY HALL',col:'#ffd76b', x:840, y:600, w:160,h:96,  url:'soon',                act:'trophies / profile'},
  {id:'FIXER', label:'THE FIXER',  col:'#ff9d5c', x:1780,y:600, w:160,h:96,  url:'shop/shop.html#hit2', act:'Hit List bounties'},
  // MIDTOWN
  {id:'GARAGE',label:'THE GARAGE', col:'#7fc8ff', x:560, y:1120,w:170,h:104, url:'shop/shop.html#deck', act:'deck builder'},
  {id:'DROP',  label:'THE DROP',   col:'#ff8fae', x:2040,y:1120,w:170,h:104, url:'shop/shop.html',      act:'the SHOP'},
  {id:'KENNEL',label:'THE KENNEL', col:'#b6f06b', x:1300,y:1300,w:160,h:96,  url:'shop/shop.html#handlers',act:'handlers / commanders'},
  {id:'CLAN',  label:'CLAN YARD',  col:'#9d8bff', x:600, y:1560,w:170,h:104, url:'shop/shop.html#crew2', act:'crews / chat'},
  {id:'PASS',  label:'PASS HOUSE', col:'#5ad0c0', x:2000,y:1560,w:170,h:104, url:'shop/shop.html#pass2', act:'Alley Pass'},
  // THE DOCKS
  {id:'WARD',  label:'THE WARDROBE',col:'#ff79c6',x:760, y:2040,w:160,h:96,  url:'shop/shop.html#drip2',act:'Drip cosmetics'},
  {id:'ARCH',  label:'THE ARCHIVE', col:'#c9a8ff',x:1860,y:2040,w:160,h:96,  url:'shop/shop.html#codex2',act:'the Codex'},
  {id:'STREET',label:'THE STREET',  col:'#7CFFb0',x:1120,y:2250,w:160,h:96,  url:'shop/shop.html#street',act:'street mode'},
  {id:'ARCADE',label:'THE ARCADE',  col:'#7CFFE0',x:1620,y:2210,w:160,h:96,  url:'soon',                act:'mini-games'},
];
const plaza={x:WORLD_W/2,y:1320};
const props=[];(function(){let s=70217;function rnd(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;}
  for(let i=0;i<150;i++){props.push({x:50+rnd()*(WORLD_W-100),y:50+rnd()*(WORLD_H-100),t:rnd()<.5?'lamp':'crate',h:.5+rnd()*.9});}})();
const npc={x:1300,y:1430,r:19,name:'OL’ SCRAPS',line:'"Whole block’s yours, mutt. Arena up north. Shops midtown. Docks down south."'};
let keys={};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(['arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;});
cv.addEventListener('pointerdown',e=>{me.tx=e.clientX+cam.x;me.ty=e.clientY+cam.y;});
let stickV={x:0,y:0},stickOn=false;const stick=document.getElementById('stick'),nub=document.getElementById('nub');
stick.addEventListener('pointerdown',e=>{stickOn=true;stick.setPointerCapture(e.pointerId);});
stick.addEventListener('pointermove',e=>{if(!stickOn)return;const r=stick.getBoundingClientRect();let dx=e.clientX-(r.left+58),dy=e.clientY-(r.top+58);const m=Math.hypot(dx,dy)||1;const cl=Math.min(m,44);dx=dx/m*cl;dy=dy/m*cl;nub.style.left=(33+dx)+'px';nub.style.top=(33+dy)+'px';stickV.x=dx/44;stickV.y=dy/44;me.tx=me.ty=null;});
function stickEnd(){stickOn=false;stickV.x=stickV.y=0;nub.style.left='33px';nub.style.top='33px';}
stick.addEventListener('pointerup',stickEnd);stick.addEventListener('pointercancel',stickEnd);
const banner=document.getElementById('banner');let bannerT=0;
function showBanner(t,hold){banner.textContent=t;banner.style.opacity='1';bannerT=hold||1.6;}
let entering=false;
function doEnter(url,label){ if(entering)return; entering=true; showBanner('Entering '+label+'…',3); fade.style.opacity='1';
  setTimeout(function(){ try{ window.location.href=url; }catch(_e){ entering=false; fade.style.opacity='0'; } }, 480); }
document.getElementById('fight').onclick=()=>doEnter('index.html?go=match','THE ARENA');
let dwellB=null, dwellT=0;
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  let vx=0,vy=0;
  if(keys['a']||keys['arrowleft']||keys['h'])vx-=1; if(keys['d']||keys['arrowright']||keys['l'])vx+=1;
  if(keys['w']||keys['arrowup']||keys['k'])vy-=1; if(keys['s']||keys['arrowdown']||keys['j'])vy+=1;
  if(stickV.x||stickV.y){vx=stickV.x;vy=stickV.y;}
  if(!entering){
    if(vx||vy){const m=Math.hypot(vx,vy)||1;me.x+=vx/m*me.spd*dt;me.y+=vy/m*me.spd*dt;me.tx=me.ty=null;}
    else if(me.tx!=null){const dx=me.tx-me.x,dy=me.ty-me.y,d=Math.hypot(dx,dy);if(d>4){me.x+=dx/d*Math.min(me.spd*dt,d);me.y+=dy/d*Math.min(me.spd*dt,d);}else me.tx=me.ty=null;}
  }
  me.x=Math.max(20,Math.min(WORLD_W-20,me.x));me.y=Math.max(20,Math.min(WORLD_H-20,me.y));
  cam.x=Math.max(0,Math.min(WORLD_W-W, me.x-W/2));
  cam.y=Math.max(0,Math.min(WORLD_H-H, me.y-H/2));
  distEl.textContent=distAt(me.y).n;
  // door proximity: each building's door is front-bottom-center
  let near=null;for(const b of buildings){const dx=me.x-b.x, dy=me.y-(b.y+b.h/2);if(Math.hypot(dx,dy)<me.r+30){near=b;break;}}
  if(near){ if(dwellB!==near){dwellB=near;dwellT=0;}
    if(near.url==='soon'){ if(dwellT===0)showBanner(near.label+' → '+near.act+' (coming soon)',1.6); dwellT=0.01; }
    else { dwellT+=dt; showBanner('Entering '+near.label+' → '+near.act+'…',0.4);
      if(dwellT>0.125) doEnter(near.url,near.label); }   // AK: 1/8s dwell (operator: 1/2 too long)
  } else { dwellB=null; dwellT=0;
    if(!near && Math.hypot(me.x-npc.x,me.y-npc.y)<me.r+npc.r+8){ showBanner(npc.name+': '+npc.line,1.4); } }
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)banner.style.opacity='0';}
  draw();drawRadar();requestAnimationFrame(loop);
}
function wx(x){return x-cam.x;} function wy(y){return y-cam.y;}
function draw(){ctx.fillStyle=bgColor(me.y);ctx.fillRect(0,0,W,H);
  // AK-GROUND: the generated themed district ground art, tiled + scrolling with the camera = the painted map base layer
  var gd=groundFor(me.y);
  if(gd&&gd.complete&&gd.naturalWidth>0){ if(!gd._pat){var oc=document.createElement('canvas');oc.width=oc.height=320;oc.getContext('2d').drawImage(gd,0,0,320,320);gd._pat=ctx.createPattern(oc,'repeat');}
    ctx.save();ctx.globalAlpha=0.62;ctx.fillStyle=gd._pat;ctx.translate(-(cam.x%320),-(cam.y%320));ctx.fillRect(0,0,W+320,H+320);ctx.restore(); }
  ctx.strokeStyle='rgba(201,168,76,.05)';ctx.lineWidth=1;const G=80,ox=-(cam.x%G),oy=-(cam.y%G);
  for(let x=ox;x<W;x+=G){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=oy;y<H;y+=G){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // roads: each building branches to the plaza
  ctx.strokeStyle='rgba(120,120,140,.22)';ctx.lineWidth=22;ctx.lineCap='round';
  buildings.forEach(b=>{ctx.beginPath();ctx.moveTo(wx(plaza.x),wy(plaza.y));ctx.lineTo(wx(b.x),wy(b.y));ctx.stroke();});
  props.forEach(p=>{const X=wx(p.x),Y=wy(p.y);if(X<-30||X>W+30||Y<-30||Y>H+30)return;
    if(p.t==='lamp'){ctx.save();ctx.shadowColor='#c9a84c';ctx.shadowBlur=10;ctx.fillStyle='rgba(201,168,76,.5)';ctx.beginPath();ctx.arc(X,Y,3.5,0,7);ctx.fill();ctx.restore();ctx.strokeStyle='rgba(150,150,160,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X,Y);ctx.lineTo(X,Y+16*p.h);ctx.stroke();}
    else{ctx.fillStyle='rgba(70,68,86,.6)';ctx.fillRect(X-6,Y-6,13*p.h,13*p.h);}});
  buildings.forEach(b=>{const X=wx(b.x),Y=wy(b.y);if(X<-220||X>W+220||Y<-220||Y>H+220)return;
    var fi=facImg[b.id];
    if(fi&&fi.complete&&fi.naturalWidth>0){ // real facade art, cover-fit + clipped to the footprint
      ctx.save();ctx.beginPath();ctx.rect(X-b.w/2,Y-b.h/2,b.w,b.h);ctx.clip();
      var ar=fi.naturalWidth/fi.naturalHeight, rr=b.w/b.h, dw,dh;
      if(ar>rr){dh=b.h;dw=dh*ar;}else{dw=b.w;dh=dw/ar;}
      ctx.drawImage(fi,X-dw/2,Y-dh/2,dw,dh);ctx.restore();
      ctx.save();ctx.shadowColor=b.col;ctx.shadowBlur=14;ctx.strokeStyle=b.col;ctx.lineWidth=2.5;ctx.strokeRect(X-b.w/2,Y-b.h/2,b.w,b.h);ctx.restore();
    } else { // rect fallback (ARENA facade is premium Seedance, pending)
      ctx.save();ctx.shadowColor=b.col;ctx.shadowBlur=18;ctx.fillStyle='#1a1925';ctx.strokeStyle=b.col;ctx.lineWidth=2.5;ctx.beginPath();ctx.rect(X-b.w/2,Y-b.h/2,b.w,b.h);ctx.fill();ctx.stroke();ctx.restore();
      ctx.fillStyle=b.col;ctx.globalAlpha=(b.url==='soon')?.35:.85;ctx.fillRect(X-15,Y+b.h/2-24,30,24);ctx.globalAlpha=1;
    }
    ctx.fillStyle=b.col;ctx.font='700 12px Inter,sans-serif';ctx.textAlign='center';ctx.fillText(b.label,X,Y-b.h/2-7);
    var lv=LV[b.id]||1; ctx.fillStyle='rgba(8,8,14,.88)';ctx.fillRect(X+b.w/2-30,Y-b.h/2+4,26,15);ctx.fillStyle=b.col;ctx.font='700 10px Inter';ctx.fillText('Lv'+lv,X+b.w/2-17,Y-b.h/2+15);
    if(b.url==='soon'){ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='9px Inter';ctx.fillText('soon',X,Y+4);}});
  {const X=wx(npc.x),Y=wy(npc.y);ctx.fillStyle='#9d8bff';ctx.beginPath();ctx.arc(X,Y,npc.r,0,7);ctx.fill();ctx.fillStyle='#9d8bff';ctx.font='700 10px Inter';ctx.textAlign='center';ctx.fillText('NPC',X,Y-npc.r-5);}
  const ar=buildings[0],aX=wx(ar.x),aY=wy(ar.y);
  if(aX<0||aX>W||aY<0||aY>H){const ang=Math.atan2(ar.y-me.y,ar.x-me.x);const px=Math.max(28,Math.min(W-28,wx(me.x)+Math.cos(ang)*58)),py=Math.max(80,Math.min(H-80,wy(me.y)+Math.sin(ang)*58));ctx.save();ctx.translate(px,py);ctx.rotate(ang);ctx.fillStyle=ar.col;ctx.beginPath();ctx.moveTo(13,0);ctx.lineTo(-8,-7);ctx.lineTo(-8,7);ctx.closePath();ctx.fill();ctx.restore();}
  const X=wx(me.x),Y=wy(me.y);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(X,Y+me.r+2,me.r*.8,5,0,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(X,Y,me.r,0,7);ctx.closePath();ctx.shadowColor='#c9a84c';ctx.shadowBlur=13;ctx.fillStyle='#222';ctx.fill();ctx.clip();
  if(dog.complete&&dog.naturalWidth>0)ctx.drawImage(dog,X-me.r,Y-me.r-5,me.r*2,me.r*2+10);else{ctx.fillStyle='#c9a84c';ctx.fillRect(X-me.r,Y-me.r,me.r*2,me.r*2);}
  ctx.restore();ctx.strokeStyle='#c9a84c';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(X,Y,me.r,0,7);ctx.stroke();
}
function drawRadar(){rctx.clearRect(0,0,100,128);const sx=100/WORLD_W, sy=128/WORLD_H;
  // district bands
  DIST.forEach((z,i)=>{const y0=z.y*sy, y1=(i<DIST.length-1?DIST[i+1].y:WORLD_H)*sy;rctx.fillStyle='rgba('+z.c[0]+','+z.c[1]+','+z.c[2]+',.9)';rctx.fillRect(0,y0,100,y1-y0);});
  rctx.strokeStyle='rgba(255,255,255,.22)';rctx.lineWidth=1;rctx.strokeRect(cam.x*sx,cam.y*sy,W*sx,H*sy);
  buildings.forEach(b=>{rctx.fillStyle=b.url==='soon'?'rgba(150,150,150,.7)':b.col;rctx.beginPath();rctx.arc(b.x*sx,b.y*sy,2.4,0,7);rctx.fill();});
  rctx.fillStyle='#fff';rctx.beginPath();rctx.arc(me.x*sx,me.y*sy,2.6,0,7);rctx.fill();
}
// AK-HUD populate: pull player name + economy from shared localStorage (best-effort; textContent = XSS-safe)
(function(){try{
  var nm=localStorage.getItem('ak_name')||localStorage.getItem('playerName')||localStorage.getItem('pc_name')||'STRAY';
  var g=null,gm=null;
  ['ak_econ','economy','AK_ECON','ak_profile','akProfile','DBPROFILE'].forEach(function(k){try{var v=JSON.parse(localStorage.getItem(k)||'null');if(v){if(v.gold!=null)g=v.gold;if(v.gems!=null)gm=v.gems;else if(v.gem!=null)gm=v.gem;}}catch(_e){}});
  if(g==null){var gd=localStorage.getItem('ak_gold')||localStorage.getItem('gold');if(gd!=null)g=gd;}
  if(gm==null){var ge=localStorage.getItem('ak_gems')||localStorage.getItem('gems');if(ge!=null)gm=ge;}
  document.getElementById('ph-name').textContent=String(nm).slice(0,18);
  if(g!=null)document.getElementById('ph-gold').textContent='Gold '+String(g).slice(0,9);
  if(gm!=null)document.getElementById('ph-gem').textContent='Gems '+String(gm).slice(0,9);
}catch(_e){}})();
requestAnimationFrame(loop);
</script></body></html>
