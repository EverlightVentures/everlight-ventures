version: "3.8"

# Uptime Kuma - external heartbeat and endpoint monitoring
# Official project:
# https://github.com/louislam/uptime-kuma

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - everlight

volumes:
  uptime_kuma_data:

networks:
  everlight:
    name: everlight
    external: true
