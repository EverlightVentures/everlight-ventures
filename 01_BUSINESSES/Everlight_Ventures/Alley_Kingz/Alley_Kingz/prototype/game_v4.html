// AUDIO ENGINE v2 -- Layered + Reverb
// ============================================================
let audioCtx=null;
function getAudio(){if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}return audioCtx;}
function playTone(freq,type,dur,vol,freqEnd){
  const ac=getAudio();if(!ac)return;
  try{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type=type||'sine';o.frequency.setValueAtTime(freq,ac.currentTime);if(freqEnd)o.frequency.exponentialRampToValueAtTime(Math.max(20,freqEnd),ac.currentTime+dur);g.gain.setValueAtTime(vol||0.3,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);o.start(ac.currentTime);o.stop(ac.currentTime+dur+0.05);}catch(e){}
}
function playNoise(dur,vol,fType,fFreq){
  const ac=getAudio();if(!ac)return;
  try{const buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);const src=ac.createBufferSource(),g=ac.createGain();src.buffer=buf;if(fType){const f=ac.createBiquadFilter();f.type=fType;f.frequency.value=fFreq||1000;src.connect(f);f.connect(g);}else{src.connect(g);}g.connect(ac.destination);g.gain.setValueAtTime(vol||0.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);src.start();src.stop(ac.currentTime+dur);}catch(e){}
}

let W,H,scale,offX,offY,arenaPixH,hudY,hudH,cardSlots=[],cardHoverIdx=-1;
function resize(){
  W=window.innerWidth;H=window.innerHeight;canvas.width=W;canvas.height=H;
  hudH=Math.floor(H*0.22);hudY=H-hudH;arenaPixH=hudY;
  const sx=W/ARENA_W,sy=arenaPixH/ARENA_H;scale=Math.min(sx,sy);
  offX=(W-ARENA_W*scale)/2;offY=(arenaPixH-ARENA_H*scale)/2;
  const cardW=Math.floor(W*0.19),cardH=Math.floor(hudH*0.62),gap=Math.floor(W*0.02);
  const totalW=cardW*4+gap*3,startX=Math.floor((W-totalW)/2),cardY=hudY+Math.floor(hudH*0.32);
  cardSlots=[];for(let i=0;i<4;i++)cardSlots.push({x:startX+i*(cardW+gap),y:cardY,w:cardW,h:cardH});
}
function toScr(gx,gy){return[offX+gx*scale+shakeOffX,offY+gy*scale+shakeOffY];}
function toGame(sx,sy){return[(sx-offX-shakeOffX)/scale,(sy-offY-shakeOffY)/scale];}

class Tower {
  constructor(x,y,type,owner){
    this.x=x;this.y=y;this.type=type;this.owner=owner;
    const s=TOWER_STATS[type];
    this.maxHp=s.hp;this.hp=s.hp;this.dmg=s.dmg;this.range=s.range;this.atkSpd=s.atkSpd;this.atkCD=0;
    this.active=(type!=='king');this.destroyed=false;this.crownCounted=false;this.facing=owner===0?-1:1;
  }
  takeDamage(d){if(this.destroyed)return;this.hp=Math.max(0,this.hp-d);if(this.hp<=0){this.destroyed=true;this.hp=0;}}
}

let _uid=0;
class Unit {
  constructor(card,owner,x,y){
    this.id=_uid++;this.card=card;this.owner=owner;this.x=x;this.y=y;
    this.maxHp=card.hp;this.hp=card.hp;this.dmg=card.dmg;this.speed=card.speed;
    this.range=card.range;this.atkSpd=card.atkSpd;this.atkCD=0;this.abilityCD=card.abilityCD||0;
    this.target=null;this.alive=true;this.angle=owner===0?-Math.PI/2:Math.PI/2;
    this.nitroActive=false;this.nitroTimer=0;this.bobOffset=Math.random()*Math.PI*2;
    this.stealthTimer=card.ability==='STEALTH'?3:0;this.stunTimer=0;this.slowTimer=0;
  }
  takeDamage(d){
    if(!this.alive)return;this.hp=Math.max(0,this.hp-d);
    if(this.hp<=0){this.hp=0;this.alive=false;sfxDeath();addSparkParticles(this.x,this.y,this.card.carColor||'#FF4400');}
  }
  dist(ox,oy){return Math.hypot(this.x-ox,this.y-oy);}
}

// ============================================================
// PARTICLES
// ============================================================
let particles=[];
function addSparkParticles(gx,gy,color){
  for(let i=0;i<8;i++){
    const angle=Math.random()*Math.PI*2,spd=1.5+Math.random()*3;
    particles.push({x:gx,y:gy,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,color:color||'#FF8800',t:0,dur:0.5+Math.random()*0.4,type:'spark',sz:0.08+Math.random()*0.06});
  }
}
function addExplosionParticles(gx,gy,color,count){
  for(let i=0;i<(count||12);i++){
    const angle=Math.random()*Math.PI*2,spd=2+Math.random()*4;
    particles.push({x:gx,y:gy,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,color:color||'#FF4400',t:0,dur:0.6+Math.random()*0.5,type:'explosion',sz:0.12+Math.random()*0.1});
  }
  // Add smoke
  for(let i=0;i<6;i++){
    particles.push({x:gx+(Math.random()-0.5)*0.8,y:gy-(Math.random()*0.5),vx:(Math.random()-0.5)*0.5,vy:-0.6-Math.random()*0.6,color:'#555',t:0,dur:1.0+Math.random()*0.5,type:'smoke',sz:0.15});
  }
}
function addSmokeParticle(gx,gy){
  particles.push({x:gx+(Math.random()-0.5)*0.6,y:gy-(Math.random()*0.5),vx:(Math.random()-0.5)*0.3,vy:-0.4-Math.random()*0.4,color:'#888',t:0,dur:0.8,type:'smoke',sz:0.1});
}
function addNeonTrail(gx,gy,color){
  particles.push({x:gx,y:gy,vx:0,vy:0,color:color,t:0,dur:0.4,type:'neon',sz:0.2});
}
function updateParticles(dt){
  particles.forEach(p=>{p.t+=dt;p.x+=p.vx*dt*2;p.y+=p.vy*dt*2;if(p.type==='smoke'){p.sz+=dt*0.3;}});
  particles=particles.filter(p=>p.t<p.dur);
}
function renderParticles(){
  particles.forEach(p=>{
    const prog=p.t/p.dur;const[sx,sy]=toScr(p.x,p.y);
    if(p.type==='spark'||p.type==='explosion'){
      ctx.globalAlpha=(1-prog)*0.9;ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(sx,sy,Math.max(1,scale*p.sz*(1-prog*0.5)),0,Math.PI*2);ctx.fill();
      if(p.type==='explosion'){ctx.globalAlpha=(1-prog)*0.4;ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(sx,sy,scale*p.sz*0.5*(1-prog),0,Math.PI*2);ctx.fill();}
    } else if(p.type==='smoke'){
      ctx.globalAlpha=(1-prog)*0.3;ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(sx,sy,scale*(p.sz+prog*0.3),0,Math.PI*2);ctx.fill();
    } else if(p.type==='neon'){
      ctx.globalAlpha=(1-prog)*0.5;ctx.shadowColor=p.color;ctx.shadowBlur=10;
      ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(sx,sy,scale*p.sz*(1-prog),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    }
    ctx.globalAlpha=1;
  });
}

let screenFlash={active:false,color:'#fff',alpha:0,dur:0,t:0};
let doubleElixirAnnounced=false,overtimeAnnounced=false;
let overtimePulseT=0;
let hqDeadScreen={active:false,winner:-1,t:0};
function triggerFlash(color,alpha,dur){screenFlash={active:true,color,alpha,dur,t:0};}

// ============================================================
// GAME STATE
// ============================================================
let screen='menu',phase='countdown',phaseTimer=0,cdTimer=COUNTDOWN_TIME,totalTime=0;
let units=[],selectedCard=-1,battleResult='',deployPreview=null,selectedMode='1v1';
let animT=0,currentLevel=1,deckBuilderFilter='ALL',prevElixir=START_ELIXIR;
let lastPlayedCard=null; // for mirror
let effects=[];
function addEffect(type,x,y,text,color,dur){effects.push({type,x,y,text,color,dur:dur||1,t:0,alive:true});}

let player={elixir:START_ELIXIR,crowns:0,towers:[],hand:[],queue:[]};
let opponent={elixir:START_ELIXIR,crowns:0,towers:[],hand:[],queue:[],aiCD:0,aiNext:2};
let deckPickSelected=[...playerProfile.deck];
let menuBtns={},deckPickBtns={},shopBtns={},levelBtns={},deckBuilderBtns={};
let endPlayerHP=0,endOpponentHP=0;

// ============================================================
// INIT BATTLE
// ============================================================
function getLevelScale(lvl){return 1+Math.min((lvl-1)*0.04,2.0);}

function initBattle(){
  screen='battle';phase='countdown';cdTimer=COUNTDOWN_TIME;
  phaseTimer=0;totalTime=0;units=[];effects=[];particles=[];floatingEmojis=[];
  selectedCard=-1;battleResult='';deployPreview=null;_uid=0;
  doubleElixirAnnounced=false;overtimeAnnounced=false;
  hqDeadScreen={active:false,winner:-1,t:0};prevElixir=START_ELIXIR;
  emojiOpen=false;emojiCD=0;endPlayerHP=0;endOpponentHP=0;lastPlayedCard=null;

  const sc=getLevelScale(currentLevel);
  player.towers=[new Tower(4,25.5,'princess',0),new Tower(14,25.5,'princess',0),new Tower(9,28,'king',0)];
  player.elixir=START_ELIXIR;player.crowns=0;

  opponent.towers=[new Tower(4,4.5,'princess',1),new Tower(14,4.5,'princess',1),new Tower(9,2,'king',1)];
  opponent.towers.forEach(t=>{t.maxHp=Math.floor(t.maxHp*sc);t.hp=t.maxHp;t.dmg=Math.floor(t.dmg*sc);});
  opponent.elixir=START_ELIXIR;opponent.crowns=0;

  setupDeck(player,playerProfile.deck);
  // AI gets a deck based on level
  const aiDeck=getAIDeck(currentLevel);
  setupDeck(opponent,aiDeck);
  opponent.aiCD=0;opponent.aiNext=1.5+Math.random()*2;
}

function getAIDeck(lvl){
  // AI picks smarter decks at higher levels
  if(lvl<=10) return['hooptie','corner_boys','muscle_car','street_bike','emp','oil_slick','drive_by_shot','lowrider'];
  if(lvl<=20) return['muscle_car','lowrider','sports_car','street_bike','molotov','emp','drive_by_van','corner_boys'];
  if(lvl<=40) return['sports_car','impala','chopper_bike','street_bike','molotov','nos_bomb','emp','trap_car'];
  if(lvl<=60) return['pickup_truck','chopper_bike','lowrider','impala','molotov','nos_bomb','muscle_car','emp'];
  return DEFAULT_DECK;
}

function setupDeck(p,deckIds){
  const d=[...deckIds];for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}
  p.hand=d.slice(0,4);p.queue=d.slice(4);
}
function cycleCard(p,idx){const played=p.hand[idx];const next=p.queue.shift();p.queue.push(played);p.hand[idx]=next;}

// ============================================================
// CARD PLAY
// ============================================================
function playCard(p,idx,gx,gy){
  const cardId=p.hand[idx];const card=CARS[cardId];
  if(!card||p.elixir<card.cost)return false;
  p.elixir-=card.cost;

  if(card.type==='spell'||card.type==='building'){
    applySpell(card,p===player?0:1,gx,gy);
    if(p===player)sfxSpell();
  } else {
    const cnt=card.count||1;
    for(let i=0;i<cnt;i++){
      const ox=cnt>1?(i-(cnt-1)/2)*0.8:0;
      units.push(new Unit(card,p===player?0:1,gx+ox,gy));
    }
    addEffect('deploy',gx,gy,'',card.carColor||'#fff',0.5);
    if(p===player){sfxDeploy();sfxCardPlay();}
  }
  if(p===player)lastPlayedCard=cardId;
  cycleCard(p,idx);
  return true;
}

function applySpell(card,ownerId,gx,gy){
  const r=card.radius||2,d=card.dmg||0,enemyOwner=1-ownerId;

  if(card.id==='nos_bomb'){
    units.forEach(u=>{
      if(u.owner!==ownerId||!u.alive)return;
      if(Math.hypot(u.x-gx,u.y-gy)<=r){u.nitroActive=true;u.nitroTimer=3;u.speed=u.card.speed*1.6;addEffect('ability',u.x,u.y,'NOS!','#00CED1',0.8);}
    });
    addEffect('spell',gx,gy,'','#00CED1',0.7);addNeonTrail(gx,gy,'#00CED1');return;
  }
  if(card.id==='smoke_signal'){
    units.forEach(u=>{
      if(u.owner!==enemyOwner||!u.alive)return;
      if(Math.hypot(u.x-gx,u.y-gy)<=r){u.stunTimer=1.5;addEffect('ability',u.x,u.y,'STUN!','#666',0.8);}
    });
    addEffect('spell',gx,gy,'','#888',0.7);return;
  }
  if(card.id==='oil_slick'||card.id==='spike_strip'){
    units.forEach(u=>{
      if(u.owner!==enemyOwner||!u.alive)return;
      if(Math.hypot(u.x-gx,u.y-gy)<=r){u.takeDamage(d);u.slowTimer=3;addEffect('dmg',u.x,u.y-0.4,'-'+d,'#FF0000',0.7);}
    });
    addEffect('spell',gx,gy,'',card.carColor||'#555',0.6);return;
  }

  // Standard damage spell
  units.forEach(u=>{
    if(u.owner!==enemyOwner||!u.alive)return;
    if(Math.hypot(u.x-gx,u.y-gy)<=r){u.takeDamage(d);addEffect('dmg',u.x,u.y-0.4,'-'+d,'#FF0000',0.7);}
  });
  const eTowers=ownerId===0?opponent.towers:player.towers;
  eTowers.forEach(t=>{
    if(t.destroyed)return;
    if(Math.hypot(t.x-gx,t.y-gy)<=r+1.2){t.takeDamage(d);addEffect('dmg',t.x,t.y-0.4,'-'+d,'#FF0000',0.7);sfxTowerHit();checkTowerDeath(t,ownerId);}
  });
  addEffect('spell',gx,gy,'',card.carColor||'#fff',0.6);
  addExplosionParticles(gx,gy,card.carColor,8);
}

// ============================================================
// BATTLE UPDATE
// ============================================================
function checkHQDead(){
  const pKing=player.towers.find(t=>t.type==='king');
  const oKing=opponent.towers.find(t=>t.type==='king');
  if(pKing&&pKing.destroyed&&!pKing.crownCounted){
    pKing.crownCounted=true;sfxHQDead();
    addExplosionParticles(pKing.x,pKing.y,'#FF4444',20);
    hqDeadScreen={active:true,winner:1,t:0};endBattle();return true;
  }
  if(oKing&&oKing.destroyed&&!oKing.crownCounted){
    oKing.crownCounted=true;sfxHQDead();
    addExplosionParticles(oKing.x,oKing.y,'#4488FF',20);
    hqDeadScreen={active:true,winner:0,t:0};endBattle();return true;
  }
  return false;
}

function checkTowerDeath(t,attackerOwner){
  if(!t.destroyed||t.crownCounted)return;
  if(t.type==='king')return;
  t.crownCounted=true;
  const atk=attackerOwner===0?player:opponent;atk.crowns++;
  addExplosionParticles(t.x,t.y,attackerOwner===0?'#4488FF':'#FF4444',15);
  const def=attackerOwner===0?opponent:player;
  const king=def.towers.find(tt=>tt.type==='king');
  if(king&&!king.active)king.active=true;
  if(atk.crowns>=3)endBattle();
}

function updateBattle(dt){
  if(phase==='countdown'){cdTimer-=dt;if(cdTimer<=0){phase='regular';phaseTimer=REGULAR_TIME;}return;}
  if(phase==='ended')return;

  phaseTimer-=dt;totalTime+=dt;
  updateShake(dt);
  if(screenFlash.active){screenFlash.t+=dt;if(screenFlash.t>=screenFlash.dur)screenFlash.active=false;}
  if(hqDeadScreen.active)hqDeadScreen.t+=dt;

  // Emoji cooldown
  if(emojiCD>0)emojiCD-=dt;
  floatingEmojis.forEach(e=>{e.t+=dt;e.y-=dt*40;});
  floatingEmojis=floatingEmojis.filter(e=>e.t<2.5);

  // Phase transitions: Regular(3min) -> Overtime(1min 1.5x) -> Double(1min 3x)
  if(phase==='regular'&&phaseTimer<=10&&!overtimeAnnounced){
    overtimeAnnounced=true;
    addEffect('announce',ARENA_W/2,ARENA_H/2,'OVERTIME COMING!','#FF8800',2.0);
  }
  if(phaseTimer<=0){
    if(phase==='regular'){
      phase='overtime';phaseTimer=OVERTIME_TIME;
      triggerFlash('#FF8800',0.6,0.5);
      addEffect('announce',ARENA_W/2,ARENA_H/2,'OVERTIME! 1.5x ELIXIR','#FF8800',2.5);
      sfxPhaseChange();addShake(0.3);
    } else if(phase==='overtime'){
      phase='double';phaseTimer=DOUBLE_TIME;doubleElixirAnnounced=true;
      triggerFlash('#FF0000',0.7,0.5);
      addEffect('announce',ARENA_W/2,ARENA_H/2,'DOUBLE TIME! 3x ELIXIR','#FF0000',2.5);
      sfxPhaseChange();addShake(0.4);
    } else if(phase==='double'){
      endBattle();return;
    }
  }
  if(phase==='overtime'||phase==='double')overtimePulseT+=dt;

  // Elixir: regular=1x, overtime=1.5x, double=3x
  const rate=phase==='double'?ELIXIR_RATE_3X:phase==='overtime'?ELIXIR_RATE_15X:ELIXIR_RATE;
  const wasMax=player.elixir>=ELIXIR_MAX;
  player.elixir=Math.min(ELIXIR_MAX,player.elixir+rate*dt);
  opponent.elixir=Math.min(ELIXIR_MAX,opponent.elixir+rate*dt);
  if(!wasMax&&player.elixir>=ELIXIR_MAX)sfxElixirFull();

  // Critical tower smoke
  const pKing=player.towers.find(t=>t.type==='king');
  const oKing=opponent.towers.find(t=>t.type==='king');
  if(pKing&&!pKing.destroyed&&pKing.hp/pKing.maxHp<0.3&&Math.random()<0.15)addSmokeParticle(pKing.x,pKing.y-0.8);
  if(oKing&&!oKing.destroyed&&oKing.hp/oKing.maxHp<0.3&&Math.random()<0.15)addSmokeParticle(oKing.x,oKing.y-0.8);

  updateUnits(dt);updateTowerAttacks(dt);updateAI(dt);updateParticles(dt);
  checkHQDead();
  effects.forEach(e=>{e.t+=dt;if(e.t>=e.dur)e.alive=false;});
  effects=effects.filter(e=>e.alive);
  units=units.filter(u=>u.alive);
}

function updateUnits(dt){
  for(const u of units){
    if(!u.alive)continue;
    if(u.atkCD>0)u.atkCD-=dt;
    if(u.abilityCD>0)u.abilityCD-=dt;
    if(u.stealthTimer>0)u.stealthTimer-=dt;
    if(u.stunTimer>0){u.stunTimer-=dt;continue;} // stunned units can't act
    if(u.slowTimer>0){u.slowTimer-=dt;}
    if(u.nitroActive){u.nitroTimer-=dt;if(u.nitroTimer<=0){u.nitroActive=false;u.speed=u.card.speed;}}
    u.bobOffset+=dt*3;

    // Chop Shop spawner
    if(u.card.id==='chop_shop'&&u.card.type==='building'){
      if(u.abilityCD<=0){
        u.abilityCD=12;
        const hc=CARS['hooptie'];
        if(hc)units.push(new Unit(hc,u.owner,u.x+(Math.random()-0.5),u.y+(u.owner===0?-1:1)));
        addEffect('ability',u.x,u.y,'SPAWN!','#AA6633',0.8);
      }
      continue;
    }

    if(u.card.type==='building'){if(u.atkCD<=0){findTarget(u);if(u.target)unitAttack(u);}continue;}
    findTarget(u);
    if(u.target){
      const hitRange=u.range+(u.target instanceof Tower?1.0:0.3);
      const d=u.dist(u.target.x,u.target.y);
      if(d<=hitRange){if(u.atkCD<=0)unitAttack(u);}
      else moveToward(u,u.target.x,u.target.y,dt);
    } else {
      const ek=(u.owner===0?opponent:player).towers.find(t=>t.type==='king');
      if(ek)moveToward(u,ek.x,ek.y,dt);
    }
  }
}

function findTarget(u){
  u.target=null;let best=Infinity;const bldOnly=u.card.targets==='buildings';
  if(!bldOnly){
    for(const o of units){
      if(o.owner===u.owner||!o.alive)continue;if(o.stealthTimer>0)continue;
      const d=u.dist(o.x,o.y);if(d<best){best=d;u.target=o;}
    }
  }
  const eTowers=u.owner===0?opponent.towers:player.towers;
  const princAlive=eTowers.filter(t=>t.type==='princess'&&!t.destroyed).length;
  if(!u.target||bldOnly){
    for(const t of eTowers){
      if(t.destroyed)continue;if(t.type==='king'&&princAlive===2)continue;
      const d=u.dist(t.x,t.y);if(d<best){best=d;u.target=t;}
    }
  }
}

function moveToward(u,tx,ty,dt){
  const onPlayerSide=u.y>RIVER_Y+RIVER_H/2;
  const targetOtherSide=u.owner===0?(ty<RIVER_Y):(ty>RIVER_Y);
  const needBridge=(u.owner===0&&onPlayerSide&&targetOtherSide)||(u.owner===1&&!onPlayerSide&&targetOtherSide);
  let mx=tx,my=ty;
  if(needBridge){
    const nearL=Math.abs(u.x-BRIDGE_LX),nearR=Math.abs(u.x-BRIDGE_RX);
    const atBridge=(nearL<BRIDGE_W/2+0.5)||(nearR<BRIDGE_W/2+0.5);
    if(!atBridge){mx=nearL<nearR?BRIDGE_LX:BRIDGE_RX;my=RIVER_Y+(u.owner===0?-0.3:0.3);}
  }
  const dx=mx-u.x,dy=my-u.y,d=Math.hypot(dx,dy);
  if(d>0.05){
    let spd=u.speed*dt*2.5;
    if(u.slowTimer>0)spd*=0.5;
    const m=Math.min(spd,d);u.x+=(dx/d)*m;u.y+=(dy/d)*m;u.angle=Math.atan2(dy,dx);
  }
}

function unitAttack(u){
  if(!u.target)return;
  let d=u.dmg;
  if(u.card.id==='muscle_car'&&u.abilityCD<=0){d*=2;u.abilityCD=8;addEffect('ability',u.x,u.y,'RAM!','#FF4500',0.9);}
  if(u.card.isArea){
    const ar=u.card.areaRadius||1.5;
    for(const o of units){if(o.owner===u.owner||!o.alive)continue;if(Math.hypot(o.x-u.target.x,o.y-u.target.y)<=ar)o.takeDamage(d);}
    addEffect('dmg',u.target.x,u.target.y-0.3,'-'+d,'#FF4444',0.5);
    addSparkParticles(u.target.x,u.target.y,u.card.carColor);
  } else {
    u.target.takeDamage(d);addEffect('dmg',u.target.x,u.target.y-0.3,'-'+d,'#FF4444',0.5);
  }
  if(u.target instanceof Tower){sfxTowerHit();checkTowerDeath(u.target,u.owner);}
  u.atkCD=1/u.atkSpd;
  if(u.card.id==='sports_car'&&!u.nitroActive&&u.abilityCD<=0){
    u.nitroActive=true;u.nitroTimer=2.5;u.speed=u.card.speed*1.5;u.abilityCD=12;
    addEffect('ability',u.x,u.y,'NITRO!','#00BFFF',0.9);
  }
  // Jammer slow
  if(u.card.id==='jammer_van'){
    units.forEach(o=>{if(o.owner!==u.owner&&o.alive&&u.dist(o.x,o.y)<=4.5)o.slowTimer=Math.max(o.slowTimer,2);});
  }
}

function updateTowerAttacks(dt){
  for(const t of [...player.towers,...opponent.towers]){
    if(t.destroyed||!t.active)continue;
    t.atkCD-=dt;if(t.atkCD>0)continue;
    let tgt=null,bd=t.range;
    for(const u of units){
      if(u.owner===t.owner||!u.alive)continue;if(u.stealthTimer>0)continue;
      const d=Math.hypot(u.x-t.x,u.y-t.y);if(d<bd){bd=d;tgt=u;}
    }
    if(tgt){
      tgt.takeDamage(t.dmg);
      addEffect('tshot',t.x,t.y,'',t.owner===0?'#4488FF':'#FF4444',0.3);
      addEffect('dmg',tgt.x,tgt.y-0.3,'-'+t.dmg,'#FFAA00',0.4);
      t.atkCD=1/t.atkSpd;
    }
  }
}

// ============================================================
// AI -- Smarter + beatable at low levels
// ============================================================
function updateAI(dt){
  opponent.aiCD+=dt;
  // AI is slower and dumber at low levels, faster at high
  const aiDelay=Math.max(0.6,3.5-currentLevel*0.04);
  if(opponent.aiCD<aiDelay)return;
  opponent.aiCD=0;

  const playable=[];
  opponent.hand.forEach((cid,i)=>{const c=CARS[cid];if(c&&opponent.elixir>=c.cost)playable.push({i,cid,c});});
  if(!playable.length)return;

  // Low level AI: only plays when elixir is high, makes mistakes
  if(currentLevel<=10&&opponent.elixir<7)return;
  if(currentLevel<=20&&opponent.elixir<5)return;

  const threats=units.filter(u=>u.owner===0&&u.y<RIVER_Y);
  let choice,gx,gy;

  if(threats.length>0){
    const spell=playable.find(p=>p.c.type==='spell');
    const troop=playable.find(p=>p.c.type==='troop');
    if(threats.length>=3&&spell){
      choice=spell;const avg=threats.reduce((a,u)=>({x:a.x+u.x,y:a.y+u.y}),{x:0,y:0});gx=avg.x/threats.length;gy=avg.y/threats.length;
    } else {
      choice=troop||playable[0];const t=threats[0];gx=clamp(t.x+(Math.random()-0.5)*2,1,17);gy=clamp(t.y+1.5,2,12);
    }
  } else {
    const troop=playable.find(p=>p.c.type==='troop');if(!troop)return;choice=troop;
    const lane=Math.random()<0.5?'L':'R';
    gx=lane==='L'?3+Math.random()*3:12+Math.random()*3;gy=4+Math.random()*5;
  }
  if(choice)playCard(opponent,choice.i,gx,gy);
}

function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}

function calcTotalHP(p,isPlayer){
  let hp=0;p.towers.forEach(t=>{if(!t.destroyed)hp+=t.hp;});
  units.forEach(u=>{if(u.alive&&u.owner===(isPlayer?0:1))hp+=u.hp;});
  return hp;
}

function endBattle(){
  phase='ended';emojiOpen=false;
  endPlayerHP=calcTotalHP(player,true);endOpponentHP=calcTotalHP(opponent,false);
  if(player.crowns===opponent.crowns){
    if(endPlayerHP>endOpponentHP)battleResult='win';
    else if(endOpponentHP>endPlayerHP)battleResult='lose';
    else battleResult='draw';
  } else if(player.crowns>opponent.crowns){battleResult='win';}
  else {battleResult='lose';}

  if(battleResult==='win'){
    playerProfile.nosBottles+=25+player.crowns*5;
    if(!playerProfile.completedLevels.includes(currentLevel))playerProfile.completedLevels.push(currentLevel);
    sfxVictory();
  } else if(battleResult==='lose'){
    playerProfile.nosBottles=Math.max(0,playerProfile.nosBottles-15);sfxDefeat();
  } else {playerProfile.nosBottles+=5;}
  screen='postgame';
}

// ============================================================
// CITY-THEMED ARENA RENDER
// ============================================================
function renderArena(){
  const arena=getArena(currentLevel);
  const[ax0,ay0]=toScr(0,0),[ax1,ay1]=toScr(ARENA_W,ARENA_H);
  const aw=ax1-ax0,ah=ay1-ay0;

  // Sky gradient
  const skyG=ctx.createLinearGradient(0,0,0,hudY);
  skyG.addColorStop(0,arena.sky1);skyG.addColorStop(1,arena.sky2);
  ctx.fillStyle=skyG;ctx.fillRect(0,0,W,hudY);

  // Arena ground
  ctx.fillStyle=arena.road;ctx.fillRect(ax0,ay0,aw,ah);
  // Sidewalks
  const swW=BRIDGE_LX*scale-scale*1.2;
  ctx.fillStyle=arena.walk;ctx.fillRect(ax0,ay0,swW,ah);ctx.fillRect(ax1-swW,ay0,swW,ah);

  // Sidewalk borders with neon glow
  ctx.strokeStyle=arena.n1+'66';ctx.lineWidth=2;
  ctx.shadowColor=arena.n1;ctx.shadowBlur=6;
  ctx.beginPath();ctx.moveTo(ax0+swW,ay0);ctx.lineTo(ax0+swW,ay1);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ax1-swW,ay0);ctx.lineTo(ax1-swW,ay1);ctx.stroke();
  ctx.shadowBlur=0;

  // Center lane dashes
  const[cx]=toScr(ARENA_W/2,0);
  ctx.strokeStyle='rgba(255,200,0,0.45)';ctx.lineWidth=Math.max(2,scale*0.08);
  ctx.setLineDash([scale*0.9,scale*0.6]);
  ctx.beginPath();ctx.moveTo(cx,ay0);ctx.lineTo(cx,ay1);ctx.stroke();ctx.setLineDash([]);

  // Grid lines
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;
  for(let r=2;r<ARENA_H;r+=3){const[,ly]=toScr(0,r);ctx.beginPath();ctx.moveTo(ax0+swW,ly);ctx.lineTo(ax1-swW,ly);ctx.stroke();}

  // River / crosswalk
  const[,rv0]=toScr(0,RIVER_Y-RIVER_H/2),[,rv1]=toScr(0,RIVER_Y+RIVER_H/2);
  ctx.fillStyle=arena.road==='#141820'?'#0a1020':'#252526';ctx.fillRect(ax0,rv0,aw,rv1-rv0);
  // Crosswalk stripes
  const stW=scale*0.26,stGap=scale*0.26;ctx.fillStyle='rgba(255,255,255,0.18)';
  let sx=ax0+swW+scale*0.5;
  while(sx<ax1-swW-scale*0.5){ctx.fillRect(sx,rv0,stW,rv1-rv0);sx+=stW+stGap;}

  // Traffic lights
  const tlSz=scale*0.9;
  [[ax0+swW-tlSz*0.55,rv0-tlSz],[ax1-swW-tlSz*0.45,rv0-tlSz],[ax0+swW-tlSz*0.55,rv1],[ax1-swW-tlSz*0.45,rv1]].forEach(([tx,ty])=>drawTrafficLight(tx,ty,scale,arena));

  // Lane labels with neon
  ctx.fillStyle=arena.n1+'77';ctx.font=Math.floor(scale*0.32)+'px Arial';ctx.textAlign='center';
  const[blx]=toScr(BRIDGE_LX,0),[brx]=toScr(BRIDGE_RX,0);
  ctx.fillText('LEFT LANE',blx,rv0-3);ctx.fillText('RIGHT LANE',brx,rv0-3);

  // City graffiti watermark
  ctx.save();ctx.globalAlpha=0.04;ctx.fillStyle=arena.acc;
  ctx.font='bold '+(scale*3)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(arena.tag,W/2,ay0+ah*0.2);
  ctx.fillText(arena.name,W/2,ay0+ah*0.75);ctx.restore();

  // Neon border glow
  ctx.strokeStyle=arena.n1+'55';ctx.lineWidth=3;
  ctx.shadowColor=arena.n1;ctx.shadowBlur=8;ctx.strokeRect(ax0,ay0,aw,ah);ctx.shadowBlur=0;

  // City-specific decorations
  if(arena.style==='cyber'||arena.style==='neon'){
    // Scanline effect
    ctx.globalAlpha=0.03;ctx.fillStyle='#00FFFF';
    for(let y=ay0;y<ay1;y+=4){ctx.fillRect(ax0,y,aw,1);}ctx.globalAlpha=1;
  }
  if(arena.style==='casino'){
    // Gold sparkle particles
    if(Math.random()<0.05){
      const rx=ax0+Math.random()*aw,ry=ay0+Math.random()*ah;
      ctx.fillStyle='#FFD70066';ctx.beginPath();ctx.arc(rx,ry,2,0,Math.PI*2);ctx.fill();
    }
  }
}

function drawTrafficLight(x,y,sc,arena){
  const w=sc*0.18,h=sc*0.55;
  ctx.fillStyle='#1a1a1a';ctx.fillRect(x,y,w,h);
  const phase2=Math.floor(animT)%3;
  ctx.fillStyle=phase2===0?(arena?arena.n1:'#FF2200'):'#222';ctx.beginPath();ctx.arc(x+w/2,y+h*0.2,w*0.32,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=phase2===1?'#FFAA00':'#222';ctx.beginPath();ctx.arc(x+w/2,y+h*0.5,w*0.32,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=phase2===2?'#22DD22':'#222';ctx.beginPath();ctx.arc(x+w/2,y+h*0.8,w*0.32,0,Math.PI*2);ctx.fill();
}

function renderTowers(){
  for(const t of [...opponent.towers,...player.towers]){
    const[sx,sy]=toScr(t.x,t.y);const stats=TOWER_STATS[t.type];
    const cW=stats.w*scale,cH=stats.h*scale;
    if(t.destroyed){
      ctx.globalAlpha=0.5;ctx.fillStyle='#111';ctx.fillRect(sx-cW/2,sy-cH/2,cW,cH);
      const fp=(animT*3)%1;ctx.globalAlpha=0.7;
      ctx.fillStyle='rgba(255,'+(Math.floor(80+fp*120))+',0,0.8)';
      ctx.beginPath();ctx.arc(sx,sy-cH*0.3,cW*(0.3+fp*0.08),0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;continue;
    }
    const isCrit=t.hp/t.maxHp<0.3;
    const bodyCol=t.owner===0?(isCrit?'#441111':'#2255BB'):(isCrit?'#441111':'#BB2222');
    const roofCol=t.owner===0?(isCrit?'#882222':'#3377EE'):(isCrit?'#882222':'#EE4444');
    if(t.type==='king'&&t.active){ctx.shadowColor=t.owner===0?'#4488FF':'#FF4444';ctx.shadowBlur=14;}
    if(isCrit){ctx.shadowColor='#FF0000';ctx.shadowBlur=12;}
    if(t.type==='king'){
      ctx.fillStyle=bodyCol;rr(sx-cW/2,sy-cH/2,cW,cH,cH*0.18);ctx.fill();
      ctx.fillStyle=roofCol;rr(sx-cW*0.38,sy-cH*0.38,cW*0.76,cH*0.76,cH*0.12);ctx.fill();
      ctx.fillStyle='rgba(120,210,255,0.5)';ctx.fillRect(sx-cW*0.3,sy-cH/2+cH*0.05,cW*0.6,cH*0.22);
      ctx.fillStyle=t.owner===0?'rgba(68,136,255,0.4)':'rgba(255,68,68,0.4)';
      ctx.fillRect(sx-cW*0.48,sy-cH*0.05,cW*0.96,cH*0.1);
      ctx.fillStyle='#FFD700';ctx.font='bold '+(cH*0.28)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('HQ',sx,sy+cH*0.1);
    } else {
      ctx.fillStyle=bodyCol;rr(sx-cW/2,sy-cH/2,cW,cH,cH*0.22);ctx.fill();
      ctx.fillStyle=roofCol;rr(sx-cW*0.35,sy-cH*0.35,cW*0.7,cH*0.7,cH*0.15);ctx.fill();
      ctx.fillStyle='rgba(120,210,255,0.5)';
      const wsY2=t.facing===1?sy-cH/2:sy+cH*0.1;ctx.fillRect(sx-cW*0.28,wsY2,cW*0.56,cH*0.28);
    }
    // Wheels
    ctx.fillStyle='#111';const wW=cW*0.2,wH=cH*0.28;
    ctx.fillRect(sx-cW/2-wW*0.25,sy-cH/2,wW,wH);ctx.fillRect(sx+cW/2-wW*0.75,sy-cH/2,wW,wH);
    ctx.fillRect(sx-cW/2-wW*0.25,sy+cH/2-wH,wW,wH);ctx.fillRect(sx+cW/2-wW*0.75,sy+cH/2-wH,wW,wH);
    ctx.shadowBlur=0;
    // HP bar
    const bw=cW*1.35,bh=5,bx2=sx-bw/2,by2=sy-cH/2-10;
    ctx.fillStyle='#1a1a1a';ctx.fillRect(bx2,by2,bw,bh);
    const pct=t.hp/t.maxHp;ctx.fillStyle=pct>0.5?'#44EE44':pct>0.25?'#FFAA00':'#FF3333';
    ctx.fillRect(bx2,by2,bw*pct,bh);ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.strokeRect(bx2,by2,bw,bh);
    ctx.fillStyle='#fff';ctx.font=Math.floor(bh*2)+'px Arial';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText(Math.ceil(t.hp),sx,by2);
    if(t.type==='king'){ctx.fillStyle='#FFD700';ctx.font='bold '+(bh*1.6)+'px Arial';ctx.textBaseline='top';ctx.fillText('HQ VAN',sx,by2+bh+1);}
  }
}

// ============================================================
// UNITS
// ============================================================
function renderUnits(){
  const sorted=[...units].filter(u=>u.alive).sort((a,b)=>a.y-b.y);
  for(const u of sorted){
    if(u.stealthTimer>0&&u.owner===1)continue;
    const[sx,sy]=toScr(u.x,u.y);const card=u.card;
    const bW=(card.bodyW||0.9)*scale,bH=(card.bodyH||0.55)*scale;
    const bob=Math.sin(u.bobOffset)*scale*0.06;
    ctx.save();ctx.translate(sx,sy+bob);ctx.rotate(u.angle+Math.PI/2);
    ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(-bW/2+2,-bH/2+2,bW,bH);
    ctx.fillStyle=card.carColor||'#888';rr(-bW/2,-bH/2,bW,bH,bH*0.28);ctx.fill();
    ctx.strokeStyle=u.owner===0?'#4488FF':'#FF4444';ctx.lineWidth=u.nitroActive?2.5:1.5;
    if(u.nitroActive){ctx.shadowColor='#00BFFF';ctx.shadowBlur=8;}
    if(u.stunTimer>0){ctx.strokeStyle='#FFFF00';ctx.lineWidth=3;}
    if(u.slowTimer>0){ctx.strokeStyle='#666';ctx.lineWidth=2;}
    rr(-bW/2,-bH/2,bW,bH,bH*0.28);ctx.stroke();ctx.shadowBlur=0;
    ctx.fillStyle='rgba(150,220,255,0.45)';ctx.fillRect(-bW*0.28,-bH/2,bW*0.56,bH*0.28);
    ctx.fillStyle='#111';const ww=bW*0.22,wh=bH*0.28;
    ctx.fillRect(-bW/2-ww*0.2,-bH/2,ww,wh);ctx.fillRect(bW/2-ww*0.8,-bH/2,ww,wh);
    ctx.fillRect(-bW/2-ww*0.2,bH/2-wh,ww,wh);ctx.fillRect(bW/2-ww*0.8,bH/2-wh,ww,wh);
    ctx.restore();
    // HP bar
    const barW=bW,barH=3,barX=sx-barW/2,barY=sy+bob-bH/2-7;
    ctx.fillStyle='#1a1a1a';ctx.fillRect(barX,barY,barW,barH);
    const hpPct=u.hp/u.maxHp;ctx.fillStyle=u.owner===0?'#4488FF':'#FF4444';
    ctx.fillRect(barX,barY,barW*hpPct,barH);
    // Stun indicator
    if(u.stunTimer>0){ctx.fillStyle='#FFFF00';ctx.font=(scale*0.3)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('💫',sx,sy-bH);}
  }
}

// ============================================================
// EFFECTS
// ============================================================
function renderEffects(){
  for(const e of effects){
    const[sx,sy]=toScr(e.x,e.y);const p=e.t/e.dur;
    if(e.type==='dmg'||e.type==='ability'){
      ctx.globalAlpha=1-p;ctx.fillStyle=e.color;
      if(e.type==='ability'){ctx.shadowColor=e.color;ctx.shadowBlur=8;}
      ctx.font='bold '+(scale*(e.type==='ability'?0.65:0.52))+'px Arial';
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e.text,sx,sy-p*scale*1.8);
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    } else if(e.type==='announce'){
      const sc2=1+Math.sin(p*Math.PI)*0.15;
      ctx.save();ctx.translate(W/2,H*0.45);ctx.scale(sc2,sc2);
      ctx.globalAlpha=(p<0.5?p*2:2-p*2)*0.95;
      ctx.shadowColor=e.color;ctx.shadowBlur=20;ctx.fillStyle=e.color;
      ctx.font='bold '+(W*0.06)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(e.text,0,0);ctx.restore();ctx.globalAlpha=1;
    } else if(e.type==='spell'){
      ctx.globalAlpha=0.38*(1-p);ctx.fillStyle=e.color;
      ctx.beginPath();ctx.arc(sx,sy,scale*2.5*(0.3+p*0.7),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    } else if(e.type==='deploy'){
      ctx.globalAlpha=0.7*(1-p);ctx.fillStyle=e.color;
      ctx.beginPath();ctx.arc(sx,sy,scale*(0.3+p*1.8),0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=0.5*(1-p);ctx.strokeStyle='#fff';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(sx,sy,scale*(0.5+p*2),0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
    } else if(e.type==='tshot'){
      ctx.globalAlpha=0.55*(1-p);ctx.fillStyle=e.color;
      ctx.beginPath();ctx.arc(sx,sy,scale*0.28*(1-p),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    }
  }
}

function renderTopBar(){

  const tStr=Math.floor(rem/60)+':'+String(Math.floor(rem%60)).padStart(2,'0');
  ctx.fillStyle=phase==='double'?'#FF0000':phase==='overtime'?'#FF8800':'#fff';
  ctx.font='bold '+(h*0.55)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(tStr,W/2,h*0.42);
  if(phase==='double'){ctx.fillStyle='#FF0000';ctx.font='bold '+(h*0.27)+'px Arial';ctx.fillText('3x DOUBLE TIME!',W/2,h*0.82);}
  else if(phase==='overtime'){ctx.fillStyle='#FF8800';ctx.font='bold '+(h*0.27)+'px Arial';ctx.fillText('OVERTIME 1.5x',W/2,h*0.82);}
  // City + Level
  ctx.fillStyle=arena.acc;ctx.font=(h*0.25)+'px Arial';ctx.textAlign='left';

  ctx.textAlign='right';ctx.fillStyle='#FF4444';
  ctx.fillText('\u2605'.repeat(opponent.crowns)+'\u2606'.repeat(3-opponent.crowns),W-8,h*0.72);
}

function renderHUD(){
  const arena=getArena(currentLevel);
  const hg=ctx.createLinearGradient(0,hudY,0,H);hg.addColorStop(0,'#080814');hg.addColorStop(1,'#040408');
  ctx.fillStyle=hg;ctx.fillRect(0,hudY,W,hudH);
  ctx.strokeStyle=arena.n1+'77';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,hudY);ctx.lineTo(W,hudY);ctx.stroke();
  const pad=10,ebW=W-pad*2,ebH=Math.floor(hudH*0.13),ebY=hudY+6;
  ctx.fillStyle='#180a22';rr(pad,ebY,ebW,ebH,3);ctx.fill();
  const ePct=player.elixir/ELIXIR_MAX;
  const eg=ctx.createLinearGradient(pad,0,pad+ebW,0);
  eg.addColorStop(0,'#5500AA');eg.addColorStop(ePct,'#CC44FF');eg.addColorStop(1,'#1a0033');
  ctx.fillStyle=eg;rr(pad,ebY,ebW*ePct,ebH,3);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;
  for(let i=1;i<ELIXIR_MAX;i++){const x=pad+ebW*i/ELIXIR_MAX;ctx.beginPath();ctx.moveTo(x,ebY);ctx.lineTo(x,ebY+ebH);ctx.stroke();}
  ctx.fillStyle='#fff';ctx.font='bold '+(ebH*0.9)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('ELIXIR '+Math.floor(player.elixir),W/2,ebY+ebH/2+1);
  // Phase indicator
  const phaseLabel=phase==='regular'?'':phase==='overtime'?'1.5x':'3x';
  if(phaseLabel){ctx.fillStyle=phase==='double'?'#FF0000':'#FF8800';ctx.font='bold '+(ebH*0.7)+'px Arial';ctx.textAlign='right';ctx.fillText(phaseLabel,W-pad-4,ebY+ebH/2+1);}
}

function renderCards(){
  for(let i=0;i<4;i++){
    const s=cardSlots[i];if(!s)continue;
    const cid=player.hand[i],c=CARS[cid];if(!c)continue;
    const afford=player.elixir>=c.cost,sel=selectedCard===i,hover=cardHoverIdx===i;
    const scl=sel||hover?1.08:1;
    const dx=s.x+(1-scl)*s.w/2,dy=s.y+(1-scl)*s.h/2,dw=s.w*scl,dh=s.h*scl;
    if(sel){ctx.shadowColor='#FFD700';ctx.shadowBlur=14;ctx.fillStyle='#FFD700';rr(dx-3,dy-3,dw+6,dh+6,10);ctx.fill();ctx.shadowBlur=0;}
    ctx.globalAlpha=afford?1:0.38;
    let borderCol='rgba(255,255,255,0.18)';
    if(c.type==='troop')borderCol='#C0C0C0';if(c.type==='spell')borderCol='#FFD700';if(c.type==='building')borderCol='#00FFD4';
    const cc=c.carColor||'#333';
    const cg=ctx.createLinearGradient(dx,dy,dx,dy+dh);cg.addColorStop(0,cc+'dd');cg.addColorStop(1,'#111111');
    ctx.fillStyle=cg;rr(dx,dy,dw,dh,8);ctx.fill();
    ctx.strokeStyle=sel?'#FFD700':borderCol;ctx.lineWidth=sel?2.5:2;rr(dx,dy,dw,dh,8);ctx.stroke();
    // Type badge
    if(c.type){
      const badgeW=dw*0.45,badgeH=dh*0.17;ctx.fillStyle=borderCol;rr(dx,dy,badgeW,badgeH,4);ctx.fill();
      ctx.fillStyle='#000';ctx.font='bold '+(badgeH*0.62)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(c.type==='troop'?'CREW':c.type==='spell'?'SPELL':'STRUCT',dx+badgeW/2,dy+badgeH/2);
    }
    ctx.font=(dh*0.27)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';
    ctx.fillText(c.icon||'?',dx+dw/2,dy+dh*0.35);
    ctx.font='bold '+(dh*0.107)+'px Arial';ctx.fillStyle='#fff';ctx.fillText(c.name,dx+dw/2,dy+dh*0.6);
    // Stat bars
    const stY3=dy+dh*0.7,stH=dh*0.06,stW=dw*0.8,stX=dx+dw*0.1;
    if(c.hp){ctx.fillStyle='#222';ctx.fillRect(stX,stY3,stW,stH);ctx.fillStyle='#22BB22';ctx.fillRect(stX,stY3,stW*Math.min(c.hp/4000,1),stH);}
    if(c.dmg&&c.hp){ctx.fillStyle='#222';ctx.fillRect(stX,stY3+stH+1,stW,stH);ctx.fillStyle='#BB2222';ctx.fillRect(stX,stY3+stH+1,stW*Math.min(c.dmg/400,1),stH);}
    // Elixir diamond
    const dSz=dw*0.22,diamX=dx+dSz*0.6,diamY=dy+dh-dSz*0.6;
    ctx.fillStyle='#5511AA';ctx.save();ctx.translate(diamX,diamY);ctx.rotate(Math.PI/4);ctx.fillRect(-dSz/2,-dSz/2,dSz,dSz);ctx.restore();
    ctx.strokeStyle='#9933CC';ctx.lineWidth=1.5;ctx.save();ctx.translate(diamX,diamY);ctx.rotate(Math.PI/4);ctx.strokeRect(-dSz/2,-dSz/2,dSz,dSz);ctx.restore();
    ctx.fillStyle='#fff';ctx.font='bold '+(dSz*0.7)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c.cost,diamX,diamY);
    ctx.globalAlpha=1;
  }
  // Next card
  if(player.queue.length>0&&cardSlots[3]){
    const nc=CARS[player.queue[0]];if(!nc)return;
    const ls=cardSlots[3],nx=ls.x+ls.w+6,nw=Math.floor(W*0.09),nh=Math.floor(ls.h*0.55),ny=ls.y+(ls.h-nh)/2;
    ctx.fillStyle=nc.carColor||'#333';ctx.globalAlpha=0.5;rr(nx,ny,nw,nh,5);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle='#999';ctx.font=(nw*0.27)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('Next',nx+nw/2,ny-6);ctx.font=(nh*0.33)+'px Arial';ctx.fillStyle='#fff';ctx.fillText(nc.icon||'?',nx+nw/2,ny+nh/2);
  }
}

function renderDeployZone(){
  if(selectedCard<0||phase==='countdown'||phase==='ended')return;
  const card=CARS[player.hand[selectedCard]];if(!card)return;
  const isSpell=card.type==='spell'||card.type==='building';
  const[ax0,ay0]=toScr(0,0),[ax1,ay1]=toScr(ARENA_W,ARENA_H);
  ctx.globalAlpha=0.11;
  if(isSpell){ctx.fillStyle=card.carColor||'#fff';ctx.fillRect(ax0,ay0,ax1-ax0,ay1-ay0);}
  else{const[,dy0]=toScr(0,RIVER_Y+RIVER_H/2+0.5);ctx.fillStyle='#44FF44';ctx.fillRect(ax0,dy0,ax1-ax0,ay1-dy0);}
  ctx.globalAlpha=1;
  if(deployPreview){
    const[px,py]=toScr(deployPreview.x,deployPreview.y);
    ctx.strokeStyle=card.carColor||'#fff';ctx.lineWidth=2;ctx.setLineDash([4,4]);
    ctx.beginPath();isSpell?ctx.arc(px,py,(card.radius||2)*scale,0,Math.PI*2):ctx.arc(px,py,scale*0.8,0,Math.PI*2);
    ctx.stroke();ctx.setLineDash([]);
  }
}

function renderCountdown(){
  ctx.fillStyle='rgba(0,0,0,0.68)';ctx.fillRect(0,0,W,H);

}

function renderDeckBuilder(){
  darkBg();
  labelTxt('DECK BUILDER',W/2,H*0.035,'#FFD700','bold '+(W*0.055)+'px Arial');

  // Preset buttons
  const presetKeys=Object.keys(DECK_PRESETS);
  const pbH=H*0.04,pbW=W*0.18,pbGap=4;
  const pbTotalW=presetKeys.length*(pbW+pbGap);
  const pbStartX=Math.max(4,(W-pbTotalW)/2),pbY=H*0.07;
  menuBtns.presets={};
  presetKeys.forEach((k,i)=>{
    const px=pbStartX+i*(pbW+pbGap);
    menuBtns.presets[k]={x:px,y:pbY,w:pbW,h:pbH};
    ctx.fillStyle='#1a1a2e';rr(px,pbY,pbW,pbH,4);ctx.fill();
    ctx.strokeStyle='#FF4500';ctx.lineWidth=1;rr(px,pbY,pbW,pbH,4);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font=(pbH*0.42)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(DECK_PRESETS[k].name.slice(0,12),px+pbW/2,pbY+pbH/2);
  });

  // Filter tabs
  const tabs=['ALL','CREW','SPELL','STRUCT'];
  const tabW=W*0.2,tabH=H*0.045,tabGap2=W*0.01;
  const tabX=W/2-(tabs.length*(tabW+tabGap2))/2,tabY2=pbY+pbH+H*0.01;
  deckBuilderBtns={tabs:{}};
  tabs.forEach((tab,i)=>{
    const tx=tabX+i*(tabW+tabGap2);deckBuilderBtns.tabs[tab]={x:tx,y:tabY2,w:tabW,h:tabH};
    const active=deckBuilderFilter===tab;
    ctx.fillStyle=active?'#FF4500':'#1a1a2a';rr(tx,tabY2,tabW,tabH,5);ctx.fill();
    ctx.strokeStyle=active?'#FFD700':'#444';ctx.lineWidth=active?2:1;rr(tx,tabY2,tabW,tabH,5);ctx.stroke();
    ctx.fillStyle=active?'#fff':'#888';ctx.font='bold '+(tabH*0.45)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(tab,tx+tabW/2,tabY2+tabH/2);
  });

  // Card grid
  const filterFn=(car)=>{
    if(deckBuilderFilter==='ALL')return true;if(deckBuilderFilter==='CREW')return car.type==='troop';
    if(deckBuilderFilter==='SPELL')return car.type==='spell';if(deckBuilderFilter==='STRUCT')return car.type==='building';return true;
  };
  const displayIds=playerProfile.collection.filter(id=>{const c=CARS[id];return c&&filterFn(c);});
  const cardCols=4,cW=Math.floor(W*0.22),cH=Math.floor(H*0.14);
  const gX=Math.floor(W*0.015),gY=Math.floor(H*0.01);
  const totW=cardCols*cW+(cardCols-1)*gX;
  const sX=Math.floor((W-totW)/2),sY=tabY2+tabH+H*0.012;

  deckBuilderBtns.cards={};
  displayIds.forEach((cid,idx)=>{
    const car=CARS[cid];if(!car)return;
    const col=idx%cardCols,row=Math.floor(idx/cardCols);
    const cx2=sX+col*(cW+gX),cy2=sY+row*(cH+gY);
    if(cy2+cH>H*0.78)return;
    deckBuilderBtns.cards[cid]={x:cx2,y:cy2,w:cW,h:cH};
    const inDeck=deckPickSelected.includes(cid);
    let borderCol2='#888';if(car.type==='troop')borderCol2='#C0C0C0';if(car.type==='spell')borderCol2='#FFD700';if(car.type==='building')borderCol2='#00FFD4';
    ctx.fillStyle='#0e0e1e';rr(cx2,cy2,cW,cH,7);ctx.fill();
    ctx.strokeStyle=inDeck?'#00FF88':borderCol2;ctx.lineWidth=inDeck?2.5:1;rr(cx2,cy2,cW,cH,7);ctx.stroke();
    ctx.font=(cH*0.22)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';
    ctx.fillText(car.icon||'?',cx2+cW/2,cy2+cH*0.32);
    ctx.font='bold '+(cH*0.1)+'px Arial';ctx.fillStyle='#fff';ctx.fillText(car.name,cx2+cW/2,cy2+cH*0.58);
    // Cost
    ctx.fillStyle='#5511AA';ctx.font='bold '+(cH*0.14)+'px Arial';ctx.fillText(car.cost,cx2+cW-cH*0.15,cy2+cH*0.15);
    if(inDeck){ctx.fillStyle='rgba(0,255,136,0.2)';rr(cx2,cy2,cW,cH,7);ctx.fill();ctx.fillStyle='#00FF88';ctx.font=(cH*0.18)+'px Arial';ctx.fillText('\u2713',cx2+cH*0.12,cy2+cH*0.15);}
  });

  // Synergy display
  const synergies=getDeckSynergies(deckPickSelected);
  const synY=H*0.79,synH=H*0.04;
  if(synergies.length>0){
    ctx.fillStyle='rgba(10,10,20,0.9)';rr(W*0.04,synY,W*0.92,synH,6);ctx.fill();
    synergies.forEach((s,i)=>{
      const sx2=W*0.06+i*(W*0.3);
      ctx.fillStyle=s.c;ctx.font='bold '+(synH*0.55)+'px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
      ctx.fillText(s.n+' x'+s.count,sx2,synY+synH/2);
    });
  }

  // Deck stats
  const statY=H*0.84,statH2=H*0.05;
  ctx.fillStyle='rgba(10,10,20,0.9)';rr(W*0.04,statY,W*0.92,statH2,8);ctx.fill();
  const avgCost=deckPickSelected.length>0?(deckPickSelected.reduce((s,id)=>s+(CARS[id]?CARS[id].cost:0),0)/deckPickSelected.length).toFixed(1):'0.0';
  ctx.fillStyle='#FFD700';ctx.font='bold '+(statH2*0.5)+'px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('AVG ELIXIR: '+avgCost,W*0.07,statY+statH2/2);
  ctx.fillStyle='#00FF88';ctx.textAlign='right';ctx.fillText('CARDS: '+deckPickSelected.length+'/8',W*0.93,statY+statH2/2);

  menuBtns.deckBuilderBack={x:W*0.05,y:H*0.91,w:W*0.38,h:H*0.055};
  menuBtns.deckBuilderSave={x:W*0.48,y:H*0.91,w:W*0.47,h:H*0.055};
  glowBtn(menuBtns.deckBuilderBack.x,menuBtns.deckBuilderBack.y,menuBtns.deckBuilderBack.w,menuBtns.deckBuilderBack.h,'#1a1a1a','#555','BACK',W*0.034,8,1);
  const canSave=deckPickSelected.length===8;
  ctx.globalAlpha=canSave?1:0.4;
  glowBtn(menuBtns.deckBuilderSave.x,menuBtns.deckBuilderSave.y,menuBtns.deckBuilderSave.w,menuBtns.deckBuilderSave.h,'#0e2a0e','#44FF44',canSave?'SAVE DECK':'Pick 8 Cards',W*0.04,8,2);
  ctx.globalAlpha=1;
}

// ============================================================
// HELPERS
// ============================================================
function rr(x,y,w,h,r){
  r=Math.min(Math.abs(r||0),Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function glowBtn(x,y,w,h,bg,glow,label,fs,radius,sw,textCol){
  ctx.shadowColor=glow;ctx.shadowBlur=10;ctx.fillStyle=bg;rr(x,y,w,h,radius);ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle=glow;ctx.lineWidth=sw;rr(x,y,w,h,radius);ctx.stroke();
  ctx.fillStyle=textCol||'#fff';ctx.font='bold '+fs+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(label,x+w/2,y+h/2+1);
}
function labelTxt(t,x,y,col,font){ctx.fillStyle=col;ctx.font=font;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y);}
function darkBg(){
  const arena=getArena(currentLevel);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,arena.sky1);g.addColorStop(1,arena.sky2);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=arena.n1+'08';ctx.lineWidth=1;
  for(let x=0;x<W;x+=W/18){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=H/28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}
function inRect(x,y,r){return r&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}

// ============================================================
// INPUT
// ============================================================
let touchActive=false;

function handleTap(sx,sy){
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  try{const ac=getAudio();if(ac&&ac.state==='suspended')ac.resume();}catch(e){}

  if(screen==='menu'){
    if(inRect(sx,sy,menuBtns.battle)){screen='mode_select';return;}
    if(inRect(sx,sy,menuBtns.deck)){deckPickSelected=[...playerProfile.deck];screen='deckBuilder';return;}
    if(inRect(sx,sy,menuBtns.collection)){screen='collection';return;}
    if(inRect(sx,sy,menuBtns.carpass)){screen='store';return;}
    if(inRect(sx,sy,menuBtns.store)){screen='store';return;}
    if(inRect(sx,sy,menuBtns.levels)){screen='levels';return;}
    if(inRect(sx,sy,menuBtns.deckBuilder)){deckPickSelected=[...playerProfile.deck];screen='deckBuilder';return;}
    return;
  }
  if(screen==='mode_select'){
    if(menuBtns.modes){
      if(inRect(sx,sy,menuBtns.modes['1v1'])){selectedMode='1v1';initBattle();return;}
      if(inRect(sx,sy,menuBtns.modes['ranked'])){selectedMode='ranked';initBattle();return;}
    }
    if(inRect(sx,sy,menuBtns.back)){screen='menu';return;}
    return;
  }
  if(screen==='levels'){
    for(const[lvl,rect]of Object.entries(levelBtns)){if(inRect(sx,sy,rect)){currentLevel=parseInt(lvl);return;}}
    if(inRect(sx,sy,menuBtns.levelBack)){screen='menu';return;}
    if(inRect(sx,sy,menuBtns.levelPlay)){initBattle();return;}
    return;
  }
  if(screen==='deckBuilder'||screen==='deck_pick'){
    // Preset buttons
    if(menuBtns.presets){
      for(const[k,rect]of Object.entries(menuBtns.presets)){
        if(inRect(sx,sy,rect)){
          const preset=DECK_PRESETS[k];
          if(preset){deckPickSelected=[...preset.ids];return;}
        }
      }
    }
    if(deckBuilderBtns&&deckBuilderBtns.tabs){
      for(const[tab,rect]of Object.entries(deckBuilderBtns.tabs)){if(inRect(sx,sy,rect)){deckBuilderFilter=tab;return;}}
    }
    if(deckBuilderBtns&&deckBuilderBtns.cards){
      for(const[cid,rect]of Object.entries(deckBuilderBtns.cards)){
        if(inRect(sx,sy,rect)){
          const idx=deckPickSelected.indexOf(cid);
          if(idx>=0)deckPickSelected.splice(idx,1);
          else if(deckPickSelected.length<8)deckPickSelected.push(cid);
          return;
        }
      }
    }
    if(inRect(sx,sy,menuBtns.deckBuilderSave)&&deckPickSelected.length===8){playerProfile.deck=[...deckPickSelected];screen='menu';return;}
    if(inRect(sx,sy,menuBtns.deckBuilderBack)){screen='menu';return;}
    return;
  }
  if(screen==='collection'){if(inRect(sx,sy,menuBtns.collBack)){screen='menu';}return;}
  if(screen==='store'){if(inRect(sx,sy,menuBtns.storeBack)){screen='menu';}return;}
  if(screen==='postgame'){
    if(inRect(sx,sy,pgBtn)){initBattle();return;}
    if(inRect(sx,sy,pgMenuBtn)){screen='menu';return;}
    return;
  }
  if(screen!=='battle'||phase==='countdown'||phase==='ended')return;

  // Emoji button
  if(inRect(sx,sy,menuBtns.emojiBtn)){emojiOpen=!emojiOpen;return;}
  if(emojiOpen&&menuBtns.emojis){
    for(const[idx,rect]of Object.entries(menuBtns.emojis)){
      if(inRect(sx,sy,rect)){sendEmoji(parseInt(idx));return;}
    }
    emojiOpen=false;return;
  }

  // Card selection
  for(let i=0;i<4;i++){
    if(inRect(sx,sy,cardSlots[i])){
      const card=CARS[player.hand[i]];if(!card)return;
      if(selectedCard===i)selectedCard=-1;
      else if(player.elixir>=card.cost)selectedCard=i;
      deployPreview=null;return;
    }
  }
  // Deploy
  if(selectedCard>=0&&sy<hudY){
    const[gx,gy]=toGame(sx,sy);
    const card=CARS[player.hand[selectedCard]];
    if(!card||player.elixir<card.cost){selectedCard=-1;return;}
    if(card.type==='spell'||card.type==='building'){
      if(gx>0.5&&gx<ARENA_W-0.5&&gy>0.5&&gy<ARENA_H-0.5){playCard(player,selectedCard,gx,gy);selectedCard=-1;deployPreview=null;}
    } else {
      if(gx>0.5&&gx<ARENA_W-0.5&&gy>RIVER_Y+RIVER_H/2+0.3&&gy<ARENA_H-0.5){playCard(player,selectedCard,gx,gy);selectedCard=-1;deployPreview=null;}
    }
    return;
  }
  if(sy<hudY){selectedCard=-1;deployPreview=null;}
}

function handleMove(sx,sy){
  if(selectedCard>=0&&sy<hudY){const[gx,gy]=toGame(sx,sy);deployPreview={x:gx,y:gy};}
  cardHoverIdx=-1;
  for(let i=0;i<4;i++){if(cardSlots[i]&&inRect(sx,sy,cardSlots[i])){cardHoverIdx=i;break;}}
}

canvas.addEventListener('touchstart',e=>{e.preventDefault();touchActive=true;handleTap(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(touchActive)handleMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();touchActive=false;deployPreview=null;},{passive:false});
canvas.addEventListener('click',e=>{if(!touchActive)handleTap(e.clientX,e.clientY);});
canvas.addEventListener('mousemove',e=>{handleMove(e.clientX,e.clientY);});

// ============================================================
// GAME LOOP
// ============================================================
let lastT=0;
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,0.05);lastT=ts;
  if(screen==='battle')updateBattle(dt);
  render(ts);
  requestAnimationFrame(loop);
}
window.addEventListener('resize',resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
