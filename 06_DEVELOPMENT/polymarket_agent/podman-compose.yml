version: '3.8'

# Polymarket Prediction Agent - Everlight Ventures
# 5-Agent Pipeline: Scanner -> Researcher -> Predictor -> Risk -> Postmortem
# Runs alongside XLM bot on Oracle E5.

services:
  polymarket-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: everlight-polymarket
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN:-}
    volumes:
      - polymarket_data:/app/data
      - polymarket_logs:/app/logs
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - everlight
    # Run full cycle every 5 min via entrypoint loop
    command: >
      sh -c "while true; do python3 main.py full; sleep 300; done"

volumes:
  polymarket_data:
  polymarket_logs:

networks:
  everlight:
    external: true
