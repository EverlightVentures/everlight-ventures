# Categories where live data can be fetched (news headlines, weather data,
# market quotes). Other categories are reference-only -- agents OPEN those
# URLs when they need that capability, rather than us pre-fetching.
fetchable_categories:
  - News & Journalism
  - Weather & Disaster Intel
  - Space & Science
  - Trading & Finance
  - Economics & Markets
  - OSINT & Investigation
  - Health & Environment
  - Aviation & Maritime

# Domain-substring overrides applied BEFORE hint matching. If the domain
# contains one of these tokens, force the named category regardless of OCR
# description. Catches Aviation/Maritime that gets eaten by generic news hints.
domain_overrides:
  Aviation & Maritime: [flight, aviation, adsb, plane, aircraft, airport, marine, vessel, ship, fishing-vessel, helicopter, drone, runway, opensky]
  Real Estate & Property: [zillow, realtor, redfin, attom, parcel, mls, foreclosure, rentometer]
  Trading & Finance: [coingecko, coinmarketcap, tradingview, polygon.io, finnhub, ghostfolio, wealthfolio]
  News & Journalism: [reuters, nytimes, propublica, axios, bbc.com, cnn.com, npr.org, ap.org]
  Weather & Disaster Intel: [noaa, nws.noaa, ventusky, windy.com, fema, usgs.gov]
  Space & Science: [nasa.gov, esa.int, arxiv.org, biorxiv, sciencedirect, nature.com]

# TLD-based overrides applied AFTER hint matching. If domain ends with one of
# these and category is still fallback, force the override.
tld_overrides:
  .gov: Legal & Compliance
  .edu: Education & Training
  .mil: Legal & Compliance
  .ai: AI & Automation
  .health: Health & Environment

fallback:
