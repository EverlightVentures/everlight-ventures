function calc(){
  const g=parseInt(document.getElementById('qg').value)||50;
  const hr=parseInt(document.getElementById('qh').value)||4;
  const loc=document.getElementById('ql').value;
  const nm=document.getElementById('qn').value||'Client';
  const dt=document.getElementById('qd').value;
  const tp=document.getElementById('qt').value;
  const isSF=loc==='sf';
  const rate=isSF?SF[pkg]:R[pkg];
  const base=rate*hr*bts;
  let tv=0,tvL='';
  if(loc==='sm'){tv=10;tvL='Fairfield travel';}
  else if(loc==='sf2'){tv=30;tvL='Vallejo/Benicia travel';}
  else if(loc==='sf'){tv=78;tvL='SF travel + toll';}
  let eT=0,eL=[];
  if(document.getElementById('e1').checked){const c=35*hr;eT+=c;eL.push(['Bar back ('+hr+' hrs)',c]);}
  if(document.getElementById('e2').checked){const c=Math.round(g*2.5);eT+=c;eL.push(['Glassware ('+g+' guests)',c]);}
  if(document.getElementById('e3').checked){eT+=60;eL.push(['Specialty ice',60]);}
  if(document.getElementById('e4').checked){eT+=45;eL.push(['Menu signage',45]);}
  if(document.getElementById('e5').checked){eT+=175;eL.push(['Mocktail station',175]);}
  if(document.getElementById('e6').checked){eT+=150;eL.push(['Shot wall',150]);}
  if(document.getElementById('e7').checked){eT+=225;eL.push(['Champagne tower',225]);}
  if(document.getElementById('e8').checked){eT+=65;eL.push(['Venue coordination',65]);}
  const tot=base+tv+eT;const dep=Math.round(tot*.5);

  let o='<p style="margin:0 0 4px;font-size:11px;color:#c9a84c;text-transform:uppercase;letter-spacing:2px;font-weight:700;">Estimate for</p>';
  o+='<p style="margin:0 0 2px;font-size:18px;font-weight:700;color:#fff;">'+nm+'</p>';
  if(dt)o+='<p style="margin:0 0 2px;font-size:13px;color:#aaa;">'+new Date(dt+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'</p>';
  o+='<p style="margin:0 0 16px;font-size:13px;color:#888;">'+tp+' &bull; '+g+' guests</p>';
  o+='<table style="width:100%;border-collapse:collapse;">';
  o+='<tr><td style="padding:6px 0;color:#ccc;font-size:14px;">'+N[pkg]+(isSF?' (SF)':'')+' &mdash; $'+rate+'/hr x '+hr+'hrs'+(bts>1?' x '+bts:'')+'</td><td style="padding:6px 0;color:#c9a84c;font-weight:700;text-align:right;font-size:14px;">$'+base.toLocaleString()+'</td></tr>';
  if(tv>0)o+='<tr><td style="padding:6px 0;color:#ccc;font-size:14px;">'+tvL+'</td><td style="padding:6px 0;color:#c9a84c;font-weight:600;text-align:right;">$'+tv+'</td></tr>';
  if(loc==='wa')o+='<tr><td style="padding:6px 0;color:#888;font-size:12px;font-style:italic;" colspan="2">WA travel quoted separately</td></tr>';
  eL.forEach(function(x){o+='<tr><td style="padding:6px 0;color:#ccc;font-size:14px;">'+x[0]+'</td><td style="padding:6px 0;color:#c9a84c;font-weight:600;text-align:right;">$'+x[1].toLocaleString()+'</td></tr>';});
  o+='<tr><td colspan="2" style="padding:8px 0 0;border-top:2px solid #c9a84c;"></td></tr>';
  o+='<tr><td style="padding:4px 0;color:#fff;font-size:18px;font-weight:700;">TOTAL</td><td style="padding:4px 0;color:#c9a84c;font-weight:700;text-align:right;font-size:24px;">$'+tot.toLocaleString()+'</td></tr>';
  o+='<tr><td style="padding:4px 0;color:#aaa;font-size:13px;">50% deposit to book</td><td style="padding:4px 0;color:#fff;font-weight:600;text-align:right;">$'+dep.toLocaleString()+'</td></tr>';
  o+='<tr><td style="padding:4px 0;color:#aaa;font-size:13px;">Balance due 7 days before</td><td style="padding:4px 0;color:#fff;font-weight:600;text-align:right;">$'+(tot-dep).toLocaleString()+'</td></tr>';
  o+='</table>';
  document.getElementById('qr').innerHTML=o;

  const td2=Math.round(g*hr*1.5),bt2=Math.round(td2/16),lo=bt2*20,hi=bt2*35;
  let lq='<p style="margin:0 0 8px;font-size:11px;color:#c9a84c;text-transform:uppercase;letter-spacing:2px;font-weight:700;">Client Alcohol Budget</p>';
  lq+='<p style="margin:0;font-size:13px;color:#aaa;">'+g+' guests, '+hr+' hours, moderate drinking:</p>';
  lq+='<table style="width:100%;margin-top:8px;border-collapse:collapse;">';
  lq+='<tr><td style="padding:4px 0;color:#ccc;font-size:13px;">Est. drinks</td><td style="padding:4px 0;color:#fff;font-weight:600;text-align:right;">~'+td2+'</td></tr>';
  lq+='<tr><td style="padding:4px 0;color:#ccc;font-size:13px;">Est. bottles</td><td style="padding:4px 0;color:#fff;font-weight:600;text-align:right;">~'+bt2+'</td></tr>';
  lq+='<tr style="border-top:1px solid #2a2a4a;"><td style="padding:6px 0;color:#ccc;font-size:14px;font-weight:600;">Their alcohol budget</td><td style="padding:6px 0;color:#c9a84c;font-weight:700;text-align:right;font-size:18px;">$'+lo+' - $'+hi+'</td></tr>';
  lq+='</table>';
  lq+='<p style="margin:8px 0 0;font-size:11px;color:#666;font-style:italic;">Separate from your service fee. Shopping list sent after booking.</p>';
  document.getElementById('liq').innerHTML=lq;
}

function genI(){
  const num=document.getElementById('in').value||'PF-001';
  const nm=document.getElementById('ic').value||'Client';
  const dt=document.getElementById('id').value;
  const tp=document.getElementById('it').value||'Event';
  const dep=parseFloat(document.getElementById('ip').value)||0;
  const ds=document.querySelectorAll('.ild'),as=document.querySelectorAll('.ila');
  let lines=[],tot=0;
  for(let i=0;i<ds.length;i++){const d=ds[i].value,a=parseFloat(as[i].value)||0;if(d&&a>0){lines.push([d,a]);tot+=a;}}
  const due=tot-dep;

  let o='<p style="margin:0 0 4px;font-size:11px;color:#c9a84c;text-transform:uppercase;letter-spacing:2px;font-weight:700;">Invoice</p>';
  o+='<div style="display:flex;justify-content:space-between;margin-bottom:16px;">';
  o+='<div><p style="margin:0;font-size:16px;font-weight:700;color:#fff;">Patricia Flores</p><p style="margin:0;font-size:12px;color:#888;">530-761-6711</p></div>';
  o+='<div style="text-align:right;"><p style="margin:0;font-size:14px;font-weight:600;color:#c9a84c;">#'+num+'</p>';
  if(dt)o+='<p style="margin:0;font-size:12px;color:#aaa;">'+new Date(dt+'T12:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})+'</p>';
  o+='</div></div>';
  o+='<div style="background:#111125;border-radius:6px;padding:10px 14px;margin-bottom:12px;"><p style="margin:0;font-size:11px;color:#888;">Bill To:</p><p style="margin:2px 0 0;font-size:15px;font-weight:600;color:#fff;">'+nm+'</p><p style="margin:0;font-size:13px;color:#aaa;">'+tp+'</p></div>';
  o+='<table style="width:100%;border-collapse:collapse;">';
  o+='<tr><td style="padding:6px 0;color:#c9a84c;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #2a2a4a;">Item</td><td style="padding:6px 0;color:#c9a84c;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #2a2a4a;text-align:right;">Amount</td></tr>';
  lines.forEach(function(x){o+='<tr><td style="padding:6px 0;color:#ccc;font-size:14px;border-bottom:1px solid #1a1a2e;">'+x[0]+'</td><td style="padding:6px 0;color:#fff;font-weight:600;font-size:14px;text-align:right;border-bottom:1px solid #1a1a2e;">$'+x[1].toLocaleString()+'</td></tr>';});
  if(!lines.length)o+='<tr><td style="padding:6px 0;color:#666;font-size:13px;font-style:italic;" colspan="2">Add items above</td></tr>';
  o+='<tr><td colspan="2" style="border-top:2px solid #c9a84c;padding:6px 0;"></td></tr>';
  o+='<tr><td style="padding:4px 0;color:#ccc;">Subtotal</td><td style="padding:4px 0;color:#fff;font-weight:600;text-align:right;">$'+tot.toLocaleString()+'</td></tr>';
  if(dep>0)o+='<tr><td style="padding:4px 0;color:#4ade80;">Deposit paid</td><td style="padding:4px 0;color:#4ade80;font-weight:600;text-align:right;">-$'+dep.toLocaleString()+'</td></tr>';
  o+='<tr><td style="padding:6px 0;color:#fff;font-size:18px;font-weight:700;">Balance Due</td><td style="padding:6px 0;color:#c9a84c;font-weight:700;text-align:right;font-size:24px;">$'+Math.max(0,due).toLocaleString()+'</td></tr>';
  o+='</table>';
  document.getElementById('iv').innerHTML=o;
}

const BASE='https://jdqqmsmwmbsnlnstyavl.supabase.co/functions/v1/pf-quote';

function sendQuote(){
  const nm=document.getElementById('qn').value||'Client';
  const dt=document.getElementById('qd').value;
  const tp=document.getElementById('qt').value;
  const g=document.getElementById('qg').value;
  const hr=document.getElementById('qh').value;
  const loc=document.getElementById('ql').value;
  const enhs=[];
  if(document.getElementById('e1').checked)enhs.push('bb');
  if(document.getElementById('e2').checked)enhs.push('gl');
  if(document.getElementById('e3').checked)enhs.push('ice');
  if(document.getElementById('e4').checked)enhs.push('sign');
  if(document.getElementById('e5').checked)enhs.push('mock');
  if(document.getElementById('e6').checked)enhs.push('shots');
  if(document.getElementById('e7').checked)enhs.push('champ');
  if(document.getElementById('e8').checked)enhs.push('coord');
  const p=new URLSearchParams({name:nm,pkg:pkg,guests:g,hours:hr,bts:String(bts),loc:loc,type:tp,mode:'quote'});
  if(dt)p.set('date',dt);
  if(enhs.length)p.set('enh',enhs.join(','));
  const url=BASE+'?'+p.toString();
  document.getElementById('ql-url').value=url;
  document.getElementById('quote-link').style.display='block';
}

function copyLink(){
  const url=document.getElementById('ql-url').value;
  navigator.clipboard.writeText(url).then(()=>{
    document.getElementById('copy-msg').style.display='block';
    setTimeout(()=>document.getElementById('copy-msg').style.display='none',2000);
  }).catch(()=>{document.getElementById('ql-url').select();document.execCommand('copy');document.getElementById('copy-msg').style.display='block';});
  if(navigator.share){navigator.share({title:'Quote from Patricia Flores',text:'Here is your bartending quote:',url:url}).catch(()=>{});}
}

function sendInvoice(){
  const nm=document.getElementById('ic').value||'Client';
  const dt=document.getElementById('id').value;
  const tp=document.getElementById('it').value||'Event';
  const num=document.getElementById('in').value||'PF-001';
