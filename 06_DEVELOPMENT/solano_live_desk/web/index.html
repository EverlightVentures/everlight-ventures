<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solano Live Desk</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0A0A0A" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <header id="bar">
    <strong>Solano Live Desk</strong>
    <span id="live" class="live">&#9679; LIVE</span>
    <span id="posture" class="posture green">GREEN</span>
    <span id="county">locating...</span>
    <span id="spacewx" class="chip" title="geomagnetic / GPS status"></span>
    <select id="day"></select>
    <span id="count">0 incidents</span>
    <button id="sat-toggle" type="button">Satellite</button>
    <button id="air-toggle" type="button">&#9992; Air</button>
    <button id="rail-toggle" type="button">&#128644; Rail</button>
    <button id="evac-toggle" type="button">&#128737; Evac</button>
    <button id="safe-toggle" type="button">&#127973; Safe</button>
    <button id="bus-toggle" type="button">&#128652; Bus</button>
    <button id="cam-toggle" type="button">&#128247; Cams</button>
    <button id="news-toggle" type="button">&#128240; News</button>
    <button id="fused-toggle" type="button">&#9670; Fused</button>
    <button id="disasters-toggle" type="button">&#127983; FEMA</button>
    <button id="route-toggle" type="button">&#129517; Route out</button>
    <label id="scrub">
      <input type="range" id="time" min="0" max="100" value="100" />
      <span id="clock">live</span>
    </label>
  </header>
  <div id="map"></div>

  <aside id="detail" class="hidden">
    <button id="detail-close" type="button" aria-label="close">&times;</button>
    <div id="d-threat" class="d-threat"></div>
    <h2 id="d-title"></h2>
    <div id="d-where" class="d-where">locating...</div>
    <div class="tabbar" id="d-tabs">
      <button class="tab active" data-tab="feed" type="button">Feed</button>
      <button class="tab" data-tab="transcript" type="button">Transcript</button>
      <button class="tab" data-tab="audio" type="button">Audio</button>
      <button class="tab" data-tab="cams" type="button">Cameras</button>
      <button class="tab" data-tab="sources" type="button">Sources</button>
    </div>
    <div class="pane active" data-pane="feed">
      <button id="d-listen" type="button" class="d-listen">&#128266; Listen to report</button>
      <div id="d-story" class="d-story"></div>
    </div>
    <div class="pane" data-pane="transcript">
      <div id="d-transcript" class="d-story"></div>
    </div>
    <div class="pane" data-pane="audio">
      <audio id="d-audio" class="d-audio hidden" controls preload="none"></audio>
      <div id="d-feeds" class="d-feeds"></div>
    </div>
    <div class="pane" data-pane="cams">
      <div id="d-cams" class="d-cams"></div>
    </div>
    <div class="pane" data-pane="sources">
      <div id="d-sources" class="d-story"></div>
    </div>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="vendor/hls.min.js"></script>
  <script src="app.js"></script>
  <script>
    // Offline resilience (works over HTTPS / the survival.everlightventures.io domain).
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {}));
    }
  </script>
</body>
</html>
