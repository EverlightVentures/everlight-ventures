# ============================================
# EMAIL ROUTING RULES
# ============================================
routing:
  # Inbound email handling
  inbound:
    - pattern: "invoice|payment|receipt"
      route_to: [cash, penny]
      cc: admin@everlightventures.io

    - pattern: "contract|agreement|terms|legal"
      route_to: [justine, brief]
      cc: [marcus, admin@everlightventures.io]

    - pattern: "bug|error|broken|down"
      route_to: [quinn, forge]
      cc: [major, admin@everlightventures.io]

    - pattern: "lead|prospect|interested|demo"
      route_to: [filter, scout, piper]
      cc: admin@everlightventures.io

    - pattern: "partnership|collaborate|deal"
      route_to: [scout, cupid, hammer]
      cc: [marcus, admin@everlightventures.io]

    - pattern: "content|blog|article|press"
      route_to: [vera, nora, ink]
      cc: admin@everlightventures.io

    - pattern: "deploy|server|outage|infra"
      route_to: [forge, gears, aria]
      cc: [major, admin@everlightventures.io]

  # Outbound email rules
  outbound:
    # All external-facing emails must go through these agents
    cold_outreach: piper  # Piper owns all cold emails
    distribution: dash    # Dash owns all blast/newsletter emails
    legal_notices: justine  # Justine reviews all legal correspondence
    deal_comms: hammer    # Hammer owns all active deal communication

    # CC rules for outbound
    always_cc_admin: true
    cc_compliance_on: [contracts, legal, financial, broker]

# ============================================
# SETUP INSTRUCTIONS
# ============================================
# Option A: Namecheap Email Forwarding (Free, simplest)
# 1. Log into Namecheap > Domain List > everlightventures.io > Email Forwarding
# 2. Add each employee email as a forwarder to admin@everlightventures.io
# 3. Add group aliases the same way
# 4. Limitation: forwarding only, cannot SEND as these addresses
#
# Option B: Namecheap Private Email (Paid, full send/receive)
# 1. Subscribe to Namecheap Private Email ($1.48/mo per mailbox)
# 2. Create a catch-all or individual mailboxes
# 3. Configure SMTP in the Hive dispatcher to send as each employee
# 4. Best for: outreach (Piper), deals (Hammer), distribution (Dash)
#
# Option C: Google Workspace or Zoho Mail (Full suite)
# 1. Add domain to Google Workspace ($7/user/mo) or Zoho ($1/user/mo)
# 2. Create aliases (free) or full accounts per employee
# 3. Use Gmail API / Zoho API for programmatic send/receive
# 4. Best for: full automation, API access, calendar integration
#
# RECOMMENDED: Start with Option A (free forwarding) for all 40.
# Then add Option B for the 5 outbound-facing agents:
# piper, hammer, dash, scout, rocket
# These 5 need to SEND emails, not just receive.

# ============================================
# SEND-AS PRIORITY (agents that need outbound email)
# ============================================
send_as_priority:
  tier_1_must_send:
    - piper   # Cold outreach -- must send as piper@everlightventures.io
    - hammer  # Deal comms -- must send as hammer@everlightventures.io
    - dash    # Distribution/newsletters -- must send as dash@everlightventures.io
  tier_2_should_send:
    - scout   # Initial contact with prospects
    - rocket  # Launch announcements, Product Hunt outreach
    - marcus  # Executive communications
    - justine # Legal notices and compliance letters
  tier_3_nice_to_have:
    - vera    # Brand communications
    - nora    # Content partnership outreach
    - forge   # Technical partnership comms
