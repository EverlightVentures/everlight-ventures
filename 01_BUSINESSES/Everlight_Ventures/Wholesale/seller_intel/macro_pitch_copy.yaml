# The following are LEGAL but CREEPY phrasings that must NEVER ship.
# Reference only -- to remind future authors what we are NOT trying to write.
_creep_examples_do_not_use:
  - "Saw your county got hit by Hurricane Helene on October 4th at 3:47 AM."
  - "Your block had a 4.2 earthquake at 32.998N, 116.998W last Tuesday."
  - "Your obituary post said the family is splitting the estate three ways."
  - "Noticed your son posted from the property on Instagram in March."
  - "Your LinkedIn says you're retiring next quarter."
  - "Saw your divorce filing on PACER -- we can move quickly."
  - "Found you in a 2019 Equifax breach -- here's our offer."
# All of the above involve REVEALING THE TRAIL. The phrasings above the
# guardrail use the same underlying signal but never expose where it came
# from. That's the Google version: invisible signal, relevant output.
