<!DOCTYPE html>
<!--
  ALLEY KINGZ SHOP -- standalone storefront page.
  Author: Amara Osei (Iron Stack). Self-contained surface; does NOT import
  engine.js or index.html. Open directly:  shop.html?player_id=<id>
  To go live, set the Supabase anon key below (or via window.AK_SUPABASE_ANON_KEY).
  With no key it renders embedded DEMO data, clearly labelled.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Alley Kingz // Chop Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:wght@700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- AK-25D: shared 2.5D "life feel" layer -- MUST load before shop.css so shop's
       own .aks-card rules keep winning the cascade (zero regression on done cards). -->
  <link rel="stylesheet" href="../ak_25d.css?v=1">
  <link rel="stylesheet" href="shop.css?v=1782968342">
  <style>
    html,body{margin:0;height:100%;background:#050507}
    /* Lightweight launcher shown only when the overlay is closed (standalone use). */
    #aks-launch{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      flex-direction:column;gap:18px;background:radial-gradient(900px 500px at 50% 0%,rgba(212,175,55,.10),transparent),#050507;
      color:#E8E8E8;font-family:'Inter',sans-serif;text-align:center;padding:24px}
    #aks-launch h1{font-family:'Playfair Display',serif;color:#D4AF37;font-size:30px;margin:0}
    #aks-launch p{color:#8a8f9c;max-width:440px;line-height:1.6;font-size:13px}
    #aks-launch button{background:#D4AF37;color:#0a0a0a;border:none;padding:14px 28px;border-radius:10px;
      font-weight:800;font-size:15px;cursor:pointer}
  </style>
</head>
<!-- data-akshop-standalone="1" tells shop.js to auto-open on load. -->
<body data-akshop-standalone="1">
  <!-- AK shop ambient video backdrop: menu_bg.mp4 (the only video asset) breathing behind the translucent shop panels -- the operator's "video feel" on the menus -->
  <video id="shop-bg-vid" autoplay loop muted playsinline poster="../assets/ui/lobby_hero.png"><source src="../assets/ui/menu_bg.mp4" type="video/mp4"></video>
  <style>#shop-bg-vid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;opacity:.22;pointer-events:none}</style>
  <script>(function(){var v=document.getElementById('shop-bg-vid');if(v){try{v.muted=true;v.playsInline=true;var p=v.play();if(p&&p.catch)p.catch(function(){});}catch(_e){}}})();</script>
  <!-- AK-BACK: standalone shop always offers the road home (operator 2026-06-12:
       "once I enter the chop shop there's no way for me to go back to the game") -->
  <a id="aks-backlink" href="../">&larr; BACK TO THE ALLEY</a>
  <style>
    #aks-backlink{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;z-index:99999;
      font:800 11px/1 Inter,sans-serif;letter-spacing:.1em;text-decoration:none;
      color:#D4AF37;background:rgba(8,8,14,.92);border:1px solid rgba(212,175,55,.4);
      padding:9px 13px;border-radius:10px}
    #aks-backlink:active{transform:scale(.96)}
  </style>
  <div id="aks-launch">
    <h1>ALLEY KINGZ // CHOP SHOP</h1>
    <p>Back-alley black market for the dog crews. Pull the Lucky Draw for Mythic rigs,
       buy the exact card you want with Scrap, level your crew 1 to 10, stock the garage.
       Real card art, real grit.</p>
    <button onclick="window.AKShop.open({})">Enter the Chop Shop</button>
    <div id="ak-auth"></div>
  </div>
  <style>
    #ak-auth-btn{font:700 11px/1 Inter,sans-serif;letter-spacing:.12em;padding:9px 14px;border-radius:10px;
      cursor:pointer;background:rgba(20,19,31,.88);color:#D4AF37;border:1px solid rgba(212,175,55,.32)}
    #ak-auth-btn.ak-auth-in{color:#9fdc9f;border-color:rgba(120,200,120,.35)}
  </style>

  <!-- account layer: Google sign-in + cloud save + ak_player_id + anon key.
       Sets window.AK_SUPABASE_ANON_KEY and re-opens the shop ONLINE once the
       session restores. Signed out = labelled DEMO data, exactly as before. -->
  <script src="../ak_account.js?v=1782968342"></script>

  <!-- card catalog (window.AK_CARDS, 106 cards) -> drives real-art Card Shop + Draw -->
  <script src="cards_catalog.js?v=1782968342"></script>
  <!-- AK-CARDX: canon stats (window.CANON_CARDS: hp/dmg/cost/range/ability) for the multi-tab card detail -->
  <script src="../canon.js?v=1782968342"></script>
  <!-- AK-LORE: taglines + bios (window.AK_LORE_GET); shop degrades cleanly if absent -->
  <script src="../cards_lore.js?v=1782968342"></script>
  <!-- AK-HANDLER: commander roster (window.AK_HANDLERS) for the Handlers tab -->
  <script src="../handlers_data.js?v=1782968342"></script>
  <script src="../keywords_data.js?v=1782968342"></script>
  <!-- AK-PORT: social.js loaded for AKSocial.claimGrants (grant rail used by Pass/Hit/Crew tabs); its overlay never opens here -->
  <script src="../social.js?v=1782968342"></script>
  <!-- AK-25D: shared 2.5D tilt shim + window.AK25D.apply (de-duped from shop.js) -->
  <script src="../ak_25d.js?v=1"></script>
  <script src="../systems/juice.js?v=1782968342"></script>
  <script src="shop.js?v=1782968342"></script>
</body>
</html>
