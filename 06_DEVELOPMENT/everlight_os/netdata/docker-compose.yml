version: "3.8"

# Netdata Real-Time Server Monitoring -- Oracle ARM64 Free Tier
# Deploy: docker compose up -d
# Access: http://<oracle-ip>:19999
# Zero config needed -- auto-discovers everything

services:
  netdata:
    image: docker.io/netdata/netdata:latest
    container_name: netdata
    restart: always
    ports:
      - "19999:19999"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      TZ: America/Los_Angeles
      # Slack alerts (optional)
      NETDATA_CLAIM_TOKEN: ${NETDATA_CLAIM_TOKEN:-}
      NETDATA_CLAIM_URL: ${NETDATA_CLAIM_URL:-https://app.netdata.cloud}
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - everlight

volumes:
  netdata_config:
  netdata_lib:
  netdata_cache:

networks:
  everlight:
    name: everlight
    external: true
