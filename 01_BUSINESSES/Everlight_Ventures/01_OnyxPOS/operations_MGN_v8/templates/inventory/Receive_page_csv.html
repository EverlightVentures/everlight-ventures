<!-- ADD THIS TO receive.html HEADER ACTIONS SECTION -->

<!-- Replace the existing header_actions block with this: -->

{% block header_actions %}
<a href="{{ url_for('csv_invoice_import') }}" class="btn btn-primary" style="margin-right: 12px;">
  <i data-lucide="file-spreadsheet"></i> CSV Import
</a>
<a href="{{ url_for('inventory') }}" class="btn btn-secondary">
  <i data-lucide="arrow-left"></i> Inventory
</a>
{% endblock %}

<!-- OR add this card at the top of the receive.html content block: -->

<div class="card" style="background: linear-gradient(145deg, rgba(16,185,129,0.12), rgba(16,185,129,0.08)); border-color: rgba(16,185,129,0.3); margin-bottom: 24px;">
  <div style="display: flex; align-items: center; gap: 16px;">
    <div style="font-size: 48px;">📊</div>
    <div style="flex: 1;">
      <h3 style="margin-bottom: 6px;">Bulk Import from CSV</h3>
      <p style="color: rgba(232,245,238,0.75); font-size: 14px; margin: 0;">
        Import vendor invoices directly from CSV files with automatic field mapping
      </p>
    </div>
    <a href="{{ url_for('csv_invoice_import') }}" class="btn btn-primary">
      <i data-lucide="upload"></i> Import CSV
    </a>
  </div>
</div>
