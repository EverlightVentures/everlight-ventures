# Everlight Ventures -- Organizational Portal Registry
# Source of truth for the numbered portal at 127.0.0.1:8800
# Format:
#   number: NN (two-digit, zero-padded)
#   name: display name
#   description: one-liner
#   subcategories: list of subcat slugs
#   source_files: optional map of subcat -> list of {filename, source_path} for files
#     the server should resolve from outside portal_root (e.g. on /sdcard where
#     FAT32/exFAT blocks symlinks). Server reads source_path at request time.
#   external_links: optional list of {label, url} for live apps on other ports

categories:

  - number: "01"
    name: "Wholesale / Broker"
